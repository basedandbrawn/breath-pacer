<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0806">
<title>Breath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0806; --fg:#f0dfc0;
  --panel:#17100a; --panel2:#1f1710; --line:#33241380;
  --rust:#b4441e; --mute:#8b7758;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#0a0806;}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--fg);
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  touch-action:manipulation;
}
#bg{position:fixed;inset:0;background:var(--bg);z-index:0;transition:background-color .34s cubic-bezier(.42,0,.25,1)}
body.slow #bg{transition-duration:1.1s}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.14}100%{opacity:0}}

.screen{position:relative;z-index:1;display:none;flex-direction:column;
  min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px);}
.screen.on{display:flex}

.bebas{font-family:'Bebas Neue',Impact,'Haettenschweiler','Arial Narrow',sans-serif;font-weight:400;letter-spacing:.03em}
.eyebrow{font-size:12px;letter-spacing:.34em;color:var(--mute);text-transform:uppercase;font-weight:500}
.spacer{flex:1 1 auto}

button{font:inherit;color:inherit;background:transparent;border:0;margin:0;padding:0;cursor:pointer}
.btn{display:block;width:100%;padding:20px 16px;border-radius:15px;background:var(--panel2);
  border:1px solid var(--line);color:var(--fg);font-size:14px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;text-align:center}
.btn:active{background:#2b2016}
.btn.go{background:var(--rust);border-color:#d2622f;color:#fff3e3;font-family:'Bebas Neue',Impact,sans-serif;
  font-weight:400;font-size:min(15vw,58px);letter-spacing:.1em;padding:18px 16px 12px;line-height:1}
.btn.huge{font-size:min(26vw,140px);padding:min(14vh,70px) 16px min(11vh,54px);border-radius:26px}
.btn.ghost{background:transparent;border-color:#33241350;color:var(--mute);padding:14px;font-size:12px;letter-spacing:.24em}

.modes{display:flex;flex-direction:column;gap:14px}
.mode{width:100%;text-align:left;padding:26px 24px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.mode:active{background:#241a11}
.mode .t{font-family:'Bebas Neue',Impact,sans-serif;font-size:min(17vw,86px);line-height:.9;letter-spacing:.04em}
.mode .s{font-size:12px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase;margin-top:8px}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #2a1e1340}
.row:last-child{border-bottom:0}
.row.stack{flex-direction:column;align-items:stretch;gap:10px}
.row.stack .seg{justify-content:stretch}
.row.stack .seg button{flex:1 1 0;min-width:0;padding:16px 2px;font-size:10px;letter-spacing:.09em}
.lbl{font-size:12px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase;font-weight:500}
.step{display:flex;align-items:center;gap:2px}
.step button{width:54px;height:54px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);
  font-size:26px;line-height:1;color:var(--fg);display:flex;align-items:center;justify-content:center}
.step button:active{background:#3a2a1c}
.step .v{min-width:74px;text-align:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:38px;line-height:1}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:13px 15px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
  font-size:11px;letter-spacing:.16em;font-weight:600;color:var(--mute);text-transform:uppercase}
.seg button.sel{background:#3b2718;border-color:#6b4a2c;color:var(--fg)}
.card{background:#0f0a06;border:1px solid #26190f;border-radius:18px;padding:6px 18px;margin-bottom:14px}
.counts{display:flex;gap:8px;margin-bottom:14px}
.cnt{flex:1;background:#0f0a06;border:1px solid #26190f;border-radius:16px;padding:12px 6px;text-align:center}
.cnt .cl{font-size:10px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.cnt .cv{font-family:'Bebas Neue',Impact,sans-serif;font-size:34px;line-height:1.05;margin:2px 0 6px}
.cnt .cb{display:flex;gap:4px}
.cnt .cb button{flex:1;height:38px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:19px}
.cnt .cb button:active{background:#3a2a1c}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.foot{display:flex;gap:10px;margin-top:14px}
.foot .btn{flex:1}

/* run screen */
#s-run{padding:calc(env(safe-area-inset-top) + 10px) 0 calc(env(safe-area-inset-bottom) + 10px)}
#endbtn{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 12px);
  z-index:4;padding:12px 16px;font-size:12px;letter-spacing:.22em;color:inherit;opacity:.45;font-weight:600;text-transform:uppercase}
#rmeta{text-align:center;font-size:min(3.9vw,16px);letter-spacing:.16em;font-weight:600;opacity:.62;
  text-transform:uppercase;padding:8px 78px;min-height:24px;white-space:nowrap;overflow:hidden;text-overflow:clip}
#word span{display:inline-block}
#word{overflow:hidden;font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:min(45vw,34vh);line-height:.84;
  text-align:center;white-space:nowrap;letter-spacing:.02em}
#num{font-family:'Bebas Neue',Impact,sans-serif;font-size:min(17vw,13vh);line-height:1;text-align:center;opacity:.45}
#dots{display:flex;flex-wrap:wrap;gap:min(2.6vw,14px);justify-content:center;padding:0 22px}
#dots i{width:min(4.4vw,26px);height:min(4.4vw,26px);border-radius:50%;background:currentColor;opacity:.2}
#dots i.on{opacity:1}
#dots i.cur{opacity:.55}
#bar{height:min(2.4vw,14px);border-radius:99px;background:currentColor;opacity:.18;margin:0 22px}
#bar span{display:block;height:100%;border-radius:99px;background:currentColor;opacity:1}
#clock{font-family:'Bebas Neue',Impact,sans-serif;font-size:min(22vw,16vh);line-height:1;text-align:center}
#runfoot{padding:0 20px;display:flex;flex-direction:column;gap:10px}
#runfoot .btn{border-color:currentColor;color:inherit;background:transparent;opacity:.9}
#runfoot .btn.wide{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:min(12vw,54px);
  letter-spacing:.1em;padding:16px 10px 10px;line-height:1}
#runfoot .btn:active{background:#ffffff18}
.hid{display:none !important}
#s-run .mid{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:min(3vh,22px)}

/* stats */
.stat{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0;border-bottom:1px solid #2a1e1340}
.stat .n{font-family:'Bebas Neue',Impact,sans-serif;font-size:44px;line-height:1}
.log{font-size:13px;color:#c9b493;padding:11px 0;border-bottom:1px solid #2a1e1330;display:flex;justify-content:space-between;gap:10px}
.log .d{color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
h1.big{font-family:'Bebas Neue',Impact,sans-serif;font-size:min(19vw,84px);line-height:.92;margin:0 0 4px;letter-spacing:.04em}
</style>
</head>
<body>
<div id="bg"></div>
<div id="flash"></div>

<!-- MODE PICK -->
<section id="s-mode" class="screen on">
  <div class="spacer"></div>
  <div class="modes">
    <button class="mode" data-go="lift"><div class="t">LIFT</div><div class="s">sets · reps · rest</div></button>
    <button class="mode" data-go="sleep"><div class="t">SLEEP</div><div class="s">cycles</div></button>
    <button class="mode" data-go="drive"><div class="t">DRIVE</div><div class="s">audio only</div></button>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost" data-go="stats">Stats</button>
</section>

<!-- LIFT SETUP -->
<section id="s-lift" class="screen">
  <div class="top"><span class="eyebrow">Lift</span><button class="btn ghost" style="width:auto;padding:10px 16px" data-go="mode">Back</button></div>
  <div class="scroll">
    <div class="card">
      <div class="row"><span class="lbl">Mode</span>
        <div class="seg" id="seg-hold">
          <button data-hold="0">Reps</button><button data-hold="1">Hold</button>
        </div></div>
      <div class="row" id="row-reps"><span class="lbl">Reps</span>
        <div class="step"><button data-s="reps:-1">−</button><span class="v" id="v-reps">10</span><button data-s="reps:1">+</button></div></div>
      <div class="row hid" id="row-hsec"><span class="lbl">Seconds</span>
        <div class="step"><button data-s="holdSec:-5">−</button><span class="v" id="v-holdSec">45</span><button data-s="holdSec:5">+</button></div></div>
      <div class="row"><span class="lbl">Sets</span>
        <div class="step"><button data-s="sets:-1">−</button><span class="v" id="v-sets">4</span><button data-s="sets:1">+</button></div></div>
    </div>

    <div class="counts">
      <div class="cnt"><div class="cl">In</div><div class="cv" id="v-in">4</div>
        <div class="cb"><button data-s="in:-0.5">−</button><button data-s="in:0.5">+</button></div></div>
      <div class="cnt"><div class="cl">Hold</div><div class="cv" id="v-hold">2</div>
        <div class="cb"><button data-s="hold:-0.5">−</button><button data-s="hold:0.5">+</button></div></div>
      <div class="cnt"><div class="cl">Out</div><div class="cv" id="v-out">6</div>
        <div class="cb"><button data-s="out:-0.5">−</button><button data-s="out:0.5">+</button></div></div>
      <div class="cnt"><div class="cl">Empty</div><div class="cv" id="v-empty">0</div>
        <div class="cb"><button data-s="empty:-0.5">−</button><button data-s="empty:0.5">+</button></div></div>
    </div>

    <div class="card">
      <div class="row stack"><span class="lbl">Lift type</span>
        <div class="seg" id="seg-type">
          <button data-type="compound">Compound</button><button data-type="isolation">Isolation</button>
        </div></div>
      <div class="row"><span class="lbl">Rest</span>
        <div class="step"><button data-s="rest:-15">−</button><span class="v" id="v-rest">3:00</span><button data-s="rest:15">+</button></div></div>
    </div>

    <div class="card">
      <div class="row stack"><span class="lbl">Sound</span>
        <div class="seg sound" data-for="lift"></div></div>
      <div class="row"><span class="lbl">Voice “go”</span>
        <div class="seg voice"><button data-voice="1">Listen</button></div></div>
    </div>
  </div>
  <div class="foot"><button class="btn go" data-start="lift">Start</button></div>
</section>

<!-- SLEEP SETUP -->
<section id="s-sleep" class="screen">
  <div class="top"><span class="eyebrow">Sleep</span><button class="btn ghost" style="width:auto;padding:10px 16px" data-go="mode">Back</button></div>
  <div class="scroll">
    <div class="card">
      <div class="row"><span class="lbl">Pattern</span>
        <div class="seg" id="seg-pat"><button data-pat="478">4 · 7 · 8</button><button data-pat="coh">5.5 · 5.5</button></div></div>
      <div class="row"><span class="lbl">Cycles</span>
        <div class="step"><button data-s="cycles:-1">−</button><span class="v" id="v-cycles">8</span><button data-s="cycles:1">+</button></div></div>
    </div>
    <div class="card">
      <div class="row stack"><span class="lbl">Sound</span><div class="seg sound" data-for="sleep"></div></div>
      <div class="row"><span class="lbl">Voice “go”</span><div class="seg voice"><button data-voice="1">Listen</button></div></div>
    </div>
  </div>
  <div class="foot"><button class="btn go" data-start="sleep">Start</button></div>
</section>

<!-- DRIVE SETUP -->
<section id="s-drive" class="screen">
  <div class="top"><span class="eyebrow">Drive</span><button class="btn ghost" style="width:auto;padding:10px 16px" data-go="mode">Back</button></div>
  <div class="spacer"></div>
  <button class="btn go huge" data-start="drive">Start</button>
  <div class="spacer"></div>
  <div class="card"><div class="row stack"><span class="lbl">Sound</span><div class="seg sound" data-for="drive"></div></div></div>
</section>

<!-- RUN -->
<section id="s-run" class="screen">
  <button id="endbtn">End</button>
  <div id="rmeta"></div>
  <div class="mid">
    <div id="word"><span></span></div>
    <div id="num"></div>
    <div id="clock" class="hid"></div>
    <div id="dots"></div>
    <div id="bar" class="hid"><span></span></div>
  </div>
  <div id="runfoot">
    <button class="btn wide hid" id="b-skip">Skip rest</button>
    <button class="btn hid" id="b-save">Save set</button>
    <button class="btn hid" id="b-back">Back</button>
  </div>
</section>

<!-- STATS -->
<section id="s-stats" class="screen">
  <div class="top"><span class="eyebrow">Stats</span><button class="btn ghost" style="width:auto;padding:10px 16px" data-go="mode">Back</button></div>
  <div class="scroll" id="statbody"></div>
  <div class="foot"><button class="btn ghost" id="b-reset">Clear data</button></div>
</section>

<script>
(function(){
"use strict";

/* ============================ STORAGE ============================ */
var KEY = "bp.v1";
var DEF = {
  cfg: {
    lift:  {reps:10, sets:4, "in":4, hold:2, out:6, empty:0, rest:180, type:"compound", holdMode:0, holdSec:45, sound:"music"},
    sleep: {cycles:8, pat:"478", sound:"music"},
    drive: {sound:"music"}
  },
  stats: {sec:0, modes:{lift:0, sleep:0, drive:0}, log:[]}
};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var DB = clone(DEF);
try{
  var raw = JSON.parse(localStorage.getItem(KEY) || "{}");
  if(raw && raw.cfg){ for(var m in DB.cfg){ if(raw.cfg[m]) for(var k in DB.cfg[m]) if(raw.cfg[m][k] !== undefined) DB.cfg[m][k] = raw.cfg[m][k]; } }
  if(raw && raw.stats){
    DB.stats.sec = raw.stats.sec || 0;
    if(raw.stats.modes) for(var mm in DB.stats.modes) DB.stats.modes[mm] = raw.stats.modes[mm] || 0;
    DB.stats.log = raw.stats.log || [];
  }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

/* ============================ AUDIO ============================ */
var A = null;           // {ctx, bus, master, ...}
var scheme = null;      // active sound scheme
var lastPiano = -99;

function easeIO(p){ return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2; }
function easeOut(p){ return 1 - Math.pow(1-p, 3); }
function easeIn(p){ return p*p*p; }

/* Eased parameter envelope: a smooth curve approximated by many short
   segments. Never a single straight line from A to B. */
function env(param, from, to, at, dur, shape){
  if(!A) return;
  var ctx = A.ctx, now = ctx.currentTime;
  var t0 = at < now ? now : at;
  shape = shape || easeIO;
  try{
    if(param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t0);
    else param.cancelScheduledValues(t0);
  }catch(e){ try{ param.cancelScheduledValues(t0); }catch(e2){} }
  var start = (at <= now + 0.03) ? param.value : from;
  if(!isFinite(start)) start = from;
  param.setValueAtTime(start, t0);
  var N = 26, i, p;
  for(i=1; i<=N; i++){
    p = i/N;
    param.linearRampToValueAtTime(start + (to-start)*shape(p), t0 + dur*p);
  }
}
function setSoon(param, v, at, dur){ env(param, param.value, v, at, dur || 0.25); }

function noiseBuffer(ctx, sec, brown){
  var len = Math.floor(ctx.sampleRate * sec);
  var b = ctx.createBuffer(2, len, ctx.sampleRate), c, d, i, w, last;
  for(c=0;c<2;c++){
    d = b.getChannelData(c); last = 0;
    for(i=0;i<len;i++){
      w = Math.random()*2 - 1;
      if(brown){ last = (last + 0.02*w) / 1.02; d[i] = last * 3.6; }
      else d[i] = w;
    }
  }
  return b;
}

/* ~5 second room, smooth and dark */
function makeIR(ctx, sec){
  var rate = ctx.sampleRate, len = Math.floor(rate * sec);
  var b = ctx.createBuffer(2, len, rate), c, d, i, t, w, last, env2;
  for(c=0;c<2;c++){
    d = b.getChannelData(c); last = 0;
    for(i=0;i<len;i++){
      t = i/len;
      w = Math.random()*2 - 1;
      last = (last + 0.28*w) / 1.28;          // dark diffusion
      env2 = Math.pow(1-t, 2.6) * (1 - Math.exp(-i/(rate*0.012)));
      d[i] = (last*2.4 + w*0.22) * env2;
    }
    // a few early reflections
    var refl = [0.011,0.019,0.031,0.047,0.066];
    for(var r=0;r<refl.length;r++){
      var idx = Math.floor(refl[r]*rate) + (c ? 37 : 0);
      if(idx < len) d[idx] += (r%2 ? -1 : 1) * 0.34 / (r+1);
    }
  }
  return b;
}

function initAudio(){
  if(A) return A;
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  var ctx = new AC();
  var master = ctx.createGain(); master.gain.value = 0.0001;
  var lim = ctx.createDynamicsCompressor();
  try{
    lim.threshold.value = -8; lim.knee.value = 22; lim.ratio.value = 4;
    lim.attack.value = 0.02; lim.release.value = 0.5;
  }catch(e){}
  var roll = ctx.createBiquadFilter(); roll.type = "lowpass"; roll.frequency.value = 4200; roll.Q.value = 0.4;
  var shelf = ctx.createBiquadFilter(); shelf.type = "highshelf"; shelf.frequency.value = 2200; shelf.gain.value = -8;
  roll.connect(shelf); shelf.connect(lim); lim.connect(master); master.connect(ctx.destination);

  var bus = ctx.createGain(); bus.gain.value = 1;
  var dry = ctx.createGain(); dry.gain.value = 0.68;
  var wet = ctx.createGain(); wet.gain.value = 0.62;
  var conv = ctx.createConvolver(); conv.normalize = true;
  try{ conv.buffer = makeIR(ctx, 5.2); }catch(e){}
  bus.connect(dry); dry.connect(roll);
  bus.connect(conv); conv.connect(wet); wet.connect(roll);

  A = {ctx:ctx, bus:bus, master:master, roll:roll, wet:wet, dry:dry, nodes:[]};
  return A;
}
function keep(n){ A.nodes.push(n); return n; }

/* ---- building blocks ---- */
function mkRain(level){
  var ctx = A.ctx;
  var src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx, 4, false); src.loop = true;
  var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 780; hp.Q.value = 0.5;
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 4800; lp.Q.value = 0.4;
  var g = ctx.createGain(); g.gain.value = level;
  var lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.06;
  var lg = ctx.createGain(); lg.gain.value = level * 0.34;
  lfo.connect(lg); lg.connect(g.gain); lfo.start();
  var lfo2 = ctx.createOscillator(); lfo2.type = "sine"; lfo2.frequency.value = 0.021;
  var lg2 = ctx.createGain(); lg2.gain.value = 900;
  lfo2.connect(lg2); lg2.connect(lp.frequency); lfo2.start();
  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(A.bus); src.start();
  keep(src); keep(lfo); keep(lfo2);
  return g;
}

function mkDrone(level){
  var ctx = A.ctx;
  var g = ctx.createGain(); g.gain.value = 0.0001;
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 380; lp.Q.value = 1.4;
  var cents = [0, -7, 6, -13];
  for(var i=0;i<cents.length;i++){
    var o = ctx.createOscillator();
    o.type = i === 3 ? "triangle" : "sawtooth";
    o.frequency.value = 73.416;                 // D2
    o.detune.value = cents[i];
    var vg = ctx.createGain(); vg.gain.value = i === 3 ? 0.5 : 0.3;
    o.connect(vg); vg.connect(g); o.start(); keep(o);
  }
  // slow bow movement
  var lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.037;
  var lg = ctx.createGain(); lg.gain.value = 140;
  lfo.connect(lg); lg.connect(lp.frequency); lfo.start(); keep(lfo);
  g.connect(lp); lp.connect(A.bus);
  return {g:g, lp:lp, level:level};
}

function mkStrings(){
  var ctx = A.ctx;
  var out = ctx.createGain(); out.gain.value = 0.0001;
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700; lp.Q.value = 0.9;
  var pre = ctx.createGain(); pre.gain.value = 0.24;
  pre.connect(lp); lp.connect(out); out.connect(A.bus);

  // slowly moving filter, independent of the breath
  var flfo = ctx.createOscillator(); flfo.type = "sine"; flfo.frequency.value = 0.043;
  var fg = ctx.createGain(); fg.gain.value = 260;
  flfo.connect(fg); fg.connect(lp.frequency); flfo.start(); keep(flfo);

  // ensemble vibrato
  var vib = ctx.createOscillator(); vib.type = "sine"; vib.frequency.value = 4.9;
  var vibDepth = ctx.createGain(); vibDepth.gain.value = 5.5;
  vib.connect(vibDepth); vib.start(); keep(vib);
  var vlfo = ctx.createOscillator(); vlfo.type = "sine"; vlfo.frequency.value = 0.09;
  var vlg = ctx.createGain(); vlg.gain.value = 3.2;
  vlfo.connect(vlg); vlg.connect(vibDepth.gain); vlfo.start(); keep(vlfo);

  var voices = [], spread = [0, 9, -8, 15, -16];
  for(var v=0; v<5; v++){
    var vg = ctx.createGain(); vg.gain.value = 0.34 - v*0.035;
    vg.connect(pre);
    var oscs = [];
    for(var d=0; d<spread.length; d++){
      var o = ctx.createOscillator(); o.type = "sawtooth";
      o.frequency.value = 146.83;
      o.detune.value = spread[d] + (v*2 - 4);
      vibDepth.connect(o.detune);
      var og = ctx.createGain(); og.gain.value = 0.22;
      o.connect(og); og.connect(vg); o.start(); keep(o);
      oscs.push(o);
    }
    voices.push({oscs:oscs, f:146.83});
  }
  return {out:out, lp:lp, voices:voices};
}

function chordTo(st, freqs, at, glide){
  for(var i=0;i<st.voices.length;i++){
    var v = st.voices[i], f = freqs[Math.min(i, freqs.length-1)];
    if(Math.abs(f - v.f) < 0.01) continue;
    for(var j=0;j<v.oscs.length;j++){
      var p = v.oscs[j].frequency;
      try{
        if(p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(at); else p.cancelScheduledValues(at);
      }catch(e){}
      p.setValueAtTime(v.f, at);
      p.exponentialRampToValueAtTime(f, at + glide);
    }
    v.f = f;
  }
}

/* piano: inharmonic partials, independent decay per partial */
function piano(freq, at, vel){
  if(at - lastPiano < 0.4) return;
  lastPiano = at;
  var ctx = A.ctx;
  var out = ctx.createGain(); out.gain.value = 1;
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600; lp.Q.value = 0.5;
  out.connect(lp); lp.connect(A.bus);
  var B = 0.00058, maxDec = 0;
  for(var n=1; n<=9; n++){
    var f = freq * n * Math.sqrt(1 + B*n*n);
    if(f > 7000) break;
    var o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f;
    o.detune.value = (n % 2 ? 1 : -1) * (1.4 + n * 0.85);   // partials pulled off the grid
    var g = ctx.createGain();
    var amp = vel * Math.pow(n, -1.75) * (n === 1 ? 1 : 0.86);
    var dec = 5.4 / Math.pow(n, 0.62);                       // highs die first
    if(dec > maxDec) maxDec = dec;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(amp, at + 0.008 + n*0.0015);
    g.gain.exponentialRampToValueAtTime(0.00008, at + dec);
    o.connect(g); g.connect(out);
    o.start(at); o.stop(at + dec + 0.05);
  }
  setTimeout(function(){ try{ out.disconnect(); lp.disconnect(); }catch(e){} }, (maxDec + at - ctx.currentTime + 0.4) * 1000);
}

function mkBreathNoise(){
  var ctx = A.ctx;
  var src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx, 5, true); src.loop = true;
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1250; lp.Q.value = 0.7;
  var lp2 = ctx.createBiquadFilter(); lp2.type = "lowpass"; lp2.frequency.value = 1600; lp2.Q.value = 0.4;
  var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 110; hp.Q.value = 0.5;
  var g = ctx.createGain(); g.gain.value = 0.0001;
  src.connect(hp); hp.connect(lp); lp.connect(lp2); lp2.connect(g); g.connect(A.bus);
  src.start(); keep(src);
  return {g:g, lp:lp};
}

function mkTone(){
  var ctx = A.ctx;
  var g = ctx.createGain(); g.gain.value = 0.0001;
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400; lp.Q.value = 0.6;
  var parts = [{r:1, t:"sine", a:0.55}, {r:1.5, t:"sine", a:0.2}, {r:0.5, t:"triangle", a:0.3}, {r:2.01, t:"sine", a:0.07}];
  var oscs = [];
  for(var i=0;i<parts.length;i++){
    var o = ctx.createOscillator(); o.type = parts[i].t;
    o.frequency.value = 174.61 * parts[i].r;
    o.detune.value = (i%2?4:-3);
    var og = ctx.createGain(); og.gain.value = parts[i].a;
    o.connect(og); og.connect(g); o.start(); keep(o);
    oscs.push({o:o, r:parts[i].r});
  }
  var vib = ctx.createOscillator(); vib.frequency.value = 4.2;
  var vg = ctx.createGain(); vg.gain.value = 3.5;
  vib.connect(vg); vib.start(); keep(vib);
  for(var k=0;k<oscs.length;k++) vg.connect(oscs[k].o.detune);
  g.connect(lp); lp.connect(A.bus);
  return {g:g, lp:lp, oscs:oscs, base:174.61};
}

function toneGlide(tn, mult, at, dur){
  for(var i=0;i<tn.oscs.length;i++){
    var p = tn.oscs[i].o.frequency, target = tn.base * tn.oscs[i].r * mult;
    try{ if(p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(at); else p.cancelScheduledValues(at); }catch(e){}
    p.setValueAtTime(p.value, at);
    p.exponentialRampToValueAtTime(target, at + Math.max(dur*0.85, 0.2));
  }
}

/* ---- chords ---- */
var CH = {
  dm:   [146.83, 174.61, 220.00, 293.66, 349.23],   // D minor
  sus:  [146.83, 196.00, 220.00, 293.66, 329.63],   // suspended, unresolved
  bb:   [116.54, 146.83, 174.61, 233.08, 293.66]    // B flat
};

/* ---- scheme ---- */
function makeScheme(name, dim){
  var s = {name:name, dim:dim ? 1 : 0};
  var k = dim ? 0.72 : 1;
  if(!A) return null;
  A.roll.frequency.value = dim ? 2400 : 4200;

  if(name === "music"){
    s.rain = mkRain(0.05*k); s.drone = mkDrone(0.075*k); s.st = mkStrings(); s.piano = true; s.chords = true;
  }else if(name === "calm"){
    s.rain = mkRain(0.028*k); s.drone = mkDrone(0.05*k); s.st = mkStrings(); s.piano = false; s.chords = false;
  }else if(name === "breath"){
    s.bn = mkBreathNoise();
  }else if(name === "tone"){
    s.tn = mkTone();
  }
  s.k = k;
  return s;
}

function schemePhase(kind, at, dur){
  if(!scheme || !A) return;
  var s = scheme, k = s.k, g = Math.max(dur, 0.35);
  var glide = Math.min(0.6, g*0.45);

  if(s.drone){
    var dl = s.drone.level;
    if(kind === "in")        env(s.drone.g.gain, dl*0.85, dl*1.15, at, g, easeIO);
    else if(kind === "hold") env(s.drone.g.gain, dl*1.15, dl*1.05, at, g, easeIO);
    else if(kind === "out")  env(s.drone.g.gain, dl*1.05, dl*0.8,  at, g, easeIO);
    else if(kind === "empty")env(s.drone.g.gain, dl*0.8,  dl*0.6,  at, g, easeIO);
    else                     env(s.drone.g.gain, 0.0001,  dl*0.7,  at, Math.min(g, 3.2), easeOut);
  }

  if(s.st){
    var hi = 0.30*k, lo = 0.045*k;
    if(kind === "in"){
      if(s.chords) chordTo(s.st, CH.dm, at, glide);
      env(s.st.out.gain, lo, hi, at, g, easeIO);
      env(s.st.lp.frequency, 700, 2050, at, g, easeIO);
      if(s.piano) piano(293.66, at + 0.02, 0.20);
    }else if(kind === "hold"){
      if(s.chords) chordTo(s.st, CH.sus, at, glide);
      env(s.st.out.gain, hi, hi*0.88, at, g, easeIO);
      env(s.st.lp.frequency, 2050, 1550, at, g, easeIO);
      if(s.piano) piano(329.63, at + 0.02, 0.12);
    }else if(kind === "out"){
      if(s.chords) chordTo(s.st, CH.bb, at, glide);
      env(s.st.out.gain, hi*0.88, lo*1.2, at, g, easeIO);
      env(s.st.lp.frequency, 1550, 640, at, g, easeIO);
      if(s.piano) piano(233.08, at + 0.02, 0.17);
    }else if(kind === "empty"){
      env(s.st.out.gain, lo*1.2, lo*0.35, at, g, easeIn);
      env(s.st.lp.frequency, 640, 480, at, g, easeIO);
    }else{ // getset / idle
      if(s.chords) chordTo(s.st, CH.dm, at, 1.2);
      env(s.st.out.gain, 0.0001, lo, at, Math.min(g, 3), easeOut);
      env(s.st.lp.frequency, 480, 700, at, Math.min(g, 3), easeOut);
    }
  }

  if(s.bn){
    var top = 0.30*k;
    if(kind === "in"){
      env(s.bn.g.gain, 0.02, top, at, g, easeIO);
      env(s.bn.lp.frequency, 520, 1250, at, g, easeIO);
    }else if(kind === "hold"){
      env(s.bn.g.gain, top, 0.06*k, at, g*0.4, easeOut);
      env(s.bn.lp.frequency, 1250, 860, at, g, easeIO);
    }else if(kind === "out"){
      // a fresh exhale: brief lift, then a long eased fall
      env(s.bn.g.gain, s.bn.g.gain.value, 0.26*k, at, g*0.14, easeOut);
      env(s.bn.g.gain, 0.26*k, 0.012, at + g*0.14, g*0.86, easeIO);
      env(s.bn.lp.frequency, 1250, 420, at, g, easeIO);
    }else if(kind === "empty"){
      env(s.bn.g.gain, 0.012, 0.004, at, g, easeIn);
      env(s.bn.lp.frequency, 420, 320, at, g, easeIO);
    }else{
      env(s.bn.g.gain, 0.0001, 0.02, at, Math.min(g,2.5), easeOut);
    }
  }

  if(s.tn){
    var th = 0.17*k;
    if(kind === "in"){
      toneGlide(s.tn, 1.3348, at, g);
      env(s.tn.g.gain, 0.02, th, at, g, easeIO);
      env(s.tn.lp.frequency, 900, 1900, at, g, easeIO);
    }else if(kind === "hold"){
      env(s.tn.g.gain, th, th*0.82, at, g, easeIO);
      env(s.tn.lp.frequency, 1900, 1500, at, g, easeIO);
    }else if(kind === "out"){
      toneGlide(s.tn, 1.0, at, g);
      env(s.tn.g.gain, th*0.82, 0.018, at, g, easeIO);
      env(s.tn.lp.frequency, 1500, 780, at, g, easeIO);
    }else if(kind === "empty"){
      env(s.tn.g.gain, 0.018, 0.006, at, g, easeIn);
    }else{
      env(s.tn.g.gain, 0.0001, 0.02, at, Math.min(g,2.5), easeOut);
    }
  }
}

function audioStart(mode, sound){
  initAudio();
  if(!A) return;
  if(A.ctx.state === "suspended"){ try{ A.ctx.resume(); }catch(e){} }
  teardownScheme();
  lastPiano = -99;
  if(sound !== "off") scheme = makeScheme(sound, mode === "sleep");
  var lvl = mode === "sleep" ? 0.62 : 0.92;
  env(A.master.gain, 0.0001, lvl, A.ctx.currentTime + 0.02, mode === "sleep" ? 3.2 : 1.6, easeOut);
}
function teardownScheme(){
  if(!A) return;
  for(var i=0;i<A.nodes.length;i++){ try{ A.nodes[i].stop(); }catch(e){} try{ A.nodes[i].disconnect(); }catch(e){} }
  A.nodes = [];
  scheme = null;
}
function audioStop(){
  if(!A) return;
  var t = A.ctx.currentTime;
  env(A.master.gain, A.master.gain.value, 0.0001, t, 1.4, easeIn);
  setTimeout(teardownScheme, 1700);
}

var wl = null;
function wake(on){
  try{
    if(on){
      if("wakeLock" in navigator && !wl){
        navigator.wakeLock.request("screen").then(function(l){
          wl = l; l.addEventListener("release", function(){ wl = null; });
        }, function(){ wl = null; });
      }
    }else if(wl){ wl.release(); wl = null; }
  }catch(e){ wl = null; }
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible"){
    if(S.running){ wake(true); if(A && A.ctx.state === "suspended"){ try{A.ctx.resume();}catch(e){} } }
  }
});

/* ============================ SESSION ============================ */
var LEAD = 0.12;
var S = {running:false, mode:"lift", sound:"music", steps:[], idx:0, stepStart:0, schedIdx:-1,
         reps:10, sets:4, restDur:180, holdMode:0, holdSec:45, startedAt:0, recorded:{}, ended:false};

function ph(kind, dur, stage, setNo, rep){
  return {k:kind, dur:dur, stage:stage, set:setNo, rep:rep};
}
function pushCycle(arr, c, stage, setNo, rep){
  if(c["in"]  > 0) arr.push(ph("in",    c["in"],  stage, setNo, rep));
  if(c.hold   > 0) arr.push(ph("hold",  c.hold,   stage, setNo, rep));
  if(c.out    > 0) arr.push(ph("out",   c.out,    stage, setNo, rep));
  if(c.empty  > 0) arr.push(ph("empty", c.empty,  stage, setNo, rep));
}
function trimTo(arr, from, total){
  var acc = 0, i;
  for(i=from; i<arr.length; i++){
    if(acc + arr[i].dur >= total - 0.001){
      arr[i].dur = Math.max(total - acc, 0);
      arr.length = i + 1;
      if(arr[arr.length-1].dur < 0.4 && arr.length > from + 1) arr.length = arr.length - 1;
      return;
    }
    acc += arr[i].dur;
  }
}
function coherentSteps(seconds, stage, setNo){
  var out = [], n = Math.ceil(seconds / 11) * 2 + 2, i;
  for(i=0;i<n;i++) out.push(ph(i % 2 ? "out" : "in", 5.5, stage, setNo, 0));
  trimTo(out, 0, seconds);
  return out;
}

function buildSteps(){
  var st = [], c = DB.cfg, i, s, r;
  if(S.mode === "lift"){
    var L = c.lift;
    var counts = S.holdMode ? {"in":4, hold:0, out:8, empty:2}
                            : {"in":+L["in"], hold:+L.hold, out:+L.out, empty:+L.empty};
    for(s=1; s<=S.sets; s++){
      st.push(ph("getset", 5, "getset", s, 0));
      var mark = st.length;
      if(S.holdMode){
        var cyc = counts["in"] + counts.hold + counts.out + counts.empty;
        var reps = Math.ceil(S.holdSec / cyc) + 1;
        for(r=1; r<=reps; r++) pushCycle(st, counts, "set", s, r);
        trimTo(st, mark, S.holdSec);
      }else{
        for(r=1; r<=S.reps; r++) pushCycle(st, counts, "set", s, r);
      }
      if(s < S.sets){
        var rest = coherentSteps(S.restDur, "rest", s);
        for(i=0;i<rest.length;i++) st.push(rest[i]);
      }
    }
  }else if(S.mode === "sleep"){
    var P = c.sleep;
    var cc = P.pat === "coh" ? {"in":5.5, hold:0, out:5.5, empty:0} : {"in":4, hold:7, out:8, empty:0};
    st.push(ph("getset", 5, "getset", 1, 0));
    for(r=1; r<=P.cycles; r++) pushCycle(st, cc, "set", 1, r);
  }else{
    st.push(ph("getset", 4, "getset", 1, 0));
    var d = coherentSteps(60*90, "drive", 1);
    for(i=0;i<d.length;i++) st.push(d[i]);
  }
  st.push(ph("done", 1e9, "done", 0, 0));
  return st;
}

function startSession(mode){
  var c = DB.cfg;
  S.mode = mode;
  S.sound = c[mode].sound;
  if(mode === "lift"){
    S.reps = c.lift.reps; S.sets = c.lift.sets; S.restDur = c.lift.rest;
    S.holdMode = c.lift.holdMode ? 1 : 0; S.holdSec = c.lift.holdSec;
  }else if(mode === "sleep"){
    S.reps = c.sleep.cycles; S.sets = 1; S.holdMode = 0;
  }else{
    S.reps = 0; S.sets = 1; S.holdMode = 0;
  }
  audioStart(mode, S.sound);
  if(!A){ return; }
  S.steps = buildSteps();
  S.idx = 0; S.schedIdx = -1; S.ended = false; S.recorded = {};
  S.stepStart = A.ctx.currentTime + 0.18;
  S.startedAt = A.ctx.currentTime;
  S.running = true;
  document.body.classList.toggle("slow", mode === "sleep");
  show("run");
  wake(true);
  lastWord = lastNum = lastClock = lastMeta = lastBg = null;
  buildDots();
  elBarIn.style.width = "0%";
  if(!raf) raf = requestAnimationFrame(tick);
}

function endSession(natural){
  if(!S.running) return;
  S.running = false;
  var elapsed = A ? Math.max(0, A.ctx.currentTime - S.startedAt) : 0;
  DB.stats.sec += elapsed;
  DB.stats.modes[S.mode] = (DB.stats.modes[S.mode] || 0) + elapsed;
  save();
  audioStop();
  wake(false);
  S.ended = true;
  if(!natural){ show(S.mode); document.body.classList.remove("slow"); }
  else{ paint("done"); }
}

function recordSet(setNo, done){
  if(S.mode === "drive") return;
  var id = S.mode + ":" + setNo;
  if(S.recorded[id]) return;
  S.recorded[id] = 1;
  var target = S.holdMode ? S.holdSec : S.reps;
  DB.stats.log.unshift({
    t: Date.now(), m: S.mode, s: setNo, of: S.sets,
    d: Math.round(done*10)/10, g: target, h: S.holdMode ? 1 : 0
  });
  if(DB.stats.log.length > 400) DB.stats.log.length = 400;
  save();
}

/* how far into the current set we got (reps or seconds) */
function setProgress(){
  var st = S.steps[S.idx];
  if(!st || st.stage !== "set") return 0;
  if(S.holdMode){
    var elapsed = 0, i;
    for(i=0;i<S.idx;i++) if(S.steps[i].stage === "set" && S.steps[i].set === st.set) elapsed += S.steps[i].dur;
    elapsed += Math.min(A.ctx.currentTime - S.stepStart, st.dur);
    return Math.max(0, Math.min(elapsed, S.holdSec));
  }
  return Math.max(0, st.rep - 1);
}

function saveSet(){
  var st = S.steps[S.idx];
  if(!st || st.stage !== "set") return;
  recordSet(st.set, setProgress());
  var j = S.idx;
  while(j < S.steps.length && S.steps[j].stage === "set" && S.steps[j].set === st.set) j++;
  S.steps.splice(S.idx, j - S.idx);
  reanchor(true);
}
function skipRest(){
  var st = S.steps[S.idx];
  if(!st || st.stage !== "rest") return;
  var j = S.idx;
  while(j < S.steps.length && S.steps[j].stage === "rest" && S.steps[j].set === st.set) j++;
  S.steps.splice(S.idx, j - S.idx);
  reanchor(true);
}
function reanchor(hard){
  if(!A) return;
  S.stepStart = A.ctx.currentTime;
  S.schedIdx = S.idx - 1;
  if(hard) lastBg = null;
}

function startTimeOf(j){
  var t = S.stepStart, k;
  for(k = S.idx; k < j; k++) t += S.steps[k].dur;
  return t;
}
function scheduleAhead(now){
  var guard = 0;
  while(S.schedIdx < S.steps.length - 1 && guard++ < 6){
    var j = S.schedIdx + 1;
    var t = startTimeOf(j);
    if(t > now + LEAD) break;
    var stp = S.steps[j];
    if(stp.k !== "done") schemePhase(stp.k === "getset" ? "getset" : stp.k, Math.max(t, now + 0.004), stp.dur);
    S.schedIdx = j;
  }
}

  2: {"in":["#000000","#171310"], hold:["#000000","#171310"], out:["#000000","#171310"],

var elBg = document.getElementById("bg"), elWord = document.getElementById("word"),
    elWordI = document.getElementById("word").firstElementChild,
    elNum = document.getElementById("num"), elDots = document.getElementById("dots"),
    elBar = document.getElementById("bar"), elBarIn = elBar.firstElementChild,

function buildDots(){
  elDots.innerHTML = "";
  if(S.mode === "drive" || S.holdMode) return;
  var n = S.mode === "sleep" ? S.reps : S.reps;
  if(n > 30) return;
  for(var i=0;i<n;i++) elDots.appendChild(document.createElement("i"));
  lastDots = -1;
}
function palIdx(){ return S.mode === "drive" ? 2 : (S.mode === "sleep" ? 1 : 0); }
function fmtClock(s){
  s = Math.max(0, Math.ceil(s));
  var m = Math.floor(s/60), r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function paint(kind){
  var p = PAL[palIdx()][kind] || PAL[palIdx()].done;
  if(lastBg !== p[0]){ elBg.style.backgroundColor = p[0]; elRun.style.color = p[1]; lastBg = p[0]; }
}
function fitWord(w){
  var avail = elWord.clientWidth - 16;
  if(!w || avail < 60) return;
  var size = Math.min(window.innerWidth*0.46, window.innerHeight*0.34);
  elWordI.textContent = w;
  elWord.style.fontSize = size + "px";
  var wd = elWordI.offsetWidth, pass = 0;
  while(wd > avail && wd > 0 && pass++ < 3){          // text scales linearly with size
    size = size * (avail / wd);
    elWord.style.fontSize = size + "px";
    wd = elWordI.offsetWidth;
  }
}
function txt(el, v, cache){ if(cache !== v) el.textContent = v; return v; }

function render(now){
  var st = S.steps[S.idx];
  if(!st) return;
  var rem = Math.max(0, S.stepStart + st.dur - now);
  var drive = S.mode === "drive";

  paint(st.k);

  if(st.k === "done"){
    if(lastWord !== "DONE") fitWord("DONE");
    lastWord = txt(elWordI, "DONE", lastWord);
    lastNum = txt(elNum, "", lastNum);
    elClock.classList.add("hid"); elBar.classList.add("hid"); elDots.classList.add("hid");
    lastMeta = txt(elMeta, "", lastMeta);
    bSkip.classList.add("hid"); bSave.classList.add("hid"); bBack.classList.remove("hid");
    elEnd.classList.add("hid");
    return;
  }
  elEnd.classList.remove("hid");

  if(drive){
    lastWord = txt(elWordI, "", lastWord);
    lastNum = txt(elNum, "", lastNum);
    lastMeta = txt(elMeta, "", lastMeta);
    elClock.classList.add("hid"); elBar.classList.add("hid"); elDots.classList.add("hid");
    bSkip.classList.add("hid"); bSave.classList.add("hid"); bBack.classList.add("hid");
    return;
  }

  var word = st.k === "in" ? "IN" : st.k === "hold" ? "HOLD" : st.k === "out" ? "OUT" : "";
  if(st.k === "getset") word = S.mode === "sleep" ? "" : "GET SET";
  if(word !== lastWord) fitWord(word);
  lastWord = txt(elWordI, word, lastWord);
  lastNum = txt(elNum, st.k === "empty" ? "" : String(Math.ceil(rem - 0.001) || 1), lastNum);

  var isRest = st.stage === "rest";
  var isSet  = st.stage === "set";

  if(isRest){
    var left = rem, i;
    for(i = S.idx + 1; i < S.steps.length && S.steps[i].stage === "rest" && S.steps[i].set === st.set; i++) left += S.steps[i].dur;
    elClock.classList.remove("hid");
    lastClock = txt(elClock, fmtClock(left), lastClock);
    elDots.classList.add("hid"); elBar.classList.add("hid");
    lastMeta = txt(elMeta, "REST", lastMeta);
    bSkip.classList.remove("hid"); bSave.classList.add("hid"); bBack.classList.add("hid");
  }else{
    elClock.classList.add("hid");
    bSkip.classList.add("hid");
    bBack.classList.add("hid");
    bSave.classList.toggle("hid", !isSet || S.mode !== "lift");
    if(S.holdMode && isSet){
      elBar.classList.remove("hid"); elDots.classList.add("hid");
      var pr = setProgress();
      elBarIn.style.width = (100 * Math.min(1, pr / S.holdSec)).toFixed(1) + "%";
      lastMeta = txt(elMeta, "SET " + st.set + "/" + S.sets + " · " + Math.ceil(S.holdSec - pr) + "S", lastMeta);
    }else{
      elBar.classList.add("hid"); elDots.classList.remove("hid");
      var rp = isSet ? st.rep : (st.k === "getset" ? 0 : 0);
      if(rp !== lastDots){
        var kids = elDots.children;
        for(var d=0; d<kids.length; d++) kids[d].className = d < rp - 1 ? "on" : (d === rp - 1 ? "cur" : "");
        lastDots = rp;
      }
      if(S.mode === "sleep") lastMeta = txt(elMeta, isSet ? ("CYCLE " + st.rep + "/" + S.reps) : "", lastMeta);
      else lastMeta = txt(elMeta, "SET " + st.set + "/" + S.sets + (isSet ? " · " + st.rep + "/" + S.reps : ""), lastMeta);
    }
  }
}

/* ============================ LOOP ============================ */
var raf = 0;
function tick(){
  raf = requestAnimationFrame(tick);
  if(!A) return;
  var now = A.ctx.currentTime;
  if(S.running){
    var guard = 0;
    while(S.idx < S.steps.length - 1 && now >= S.stepStart + S.steps[S.idx].dur && guard++ < 400){
      var prev = S.steps[S.idx];
      S.stepStart += prev.dur;
      S.idx++;
      var cur = S.steps[S.idx];
      if(prev.stage === "set" && !(cur.stage === "set" && cur.set === prev.set)){
        recordSet(prev.set, S.holdMode ? S.holdSec : S.reps);
      }
    }
    scheduleAhead(now);
    if(S.steps[S.idx] && S.steps[S.idx].k === "done"){ endSession(true); }
  }
  if(document.getElementById("s-run").classList.contains("on")) render(now);
}

/* ============================ UI ============================ */
var SOUNDS = [["music","Music"],["breath","Breath"],["tone","Tone"],["calm","Calm"],["off","Off"]];
function initSoundPickers(){
  var els = document.querySelectorAll(".seg.sound");
  for(var i=0;i<els.length;i++){
    var m = els[i].getAttribute("data-for"), html = "";
    for(var j=0;j<SOUNDS.length;j++) html += '<button data-sound="'+m+':'+SOUNDS[j][0]+'">'+SOUNDS[j][1]+'</button>';
    els[i].innerHTML = html;
  }
}
function fmtN(v){ return (Math.round(v*10)/10).toString(); }
function refresh(){
  var L = DB.cfg.lift, P = DB.cfg.sleep, i, b;
  document.getElementById("v-reps").textContent = L.reps;
  document.getElementById("v-sets").textContent = L.sets;
  document.getElementById("v-holdSec").textContent = L.holdSec;
  document.getElementById("v-in").textContent = L.holdMode ? "4" : fmtN(L["in"]);
  document.getElementById("v-hold").textContent = L.holdMode ? "0" : fmtN(L.hold);
  document.getElementById("v-out").textContent = L.holdMode ? "8" : fmtN(L.out);
  document.getElementById("v-empty").textContent = L.holdMode ? "2" : fmtN(L.empty);
  document.getElementById("v-rest").textContent = fmtClock(L.rest);
  document.getElementById("v-cycles").textContent = P.cycles;
  document.getElementById("row-reps").classList.toggle("hid", !!L.holdMode);
  document.getElementById("row-hsec").classList.toggle("hid", !L.holdMode);
  var segHold = document.querySelectorAll("#seg-hold button");
  for(i=0;i<segHold.length;i++) segHold[i].classList.toggle("sel", (segHold[i].getAttribute("data-hold")|0) === (L.holdMode?1:0));
  var segType = document.querySelectorAll("#seg-type button");
  for(i=0;i<segType.length;i++) segType[i].classList.toggle("sel", segType[i].getAttribute("data-type") === L.type);
  var segPat = document.querySelectorAll("#seg-pat button");
  for(i=0;i<segPat.length;i++) segPat[i].classList.toggle("sel", segPat[i].getAttribute("data-pat") === P.pat);
  var snd = document.querySelectorAll("[data-sound]");
  for(i=0;i<snd.length;i++){
    var parts = snd[i].getAttribute("data-sound").split(":");
    snd[i].classList.toggle("sel", DB.cfg[parts[0]].sound === parts[1]);
  }
  var vb = document.querySelectorAll("[data-voice]");
  for(i=0;i<vb.length;i++) vb[i].classList.toggle("sel", voiceOn);
}

var LIM = {reps:[1,60,1], sets:[1,20,1], holdSec:[5,300,5], "in":[0.5,20,0.5], hold:[0,20,0.5],
           out:[0.5,20,0.5], empty:[0,20,0.5], rest:[0,900,15], cycles:[1,40,1]};
function bump(key, delta){
  var target = (key === "cycles") ? DB.cfg.sleep : DB.cfg.lift;
  var lim = LIM[key];
  var v = (+target[key]) + delta;
  v = Math.round(v*10)/10;
  if(v < lim[0]) v = lim[0];
  if(v > lim[1]) v = lim[1];
  target[key] = v;
  save(); refresh();
}

function show(id){
  var ids = ["mode","lift","sleep","drive","run","stats"];
  for(var i=0;i<ids.length;i++) document.getElementById("s-"+ids[i]).classList.toggle("on", ids[i] === id);
  if(id !== "run"){
    elBg.style.backgroundColor = "#0a0806";
    document.body.classList.remove("slow");
    lastBg = "#0a0806";
  }
  if(id === "stats") renderStats();
  if(id === "lift" || id === "sleep" || id === "drive") refresh();
}

function renderStats(){
  var s = DB.stats, i;
  var h = '<div class="stat"><span class="lbl">Lifetime</span><span class="n">' + Math.round(s.sec/60) + ' <span style="font-size:16px;letter-spacing:.2em">MIN</span></span></div>';
  var names = {lift:"Lift", sleep:"Sleep", drive:"Drive"};
  for(var m in names) h += '<div class="stat"><span class="lbl">'+names[m]+'</span><span class="n">'+Math.round((s.modes[m]||0)/60)+'</span></div>';
  h += '<div style="height:22px"></div><div class="lbl" style="padding-bottom:6px">Sets</div>';
  if(!s.log.length) h += '<div class="log"><span>—</span></div>';
  for(i=0; i<Math.min(s.log.length, 120); i++){
    var e = s.log[i], d = new Date(e.t);
    var when = (d.getMonth()+1) + "/" + d.getDate() + " " + d.getHours() + ":" + (d.getMinutes()<10?"0":"") + d.getMinutes();
    var body;
    if(e.m === "sleep") body = "Sleep · " + e.d + " / " + e.g + " cycles";
    else if(e.h) body = "Set " + e.s + "/" + e.of + " · " + e.d + " / " + e.g + "s hold";
    else body = "Set " + e.s + "/" + e.of + " · " + e.d + " / " + e.g + " reps";
    if(e.d < e.g) body += "  (partial)";
    h += '<div class="log"><span>'+body+'</span><span class="d">'+when+'</span></div>';
  }
  document.getElementById("statbody").innerHTML = h;
}

/* ---- events ---- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-go],[data-s],[data-hold],[data-type],[data-pat],[data-sound],[data-start],[data-voice]") : null;
  if(!t) return;
  var v;
  if((v = t.getAttribute("data-go"))){ if(S.running) return; show(v); return; }
  if((v = t.getAttribute("data-s"))){ var p = v.split(":"); bump(p[0], parseFloat(p[1])); return; }
  if((v = t.getAttribute("data-hold")) !== null && v !== undefined && t.hasAttribute("data-hold")){
    DB.cfg.lift.holdMode = (v|0); save(); refresh(); return; }
  if((v = t.getAttribute("data-type"))){
    DB.cfg.lift.type = v; DB.cfg.lift.rest = v === "compound" ? 180 : 90; save(); refresh(); return; }
  if((v = t.getAttribute("data-pat"))){ DB.cfg.sleep.pat = v; save(); refresh(); return; }
  if((v = t.getAttribute("data-sound"))){ var q = v.split(":"); DB.cfg[q[0]].sound = q[1]; save(); refresh(); return; }
  if((v = t.getAttribute("data-start"))){ startSession(v); return; }
  if(t.hasAttribute("data-voice")){ toggleVoice(); return; }
});

bSkip.addEventListener("click", function(e){ e.stopPropagation(); skipRest(); });
bSave.addEventListener("click", function(e){ e.stopPropagation(); saveSet(); });
bBack.addEventListener("click", function(e){ e.stopPropagation(); show("mode"); });
elEnd.addEventListener("click", function(e){ e.stopPropagation(); endSession(false); });
document.getElementById("b-reset").addEventListener("click", function(){
  DB.stats = clone(DEF.stats); save(); renderStats();
});

/* sync tap: re-anchor the current phase to this instant */
var elFlash = document.getElementById("flash");
elRun.addEventListener("pointerdown", function(ev){
  if(ev.target.closest && ev.target.closest("button")) return;
  if(!S.running || !A) return;
  var st = S.steps[S.idx];
  if(!st || (st.stage !== "set")) return;
  reanchor(false);
  elFlash.classList.remove("go");
  void elFlash.offsetWidth;
  elFlash.classList.add("go");
});

document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
document.addEventListener("dblclick", function(e){ e.preventDefault(); });

/* ---- voice start ---- */
var voiceOn = false, rec = null;
function toggleVoice(){
  initAudio();
  if(A && A.ctx.state === "suspended"){ try{ A.ctx.resume(); }catch(e){} }
  if(voiceOn){ voiceOn = false; try{ rec.stop(); }catch(e){} rec = null; refresh(); return; }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ voiceOn = false; refresh(); return; }          // silently unavailable
  try{
    rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
    rec.onresult = function(e){
      for(var i = e.resultIndex; i < e.results.length; i++){
        var s = (e.results[i][0].transcript || "").toLowerCase();
        if(/\bgo\b/.test(s) && !S.running){
          var scr = ["lift","sleep","drive"].filter(function(m){
            return document.getElementById("s-"+m).classList.contains("on"); })[0];
          if(scr) startSession(scr);
        }
      }
    };
    rec.onerror = function(){ voiceOn = false; rec = null; refresh(); };
    rec.onend = function(){ if(voiceOn){ try{ rec.start(); }catch(e){ voiceOn = false; refresh(); } } };
    rec.start();
    voiceOn = true;
  }catch(e){ voiceOn = false; rec = null; }
  refresh();
}

/* refit the giant word once the real face has loaded */
try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ lastWord = null; }); }catch(e){}

/* ---- boot ---- */
initSoundPickers();
refresh();
show("mode");
raf = requestAnimationFrame(tick);

})();
</script>
