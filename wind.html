<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wind Bender">
<meta name="theme-color" content="#0a0c14">
<title>Wind Bender</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* ---------------------------------------------------------------
   WIND BENDER
   The whole screen is the instrument. Text is the caption.
   No web fonts, no CDN, no build: this file is the app.
   --------------------------------------------------------------- */
:root{
  --fg:#eef3f7; --mute:rgba(238,243,247,.55); --line:rgba(238,243,247,.16);
  --ui:rgba(8,12,18,.55);
  --wordSize:64px;             /* set ONCE by fitWordOnce(), never per word */
  --countSize:min(14vw,9vh);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#0a0c14}
body{
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--fg);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:manipulation;
}
canvas.field{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
canvas.field[hidden]{display:none}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.14}100%{opacity:0}}
#perf{position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 6px);z-index:8;font:10px/1.4 ui-monospace,Menlo,monospace;
  color:#9fe;opacity:.8;pointer-events:none;white-space:pre;display:none}

.screen{position:relative;z-index:1;display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px)}
.screen.on{display:flex}
.spacer{flex:1 1 auto}
button{font:inherit;color:inherit;background:transparent;border:0;margin:0;padding:0;cursor:pointer}
.lbl{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* ---------- home ---------- */
.mark{display:grid;justify-items:center;gap:6px;padding-top:min(9vh,70px)}
.mark .s{font-size:12px;letter-spacing:.5em;color:var(--mute);font-weight:600;padding-left:.5em}
.mark .w{font-weight:700;font-size:min(17vw,100px);line-height:.95;letter-spacing:.02em;-webkit-text-stroke:0 currentColor}   /* BENDER, six letters, fits a 320 px phone; the trail is real dye shed off the letters into the idle wind; the weight breathes (see breathe()) */
.modes{display:grid;gap:12px;margin-bottom:min(6vh,52px)}
.mode{display:flex;justify-content:space-between;align-items:baseline;padding:22px 22px;border-radius:20px;
  background:var(--ui);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mode:active{background:rgba(238,243,247,.12)}
.mode .t{font-weight:800;font-size:min(9vw,40px);letter-spacing:.04em;line-height:1}
.mode .d{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:600}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-width:0;padding:13px 4px;border-radius:12px;background:var(--ui);border:1px solid var(--line);
  font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--mute);text-transform:uppercase;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button.sel{color:var(--fg);border-color:rgba(238,243,247,.6);background:rgba(238,243,247,.14)}
.seg button[disabled]{opacity:.35}
.note{font-size:12px;line-height:1.45;color:var(--mute);min-height:2.9em;letter-spacing:.02em}
.sub{text-align:center;font-size:12px;letter-spacing:.1em;color:var(--mute);padding-bottom:6px;line-height:1.5}
/* the doors: each preset is a tile that carries its own tempo as a proportional bar,
   the phase names in small caps above the segments and the seconds inside them */
.door{display:block;width:100%;text-align:left;background:var(--ui);border:1px solid var(--line);border-radius:18px;padding:16px 18px 14px;margin-bottom:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:relative}
.door.sel{border-color:rgba(238,243,247,.6);background:rgba(238,243,247,.09)}
.door .dt{display:block;font-weight:800;font-size:26px;letter-spacing:.06em;line-height:1;margin-bottom:12px}
.door .dr{position:absolute;right:18px;top:18px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:700}
.door .bar{display:flex;gap:4px}
.door .bar b{display:flex;flex-direction:column;gap:6px;min-width:0}
.door .bar b i{display:block;font-style:normal;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:700;white-space:nowrap}
.door .bar b u{display:flex;align-items:center;justify-content:center;text-decoration:none;height:30px;border-radius:7px;background:rgba(238,243,247,.10);
  font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.door.sel .bar b u{background:rgba(238,243,247,.16)}

/* ---------- setup ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;height:40px}
.btn{display:block;width:100%;padding:18px 16px;border-radius:16px;background:var(--ui);border:1px solid var(--line);
  color:var(--fg);font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;text-align:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.ghost{width:auto;padding:10px 16px;color:var(--mute);font-size:12px}
.btn.go{font-size:min(12vw,46px);letter-spacing:.14em;padding:16px 16px 12px;line-height:1;font-weight:800;
  background:rgba(238,243,247,.14);border-color:rgba(238,243,247,.5)}
.card{background:var(--ui);border:1px solid var(--line);border-radius:18px;padding:4px 18px;margin-bottom:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.stack{flex-direction:column;align-items:stretch;gap:10px}
.step{display:flex;align-items:center;gap:2px}
.step button{width:52px;height:52px;border-radius:14px;background:rgba(238,243,247,.08);border:1px solid var(--line);
  font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center}
.step .v{min-width:74px;text-align:center;font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.v2{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;color:var(--mute);padding-right:6px}
.hid{display:none !important}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
#s-setup{max-height:100vh;max-height:100dvh}   /* the list scrolls; Start stays on screen */
.foot{margin-top:14px}

/* ---------- run: the invariant slot stack ----------
   Every slot has a fixed height. Phase changes may alter colour and the
   field behind, and nothing else. */
#s-run{padding-left:0;padding-right:0}
.slot{flex:0 0 auto}
.meta{height:44px;position:relative;display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:min(3.6vw,14px);letter-spacing:.2em;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;
  color:var(--mute);padding:0 72px;font-variant-numeric:tabular-nums}
#endbtn{position:absolute;right:calc(env(safe-area-inset-right) + 12px);top:0;height:44px;padding:0 10px;
  font-size:12px;letter-spacing:.24em;color:var(--mute);font-weight:700;text-transform:uppercase}
.word{height:calc(var(--wordSize) * 1.25);display:flex;align-items:center;justify-content:center;
  font-size:var(--wordSize);font-weight:700;line-height:1;letter-spacing:.06em;white-space:nowrap;-webkit-text-stroke:0 currentColor;
  text-shadow:0 0 28px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5)}
.count{height:calc(var(--countSize) * 1.3);display:flex;align-items:center;justify-content:center;
  font-size:var(--countSize);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:4ch;opacity:.9;
  text-shadow:0 0 28px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5)}
/* the breath as a line: three segments in proportion to in, hold and out; the current one fills */
.rail{height:36px;display:flex;align-items:center;justify-content:center}
.tl{display:flex;gap:6px;width:min(58vw,250px);height:3px}
.tl>div{position:relative;height:100%;border-radius:2px;background:rgba(238,243,247,.16);overflow:hidden;flex:1 1 0;min-width:0}
.tl>div.gone{display:none}
.tl i{position:absolute;inset:0;background:rgba(238,243,247,.92);transform-origin:left center;transform:scaleX(0)}
.foot.slot{height:66px;margin:0 20px;position:relative}
.foot.slot .btn{position:absolute;inset:0;width:auto;visibility:hidden;border-color:rgba(238,243,247,.4);
  font-size:min(9vw,40px);letter-spacing:.14em;padding:0;font-weight:800;line-height:66px}
.foot.slot .btn.show{visibility:visible}
.foot.slot .btn.sm{font-size:13px;letter-spacing:.24em;font-weight:700}
</style>
</head>
<body>
<canvas id="gl" class="field" hidden></canvas>
<canvas id="c2d" class="field"></canvas>
<div id="flash"></div>
<div id="perf"></div>
<audio id="aout" playsinline style="display:none"></audio>

<!-- HOME -->
<section id="s-home" class="screen on">
  <div class="mark"><div class="s">WIND</div><div class="w" id="mark">BENDER</div></div>
  <div class="spacer"></div>
  <div class="modes">
    <button class="mode" data-go="lift"><span class="t">LIFT</span><span class="d">sets · reps · rest</span></button>
    <button class="mode" data-go="breathe"><span class="t">BREATHE</span><span class="d">cycles</span></button>
  </div>

</section>

<!-- SETUP -->
<section id="s-setup" class="screen">
  <div class="top"><button class="btn ghost" data-go="home">Back</button><span class="eyebrow" id="setup-title">Lift</span></div>
  <div class="scroll">
    <div id="setup-lift">
      <!-- the shape of the rep: two doors, each carrying its own tempo as a labelled bar -->
      <button class="door" data-preset="drive"><span class="dt">DRIVE</span><span class="bar" id="bar-drive"></span><span class="dr" id="rest-drive"></span></button>
      <button class="door" data-preset="squeeze"><span class="dt">SQUEEZE</span><span class="bar" id="bar-squeeze"></span><span class="dr" id="rest-squeeze"></span></button>
      <div class="card">
        <div class="row" id="row-reps"><span class="lbl">Reps</span><div class="step"><button data-s="reps:-1">−</button><span class="v" id="v-reps">10</span><button data-s="reps:1">+</button></div></div>
        <div class="row"><span class="lbl">Sets</span><div class="step"><button data-s="sets:-1">−</button><span class="v" id="v-sets">4</span><button data-s="sets:1">+</button></div></div>
      </div>
    </div>
    <div id="setup-breathe">
      <!-- the shape of the breath: two doors, the same as Lift's, each carrying its tempo as a labelled bar -->
      <button class="door" data-pat="478"><span class="dt">RELAX</span><span class="bar" id="bar-478"></span><span class="dr">long exhale</span></button>
      <button class="door" data-pat="coh"><span class="dt">COHERENT</span><span class="bar" id="bar-coh"></span><span class="dr">5.5 a minute</span></button>
      <div class="card">
        <div class="row"><span class="lbl">Cycles</span><div class="step"><button data-s="cycles:-1">−</button><span class="v" id="v-cycles">8</span><button data-s="cycles:1">+</button></div></div>
        <div class="row"><span class="lbl">Time</span><span class="v2" id="v-time"></span></div>
      </div>
    </div>
    <!-- one sound for the whole app -->
    <div class="card"><div class="row stack"><span class="lbl">Sound</span>
      <div class="seg" id="seg-sound"><button data-sound="tone">Tone</button><button data-sound="breath">Breath</button></div>
      <div id="sound-sub" class="sub"></div></div></div>
    <!-- the two ways the phone can read you, Breathe only -->
    <div class="card" id="card-with"><div class="row stack"><span class="lbl">With</span>
      <div class="seg" id="seg-with"><button data-w="belly">Belly</button><button data-w="tap">Tap</button></div>
      <div id="with-sub" class="sub"></div></div></div>
  </div>
  <div class="foot"><button class="btn go" id="b-start">Start</button></div>
</section>

<!-- RUN -->
<section id="s-run" class="screen">
  <div class="meta slot"><span id="rmeta"></span><button id="endbtn">End</button></div>
  <div class="spacer"></div>
  <div class="word slot" id="word"><span></span></div>
  <div class="count slot" id="num"></div>
  <div class="rail slot"><div class="tl" id="tl"><div id="tl-in"><i></i></div><div id="tl-hold"><i></i></div><div id="tl-out"><i></i></div><div id="tl-empty"><i></i></div></div></div>
  <div class="spacer"></div>
  <div class="foot slot">
    <button class="btn" id="b-skip">Skip rest</button>
    <button class="btn sm" id="b-save">Save set</button>
    <button class="btn sm" id="b-back">Back</button>
  </div>
</section>

<script>
(function(){
"use strict";
var Q = {}; try{ location.search.slice(1).split("&").forEach(function(kv){ var p=kv.split("="); if(p[0]) Q[p[0]] = p[1]===undefined?1:decodeURIComponent(p[1]); }); }catch(e){}

/* ============================ STORAGE ============================ */
var KEY = "wind.v1";
var DEF = {
  cfg: {
    sound:"tone",
    /* LIFT presets, one per rep shape. DRIVE pauses full at the bottom: squats, presses, hinges.
       SQUEEZE pauses empty at the top: rows, pulls, curls, raises, calves. Every cycle opens on IN.
       The one-second concentric is an instruction to be fast; the long eccentric absorbs a slow rep. */
    lift: {preset:"drive", reps:{drive:10, squeeze:12}, sets:4,
      tune:{drive:  {"in":3, hold:1, out:2, empty:0, rest:120},
            squeeze:{"in":2, hold:0, out:1, empty:2, rest:90}}},
    breathe: {cycles:8, pat:"478", belly:"on", tap:"off"}
  },
  stats: {sec:0, log:[]}
};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var DB = clone(DEF);
try{
  var raw = JSON.parse(localStorage.getItem(KEY) || "null");
  if(raw && raw.cfg){
    var L = raw.cfg.lift; if(L){ ["preset","sets"].forEach(function(k){ if(L[k]!==undefined) DB.cfg.lift[k]=L[k]; });
      if(L.reps && typeof L.reps==="object"){ for(var rk in DB.cfg.lift.reps) if(L.reps[rk]) DB.cfg.lift.reps[rk]=L.reps[rk]; }   /* reps are per preset now */
      /* the tempos are fixed now; nothing stored overrides them. Old preset names map onto the new shapes. */
      if(DB.cfg.lift.preset==="compound"||DB.cfg.lift.preset==="hold") DB.cfg.lift.preset="drive"; else if(DB.cfg.lift.preset==="isolation") DB.cfg.lift.preset="squeeze";
      if(!DB.cfg.lift.tune[DB.cfg.lift.preset]) DB.cfg.lift.preset="drive"; }
    if(raw.cfg.breathe) for(var bk in DB.cfg.breathe) if(raw.cfg.breathe[bk]!==undefined) DB.cfg.breathe[bk]=raw.cfg.breathe[bk];
    if(DB.cfg.breathe.pat!=="478" && DB.cfg.breathe.pat!=="coh") DB.cfg.breathe.pat="478";          /* Follow is gone */
    /* one Sound for the app; sounds were once per mode, and Ears, now gone, becomes Breath */
    var oldEars = raw.cfg.ears==="on" || (raw.cfg.breathe&&raw.cfg.breathe.ears==="on") || (raw.cfg.lift&&raw.cfg.lift.ears==="on");
    DB.cfg.sound = oldEars ? "breath" : (raw.cfg.sound || (raw.cfg.breathe&&raw.cfg.breathe.sound) || (raw.cfg.lift&&raw.cfg.lift.sound) || "tone");
    if(DB.cfg.sound==="ears") DB.cfg.sound="breath"; if(["tone","breath"].indexOf(DB.cfg.sound)<0) DB.cfg.sound="tone";
    if(DB.cfg.breathe.tap!=="off" && DB.cfg.breathe.tap!=="on") DB.cfg.breathe.tap="on";            /* Sync and Inhale became the one Tap */
  }
  if(raw && raw.stats){ DB.stats.sec = raw.stats.sec||0; DB.stats.log = raw.stats.log||[]; }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

/* ============================ CLOCK ============================
   One timebase. Follows the AudioContext clock while it advances and
   extrapolates with performance.now() when iOS suspends it. */
var A = null, lastCtxT = 0, lastPerfT = 0;
function nowSec(){
  var p = performance.now()/1000;
  if(A){ var c = A.ctx.currentTime; if(c > lastCtxT){ lastCtxT = c; lastPerfT = p; return c; } return lastCtxT + (p - lastPerfT); }
  return p;
}
function toCtx(t){ return A.ctx.currentTime + Math.max(0, t - nowSec()); }

/* ============================ AUDIO ============================ */
var scheme = null;
function easeIO(p){ return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2; }
function easeOut(p){ return 1 - Math.pow(1-p, 3); }
function easeIn(p){ return p*p*p; }
function env(param, from, to, at, dur, shape){
  if(!A) return;
  var ctx = A.ctx, now = ctx.currentTime, t0 = at < now ? now : at;
  shape = shape || easeIO;
  try{ if(param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t0); else param.cancelScheduledValues(t0); }catch(e){ try{ param.cancelScheduledValues(t0); }catch(e2){} }
  var start = (at <= now + 0.03) ? param.value : from; if(!isFinite(start)) start = from;
  param.setValueAtTime(start, t0);
  for(var i=1; i<=26; i++){ var p=i/26; param.linearRampToValueAtTime(start + (to-start)*shape(p), t0 + dur*p); }
}
function noiseBuffer(ctx, sec, kind){   /* true: brown; "pink": pink (Kellet); false: white */
  var len = Math.floor(ctx.sampleRate*sec), b = ctx.createBuffer(2, len, ctx.sampleRate), c, d, i, w, last, b0,b1,b2,b3,b4,b5,b6;
  for(c=0;c<2;c++){ d=b.getChannelData(c); last=0; b0=b1=b2=b3=b4=b5=b6=0;
    for(i=0;i<len;i++){ w=Math.random()*2-1;
      if(kind==="pink"){ b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926; }
      else if(kind){ last=(last+0.02*w)/1.02; d[i]=last*3.6; } else d[i]=w; } }
  return b;
}
function makeIR(ctx, sec){
  var rate=ctx.sampleRate, len=Math.floor(rate*sec), b=ctx.createBuffer(2,len,rate), c,d,i,t,w,last,e2;
  for(c=0;c<2;c++){ d=b.getChannelData(c); last=0; for(i=0;i<len;i++){ t=i/len; w=Math.random()*2-1; last=(last+0.28*w)/1.28; e2=Math.pow(1-t,2.6)*(1-Math.exp(-i/(rate*0.012))); d[i]=(last*2.4+w*0.22)*e2; } }
  return b;
}
var audioEl = document.getElementById("aout");
function initAudio(){
  if(A) return A;
  var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
  var ctx = new AC();
  var master = ctx.createGain(); master.gain.value = 0.0001;
  var lim = ctx.createDynamicsCompressor();
  try{ lim.threshold.value=-8; lim.knee.value=22; lim.ratio.value=4; lim.attack.value=0.02; lim.release.value=0.5; }catch(e){}
  var roll = ctx.createBiquadFilter(); roll.type="lowpass"; roll.frequency.value=4200; roll.Q.value=0.4;
  var shelf = ctx.createBiquadFilter(); shelf.type="highshelf"; shelf.frequency.value=2400; shelf.gain.value=-7;
  roll.connect(shelf); shelf.connect(lim); lim.connect(master);
  try{ var msd=ctx.createMediaStreamDestination(); master.connect(msd); audioEl.srcObject=msd.stream; var pr=audioEl.play(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){}
  master.connect(ctx.destination);
  /* the output tap: the wind reads the sound it is about to make */
  var tap = ctx.createAnalyser(); tap.fftSize = 1024; tap.smoothingTimeConstant = 0; master.connect(tap);
  var ka = ctx.createConstantSource ? ctx.createConstantSource() : null;
  if(ka){ var kg=ctx.createGain(); kg.gain.value=0.0001; ka.connect(kg); kg.connect(ctx.destination); ka.start(); }
  var dryIn = ctx.createGain(); dryIn.connect(roll);
  var wetIn = ctx.createGain(); var conv = ctx.createConvolver(); conv.normalize = true; try{ conv.buffer = makeIR(ctx, 2.8); }catch(e){}
  var wet = ctx.createGain(); wet.gain.value = 0.42; wetIn.connect(roll); wetIn.connect(conv); conv.connect(wet); wet.connect(roll);
  A = {ctx:ctx, master:master, roll:roll, dryIn:dryIn, wetIn:wetIn, tap:tap, tapBuf:new Float32Array(1024), nodes:[]};
  lastCtxT = ctx.currentTime; lastPerfT = performance.now()/1000;
  ctx.onstatechange = function(){ if(ctx.state==="running" && S.running){ S.schedIdx = S.idx - 1; } };
  try{ if(window.MediaMetadata && navigator.mediaSession){ navigator.mediaSession.metadata = new MediaMetadata({title:"Wind Bender"}); navigator.mediaSession.playbackState="playing";
    ["play","pause"].forEach(function(a){ try{ navigator.mediaSession.setActionHandler(a, function(){ try{ ctx.resume(); audioEl.play(); }catch(e){} }); }catch(e){} }); } }catch(e){}
  return A;
