<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wind Bender">
<meta name="theme-color" id="themecolor" content="#131922">
<title>Wind Bender</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* ---------------------------------------------------------------
   WIND BENDER
   The whole screen is the instrument. Text is the caption.
   No web fonts, no CDN, no build: this file is the app.
   One engine: the slipstream, long lines of air with momentum on a
   2D canvas. The palette sets every colour, including the type,
   because Parchment is a light ground.
   --------------------------------------------------------------- */
:root{
  --fg:#e6ebf1; --mute:rgba(230,235,241,.55); --line:rgba(230,235,241,.16); --ui:rgba(19,25,34,.55); --bg:#131922; --sel:rgba(230,235,241,.14);
  --wordSize:64px;             /* set ONCE by fitWordOnce(), never per word */
  --countSize:min(14vw,9vh);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg)}
body{
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--fg);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:manipulation;
}
canvas.field{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.14}100%{opacity:0}}
#perf{position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 6px);z-index:8;font:10px/1.4 ui-monospace,Menlo,monospace;
  color:#9fe;opacity:.8;pointer-events:none;white-space:pre;display:none}

.screen{position:relative;z-index:1;display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px)}
.screen.on{display:flex}
.spacer{flex:1 1 auto}
button{font:inherit;color:inherit;background:transparent;border:0;margin:0;padding:0;cursor:pointer}
.lbl{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* ---------- home ---------- */
.mark{display:grid;justify-items:center;gap:6px;padding-top:min(9vh,70px)}
.mark .s{font-size:12px;letter-spacing:.5em;color:var(--mute);font-weight:600;padding-left:.5em}
.mark .w{font-weight:700;font-size:min(17vw,100px);line-height:.95;letter-spacing:.02em;-webkit-text-stroke:0 currentColor}
.modes{display:grid;gap:12px;margin-bottom:min(6vh,52px)}
.mode{display:flex;justify-content:space-between;align-items:baseline;padding:22px 22px;border-radius:20px;
  background:var(--ui);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mode:active{background:var(--sel)}
.mode .t{font-weight:800;font-size:min(9vw,40px);letter-spacing:.04em;line-height:1}
.mode .d{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:600}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-width:0;padding:13px 2px;border-radius:12px;background:var(--ui);border:1px solid var(--line);
  font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--mute);text-transform:uppercase;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.sel{color:var(--fg);border-color:var(--fg);background:var(--sel)}
.seg.look button{padding:11px 0;font-size:10px;letter-spacing:.08em}
.seg.look button i{display:block;height:10px;border-radius:5px;margin:0 8px 7px;border:1px solid var(--line)}
.sub{text-align:center;font-size:12px;letter-spacing:.1em;color:var(--mute);padding-bottom:6px;line-height:1.5}
/* the doors: each preset is a tile that carries its own tempo as a proportional bar,
   the movement names in small caps above the segments and the seconds inside them */
.door{display:block;width:100%;text-align:left;background:var(--ui);border:1px solid var(--line);border-radius:18px;padding:16px 18px 14px;margin-bottom:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:relative}
.door.sel{border-color:var(--fg);background:var(--sel)}
.door .dt{display:block;font-weight:800;font-size:26px;letter-spacing:.06em;line-height:1;margin-bottom:12px}
.door .dr{position:absolute;right:18px;top:18px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:700}
.door .bar{display:flex;gap:4px}
.door .bar b{display:flex;flex-direction:column;gap:6px;min-width:0}
.door .bar b i{display:block;font-style:normal;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:700;white-space:nowrap}
.door .bar b u{display:flex;align-items:center;justify-content:center;text-decoration:none;height:30px;border-radius:7px;background:var(--sel);
  font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.door .dl{display:block;font-size:11px;letter-spacing:.06em;color:var(--mute);margin-top:10px;line-height:1.4}

/* ---------- setup ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;height:40px}
.btn{display:block;width:100%;padding:18px 16px;border-radius:16px;background:var(--ui);border:1px solid var(--line);
  color:var(--fg);font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;text-align:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.ghost{width:auto;padding:10px 16px;color:var(--mute);font-size:12px}
.btn.go{font-size:min(12vw,46px);letter-spacing:.14em;padding:16px 16px 12px;line-height:1;font-weight:800;background:var(--sel);border-color:var(--fg)}
.card{background:var(--ui);border:1px solid var(--line);border-radius:18px;padding:4px 18px;margin-bottom:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.stack{flex-direction:column;align-items:stretch;gap:10px}
.step{display:flex;align-items:center;gap:2px}
.step button{width:52px;height:52px;border-radius:14px;background:var(--sel);border:1px solid var(--line);
  font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center}
.step .v{min-width:74px;text-align:center;font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.v2{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;color:var(--mute);padding-right:6px}
.hid{display:none !important}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
#s-setup{max-height:100vh;max-height:100dvh}   /* the list scrolls; Start stays on screen */
.foot{margin-top:14px}

/* ---------- run: the invariant slot stack ----------
   Every slot has a fixed height. Phase changes may alter colour and the
   field behind, and nothing else. */
#s-run{padding-left:0;padding-right:0}
.slot{flex:0 0 auto}
.meta{height:44px;position:relative;display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:min(3.6vw,14px);letter-spacing:.2em;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;
  color:var(--mute);padding:0 72px;font-variant-numeric:tabular-nums}
#endbtn{position:absolute;right:calc(env(safe-area-inset-right) + 12px);top:0;height:44px;padding:0 10px;
  font-size:12px;letter-spacing:.24em;color:var(--mute);font-weight:700;text-transform:uppercase}
.word{height:calc(var(--wordSize) * 1.25);display:flex;align-items:center;justify-content:center;
  font-size:var(--wordSize);font-weight:700;line-height:1;letter-spacing:.06em;white-space:nowrap;-webkit-text-stroke:0 currentColor;
  text-shadow:0 0 28px var(--bg),0 2px 8px var(--bg)}
/* the breath under the movement: what the air is doing while the body does the word */
.bsub{height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.26em;text-transform:uppercase;
  font-weight:700;color:var(--mute);white-space:nowrap;text-shadow:0 0 12px var(--bg)}
.count{height:calc(var(--countSize) * 1.3);display:flex;align-items:center;justify-content:center;
  font-size:var(--countSize);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:4ch;opacity:.9;
  text-shadow:0 0 28px var(--bg),0 2px 8px var(--bg)}
/* the breath as a line: one segment per phase of the cycle, in proportion; the current one fills */
.rail{height:36px;display:flex;align-items:center;justify-content:center}
.tl{display:flex;gap:6px;width:min(58vw,250px);height:3px}
.tl>div{position:relative;height:100%;border-radius:2px;background:var(--line);overflow:hidden;flex:1 1 0;min-width:0}
.tl i{position:absolute;inset:0;background:var(--fg);opacity:.92;transform-origin:left center;transform:scaleX(0)}
.foot.slot{height:66px;margin:0 20px;position:relative}
.foot.slot .btn{position:absolute;inset:0;width:auto;visibility:hidden;border-color:var(--line);
  font-size:min(9vw,40px);letter-spacing:.14em;padding:0;font-weight:800;line-height:66px}
.foot.slot .btn.show{visibility:visible}
.foot.slot .btn.sm{font-size:13px;letter-spacing:.24em;font-weight:700}
</style>
</head>
<body>
<canvas id="c2d" class="field"></canvas>
<div id="flash"></div>
<div id="perf"></div>
<audio id="aout" playsinline style="display:none"></audio>

<!-- HOME -->
<section id="s-home" class="screen on">
  <div class="mark"><div class="s">WIND</div><div class="w" id="mark">BENDER</div></div>
  <div class="spacer"></div>
  <div class="modes">
    <button class="mode" data-go="lift"><span class="t">LIFT</span><span class="d">sets · reps · rest</span></button>
    <button class="mode" data-go="breathe"><span class="t">BREATHE</span><span class="d">cycles</span></button>
  </div>
</section>

<!-- SETUP -->
<section id="s-setup" class="screen">
  <div class="top"><button class="btn ghost" data-go="home">Back</button><span class="eyebrow" id="setup-title">Lift</span></div>
  <div class="scroll">
    <div id="setup-lift">
      <!-- the shape of the rep: two doors, each carrying its own tempo as a labelled bar. The words are what the body does. -->
      <button class="door" data-preset="drive"><span class="dt">DRIVE</span><span class="bar" id="bar-drive"></span><span class="dr" id="rest-drive"></span><span class="dl">Pauses at the bottom with the air in. Squats, presses, hinges.</span></button>
      <button class="door" data-preset="squeeze"><span class="dt">SQUEEZE</span><span class="bar" id="bar-squeeze"></span><span class="dr" id="rest-squeeze"></span><span class="dl">Pauses at the top, still breathing out. Rows, flies, curls, raises.</span></button>
      <div class="card">
        <div class="row" id="row-reps"><span class="lbl">Reps</span><div class="step"><button data-s="reps:-1">−</button><span class="v" id="v-reps">10</span><button data-s="reps:1">+</button></div></div>
        <div class="row"><span class="lbl">Sets</span><div class="step"><button data-s="sets:-1">−</button><span class="v" id="v-sets">4</span><button data-s="sets:1">+</button></div></div>
      </div>
    </div>
    <div id="setup-breathe">
      <button class="door" data-pat="478"><span class="dt">RELAX</span><span class="bar" id="bar-478"></span><span class="dr">long exhale</span></button>
      <button class="door" data-pat="coh"><span class="dt">COHERENT</span><span class="bar" id="bar-coh"></span><span class="dr">5.5 a minute</span></button>
      <div class="card">
        <div class="row"><span class="lbl">Cycles</span><div class="step"><button data-s="cycles:-1">−</button><span class="v" id="v-cycles">8</span><button data-s="cycles:1">+</button></div></div>
        <div class="row"><span class="lbl">Time</span><span class="v2" id="v-time"></span></div>
      </div>
    </div>
    <!-- one sound for the whole app: two notes, two bells, or a breath of wind -->
    <div class="card"><div class="row stack"><span class="lbl">Sound</span>
      <div class="seg" id="seg-sound"><button data-sound="tone">Tone</button><button data-sound="bells">Bells</button><button data-sound="breath">Breath</button></div>
      <div id="sound-sub" class="sub"></div></div></div>
    <!-- the look: five palettes, each a whole world, one of them paper -->
    <div class="card"><div class="row stack"><span class="lbl">Look</span>
      <div class="seg look" id="seg-look"></div>
      <div id="look-sub" class="sub"></div></div></div>
    <!-- the two ways the phone can read you, Breathe only -->
    <div class="card" id="card-with"><div class="row stack"><span class="lbl">With</span>
      <div class="seg" id="seg-with"><button data-w="belly">Belly</button><button data-w="tap">Tap</button></div>
      <div id="with-sub" class="sub"></div></div></div>
  </div>
  <div class="foot"><button class="btn go" id="b-start">Start</button></div>
</section>

<!-- RUN -->
<section id="s-run" class="screen">
  <div class="meta slot"><span id="rmeta"></span><button id="endbtn">End</button></div>
  <div class="spacer"></div>
  <div class="word slot" id="word"><span></span></div>
  <div class="bsub slot" id="bsub"></div>
  <div class="count slot" id="num"></div>
  <div class="rail slot"><div class="tl" id="tl"></div></div>
  <div class="spacer"></div>
  <div class="foot slot">
    <button class="btn" id="b-skip">Skip rest</button>
    <button class="btn sm" id="b-save">Save set</button>
    <button class="btn sm" id="b-back">Back</button>
  </div>
</section>

<script>
(function(){
"use strict";
var Q = {}; try{ location.search.slice(1).split("&").forEach(function(kv){ var p=kv.split("="); if(p[0]) Q[p[0]] = p[1]===undefined?1:decodeURIComponent(p[1]); }); }catch(e){}

/* ============================ STORAGE ============================ */
var KEY = "wind.v2", OLDKEY = "wind.v1";
var DEF = {
  cfg: {
    sound:"tone", pal:"slate",
    /* LIFT presets, one per rep shape, as sequences so the cycle can open on whichever movement the lift
       starts with. DRIVE: lower with the air coming in, hold at the bottom with the air in, lift it out.
       SQUEEZE: lift on the way out, hold at the top still breathing out, lower with the air coming in.
       The words on the screen are the movements; the breath is the line under them. */
    lift: {preset:"drive", reps:{drive:10, squeeze:12}, sets:4,
      tune:{drive:  {seq:[["in",3],["hold",1],["out",2]], rest:120},
            squeeze:{seq:[["out",1],["empty",2],["in",3]], rest:90}}},
    breathe: {cycles:8, pat:"478", belly:"on", tap:"off"}
  },
  stats: {sec:0, log:[]}
};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var DB = clone(DEF);
try{
  var raw = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(OLDKEY) || "null");
  if(raw && raw.cfg){
    var L = raw.cfg.lift; if(L){ ["preset","sets"].forEach(function(k){ if(L[k]!==undefined) DB.cfg.lift[k]=L[k]; });
      if(L.reps && typeof L.reps==="object"){ for(var rk in DB.cfg.lift.reps) if(L.reps[rk]) DB.cfg.lift.reps[rk]=L.reps[rk]; }
      if(!DB.cfg.lift.tune[DB.cfg.lift.preset]) DB.cfg.lift.preset="drive"; }   /* the tempos are fixed; nothing stored overrides them */
    if(raw.cfg.breathe) for(var bk in DB.cfg.breathe) if(raw.cfg.breathe[bk]!==undefined) DB.cfg.breathe[bk]=raw.cfg.breathe[bk];
    if(DB.cfg.breathe.pat!=="478" && DB.cfg.breathe.pat!=="coh") DB.cfg.breathe.pat="478";
    if(DB.cfg.breathe.tap!=="off" && DB.cfg.breathe.tap!=="on") DB.cfg.breathe.tap="on";
    DB.cfg.sound = raw.cfg.sound || "tone"; if(["tone","bells","breath"].indexOf(DB.cfg.sound)<0) DB.cfg.sound="tone";
    if(raw.cfg.pal) DB.cfg.pal = raw.cfg.pal;
  }
  if(raw && raw.stats){ DB.stats.sec = raw.stats.sec||0; DB.stats.log = raw.stats.log||[]; }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

/* ============================ CLOCK ============================
   One timebase. Follows the AudioContext clock while it advances and
   extrapolates with performance.now() when iOS suspends it. */
var A = null, lastCtxT = 0, lastPerfT = 0;
function nowSec(){
  var p = performance.now()/1000;
  if(A){ var c = A.ctx.currentTime; if(c > lastCtxT){ lastCtxT = c; lastPerfT = p; return c; } return lastCtxT + (p - lastPerfT); }
  return p;
}
function toCtx(t){ return A.ctx.currentTime + Math.max(0, t - nowSec()); }

/* ============================ AUDIO ============================ */
var scheme = null;
function easeIO(p){ return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2; }
function easeOut(p){ return 1 - Math.pow(1-p, 3); }
function easeIn(p){ return p*p*p; }
function env(param, from, to, at, dur, shape){
  if(!A) return;
  var ctx = A.ctx, now = ctx.currentTime, t0 = at < now ? now : at;
  shape = shape || easeIO;
  try{ if(param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t0); else param.cancelScheduledValues(t0); }catch(e){ try{ param.cancelScheduledValues(t0); }catch(e2){} }
  var start = (at <= now + 0.03) ? param.value : from; if(!isFinite(start)) start = from;
  param.setValueAtTime(start, t0);
  for(var i=1; i<=26; i++){ var p=i/26; param.linearRampToValueAtTime(start + (to-start)*shape(p), t0 + dur*p); }
}
function noiseBuffer(ctx, sec, kind){   /* true: brown; "pink": pink (Kellet); false: white */
  var len = Math.floor(ctx.sampleRate*sec), b = ctx.createBuffer(2, len, ctx.sampleRate), c, d, i, w, last, b0,b1,b2,b3,b4,b5,b6;
  for(c=0;c<2;c++){ d=b.getChannelData(c); last=0; b0=b1=b2=b3=b4=b5=b6=0;
    for(i=0;i<len;i++){ w=Math.random()*2-1;
      if(kind==="pink"){ b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926; }
      else if(kind){ last=(last+0.02*w)/1.02; d[i]=last*3.6; } else d[i]=w; } }
  return b;
}
function makeIR(ctx, sec){
  var rate=ctx.sampleRate, len=Math.floor(rate*sec), b=ctx.createBuffer(2,len,rate), c,d,i,t,w,last,e2;
  for(c=0;c<2;c++){ d=b.getChannelData(c); last=0; for(i=0;i<len;i++){ t=i/len; w=Math.random()*2-1; last=(last+0.28*w)/1.28; e2=Math.pow(1-t,2.6)*(1-Math.exp(-i/(rate*0.012))); d[i]=(last*2.4+w*0.22)*e2; } }
  return b;
}
var audioEl = document.getElementById("aout");
function initAudio(){
  if(A) return A;
  var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
  var ctx = new AC();
  var master = ctx.createGain(); master.gain.value = 0.0001;
  var lim = ctx.createDynamicsCompressor();
  try{ lim.threshold.value=-8; lim.knee.value=22; lim.ratio.value=4; lim.attack.value=0.02; lim.release.value=0.5; }catch(e){}
  var roll = ctx.createBiquadFilter(); roll.type="lowpass"; roll.frequency.value=4200; roll.Q.value=0.4;
  var shelf = ctx.createBiquadFilter(); shelf.type="highshelf"; shelf.frequency.value=2400; shelf.gain.value=-7;
  roll.connect(shelf); shelf.connect(lim); lim.connect(master);
  try{ var msd=ctx.createMediaStreamDestination(); master.connect(msd); audioEl.srcObject=msd.stream; var pr=audioEl.play(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){}
  master.connect(ctx.destination);
  /* the output tap: the wind reads the sound it is about to make */
  var tap = ctx.createAnalyser(); tap.fftSize = 1024; tap.smoothingTimeConstant = 0; master.connect(tap);
  var ka = ctx.createConstantSource ? ctx.createConstantSource() : null;
  if(ka){ var kg=ctx.createGain(); kg.gain.value=0.0001; ka.connect(kg); kg.connect(ctx.destination); ka.start(); }
  var dryIn = ctx.createGain(); dryIn.connect(roll);
  var wetIn = ctx.createGain(); var conv = ctx.createConvolver(); conv.normalize = true; try{ conv.buffer = makeIR(ctx, 2.8); }catch(e){}
  var wet = ctx.createGain(); wet.gain.value = 0.42; wetIn.connect(roll); wetIn.connect(conv); conv.connect(wet); wet.connect(roll);
  A = {ctx:ctx, master:master, roll:roll, dryIn:dryIn, wetIn:wetIn, tap:tap, tapBuf:new Float32Array(1024), nodes:[]};
  lastCtxT = ctx.currentTime; lastPerfT = performance.now()/1000;
  ctx.onstatechange = function(){ if(ctx.state==="running" && S.running){ S.schedIdx = S.idx - 1; } };
  try{ if(window.MediaMetadata && navigator.mediaSession){ navigator.mediaSession.metadata = new MediaMetadata({title:"Wind Bender"}); navigator.mediaSession.playbackState="playing";
    ["play","pause"].forEach(function(a){ try{ navigator.mediaSession.setActionHandler(a, function(){ try{ ctx.resume(); audioEl.play(); }catch(e){} }); }catch(e){} }); } }catch(e){}
  return A;
}
function keep(n){ A.nodes.push(n); return n; }
/* TONE: two notes, and only two. The breath in is the high note, D4, which opens and swells as the

  if(st.k!==lastKind){ lastKind=st.k; MASK.dirty=true; }
  fs.stage=st.stage; fs.phase=st.k; fs.prog=frac;
  if(st.k==="in") fs.fill=easeIO(frac); else if(st.k==="hold") fs.fill=1; else if(st.k==="out") fs.fill=1-easeIO(frac); else if(st.k==="getset") fs.fill=0.15*(1-frac); else fs.fill=0;
  /* the gust: a bell over the phase, its own length; a short phase blows harder so the air travels as far */
  var bell = (st.k==="in"||st.k==="out") ? Math.pow(Math.sin(frac*Math.PI),0.7)*Math.min(1.8, Math.max(1, 2.2/st.dur)) : 0;
  fs.flow = st.k==="in"?bell : st.k==="out"?-bell : 0;
  if(st.stage==="rest") fs.flow*=0.45;
  var a=audioAmp(); if(a<0) a=Math.min(1,bell)*0.6; ampSm += (a-ampSm)*0.25; fs.amp=Math.max(ampSm, Math.min(1,bell)*0.75);
  var seeing = S.mirror && MIR.conf>0.35 && !MIR.moving;
  if(seeing){ fs.fill=MIR.fill; fs.flow=MIR.flow; fs.amp=Math.min(1,Math.abs(MIR.flow)); }
  mirrorVoiceFrame();
  fs.temp = st.stage==="set" && S.reps>1 ? (st.rep-1)/(S.reps-1) : st.stage==="rest"?0.5:0.15;
  S.turb *= (1 - 0.12*Math.min(1, (now - (S._lt||now)))); S._lt=now;
  fs.turb=Math.min(1,S.turb);
  touchState(now, fs);
  var beat=0; if(S.tapOn && st.stage==="set" && (st.k==="in"||st.k==="out")){ var bt=into-Math.floor(into); beat=Math.exp(-bt/0.10); }
  fs.still = st.k==="hold" || st.k==="empty";
  fs.pulse=0; if(fs.still && into>=1){ var hb=into-Math.floor(into); fs.pulse=Math.exp(-hb/0.12); }
  fs.rim = 0.09*fs.fill + 0.16*fs.pulse + (fs.still?0.04:0);
  fs.ground=ground(Math.min(1.2, fs.fill + 0.14*beat + 0.18*fs.tapK + 0.05*fs.pulse), fs.temp, fs.dim);
  if(st.k==="done"){ if(lastWord!=="DONE") paintDone(); return; }
  elEnd.classList.remove("hid");
  var isRest=st.stage==="rest", isSet=st.stage==="set";
  lastWord=txt(elWordI, wordFor(st), lastWord); breathe(elWord, fs.fill, "w");
  lastSub=txt(elSub, subFor(st), lastSub);
  if(isRest){ var left=rem,i; for(i=S.idx+1;i<S.steps.length&&S.steps[i].stage==="rest"&&S.steps[i].set===st.set;i++) left+=S.steps[i].dur; lastNum=txt(elNum,fmtClock(left),lastNum); }
  else { var shown=Math.min(Math.ceil(rem-0.001),Math.ceil(st.dur)); lastNum=txt(elNum, String(shown||1), lastNum); }
  setRail(frac);
  var meta;
  if(isRest) meta="REST · SET "+st.set+"/"+S.sets;
  else if(S.mode==="breathe"){ meta = isSet ? ("CYCLE "+st.rep+"/"+S.reps + (S.tapOn ? (st.k==="hold" ? " · PRESS" : " · TAP") : "")) : ""; }
  else meta="SET "+st.set+"/"+S.sets+(isSet?" · REP "+st.rep+"/"+S.reps:"");
  lastMeta=txt(elMeta, meta, lastMeta);
  setFoot(isRest?"skip": (isSet && S.mode==="lift") ? "save" : null);
}
function idleRender(t){
  var fs=frameState; fs.idle=true; fs.phase="idle"; fs.stage=""; fs.flow=0; fs.amp=0.2; fs.turb=Math.max(0, fs.turb-0.01);
  fs.fill = 0.28 + 0.12*Math.sin(t*0.35); fs.temp=0.1; breathe(elMark, 0.5+0.5*Math.sin(t*0.35), "m"); fs.dim=1; fs.ground=ground(fs.fill, fs.temp, 1); fs.tapK=0; fs.pinK=0; fs.rim=0.05; fs.pulse=0; fs.still=false;
}

/* ============================ LOOP ============================ */
var raf=0, lastT=0, perfOn=!!Q.perf, fpsEMA=60, frameNo=0;
function tick(){
  raf=requestAnimationFrame(tick);
  var now=nowSec(), t=performance.now()/1000, wall=lastT?Math.min(0.1, t-lastT):1/60, dt=Math.min(1/20, wall); lastT=t;   /* a late frame advances the air by the time that passed, up to 50 ms */
  if(S.running){
    var guard=0;
    while(S.idx<S.steps.length-1 && now>=S.stepStart+S.steps[S.idx].dur && guard++<400){
      var prev=S.steps[S.idx]; S.stepStart+=prev.dur; S.idx++; var cur=S.steps[S.idx];
      if(prev.stage==="set" && !(cur.stage==="set"&&cur.set===prev.set)) recordSet(prev.set, S.reps);
    }
    scheduleAhead(now);
    if(S.steps[S.idx]&&S.steps[S.idx].k==="done") endSession(true);
  }
  if(elRun.classList.contains("on")) render(now); else idleRender(t);
  if(MASK.dirty){ buildMask(elRun.classList.contains("on") ? elWordI : (document.getElementById("s-home").classList.contains("on") ? elMark : null)); }
  var c0=performance.now();
  ENG.inst.frame(dt, frameState, t);
  budget(performance.now()-c0, wall*1000, t);
  frameNo++;
  if(perfOn){ fpsEMA += (1/Math.max(wall,1e-3)-fpsEMA)*0.05; elPerf.style.display="block"; elPerf.textContent = ENG.inst.info()+"\n"+cpuEMA.toFixed(1)+" ms engine · "+fpsEMA.toFixed(0)+" fps"+(ENG.reason?"\n"+ENG.reason:"")+(MIR.on?"\nmirror ax"+MIR.axis+" sign"+MIR.sign+" env "+(MIR.env[Math.max(0,MIR.axis)]*1000).toFixed(1)+"m · "+MIR.rate.toFixed(1)+"/min conf "+MIR.conf.toFixed(2)+(MIR.moving?" MOVING":""):""); }
}

/* ============================ UI ============================ */
function fmtN(v){ return (Math.round(v*10)/10).toString(); }
var setupMode="lift";
var SOUND_SUB={tone:"Two notes. A high one opens as you breathe in, a low one closes as you breathe out.", bells:"Two soft bells, a high one for in and a low one for out, over the two notes.", breath:"A breath of wind, in and out."};
var LABEL={"in":"lower",out:"lift",hold:"hold",empty:"hold"};
function refresh(){
  var L=DB.cfg.lift, P=DB.cfg.breathe, i;
  document.getElementById("v-reps").textContent=L.reps[L.preset]; document.getElementById("v-sets").textContent=L.sets; document.getElementById("v-cycles").textContent=P.cycles;
  function bar(seq, names){ var h="", j; for(j=0;j<seq.length;j++) h+='<b style="flex:'+seq[j][1]+' 1 0"><i>'+names[seq[j][0]]+'</i><u>'+fmtN(seq[j][1])+'</u></b>'; return h; }
  document.getElementById("bar-drive").innerHTML=bar(L.tune.drive.seq, LABEL); document.getElementById("bar-squeeze").innerHTML=bar(L.tune.squeeze.seq, LABEL);
  document.getElementById("rest-drive").textContent="rest "+fmtClock(L.tune.drive.rest); document.getElementById("rest-squeeze").textContent="rest "+fmtClock(L.tune.squeeze.rest);
  var doors=document.querySelectorAll(".door[data-preset]"); for(i=0;i<doors.length;i++) doors[i].classList.toggle("sel", doors[i].getAttribute("data-preset")===L.preset);
  var belly=P.belly!=="off", tap=P.tap==="on", sound=DB.cfg.sound;
  document.getElementById("bar-478").innerHTML=bar([["in",4],["hold",7],["out",8]], {"in":"in",hold:"hold",out:"out"}); document.getElementById("bar-coh").innerHTML=bar([["in",5.5],["out",5.5]], {"in":"in",out:"out"});
  document.getElementById("v-time").textContent=fmtClock(P.cycles*(P.pat==="coh"?11:19));
  document.getElementById("sound-sub").textContent = SOUND_SUB[sound];
  /* the look: one chip per palette, each carrying its own ground and air as a swatch */
  var lk=document.getElementById("seg-look"); if(!lk.children.length){ var h=""; for(var pn in PALETTES){ var pp=PALETTES[pn], g=hsl(pp.full[0],pp.full[1],pp.full[2]), ac=hsl(pp.air[0],pp.air[1],pp.air[2]); h+='<button data-pal="'+pn+'"><i style="background:linear-gradient(90deg,'+css(g)+' 55%,'+css(ac)+' 55%)"></i>'+pp.name+'</button>'; } lk.innerHTML=h; }
  var lb=lk.querySelectorAll("button"); for(i=0;i<lb.length;i++) lb[i].classList.toggle("sel", lb[i].getAttribute("data-pal")===DB.cfg.pal);
  document.getElementById("look-sub").textContent = PAL.note;
  var seg=document.querySelectorAll("#seg-with button"); for(i=0;i<seg.length;i++){ var wk=seg[i].getAttribute("data-w"); seg[i].classList.toggle("sel", wk==="belly"?belly:tap); }
  var parts=[]; if(belly) parts.push("Belly: phone on your belly, it reads your breath."); if(tap) parts.push("Tap: tap the count, hold to hold.");
  document.getElementById("with-sub").textContent = parts.length ? parts.join(" ") : "Nothing extra.";
  document.getElementById("card-with").classList.toggle("hid", setupMode!=="breathe");
  document.getElementById("setup-lift").classList.toggle("hid", setupMode!=="lift"); document.getElementById("setup-breathe").classList.toggle("hid", setupMode!=="breathe");
  document.getElementById("setup-title").textContent = setupMode==="lift"?"Lift":"Breathe";
  var pd=document.querySelectorAll(".door[data-pat]"); for(i=0;i<pd.length;i++) pd[i].classList.toggle("sel", pd[i].getAttribute("data-pat")===P.pat);
  var snd=document.querySelectorAll("[data-sound]"); for(i=0;i<snd.length;i++) snd[i].classList.toggle("sel", sound===snd[i].getAttribute("data-sound"));
}
var LIM={reps:[1,60,1],sets:[1,20,1],cycles:[1,40,1]};
function bump(key,delta){
  var lim=LIM[key], v;
  if(key==="reps"){ var L=DB.cfg.lift; v=Math.max(lim[0],Math.min(lim[1],(+L.reps[L.preset])+delta)); L.reps[L.preset]=v; }
  else { var tgt=key==="cycles"?DB.cfg.breathe:DB.cfg.lift; v=Math.max(lim[0],Math.min(lim[1],(+tgt[key])+delta)); tgt[key]=v; }
  save(); refresh();
}
function setPalette(name){ if(!PALETTES[name]) return; DB.cfg.pal=name; PAL=PALETTES[name]; applyPalette(); save(); refresh(); MASK.dirty=true; }
function show(id){
  var ids=["home","setup","run"]; for(var i=0;i<ids.length;i++) document.getElementById("s-"+ids[i]).classList.toggle("on", ids[i]===id);
  if(id==="setup") refresh();
  MASK.dirty=true;
}
document.addEventListener("click", function(ev){
  var t=ev.target.closest ? ev.target.closest("[data-go],[data-s],[data-preset],[data-pat],[data-sound],[data-w],[data-pal]") : null; if(!t||t.disabled) return; var v;
  if((v=t.getAttribute("data-go"))){ if(S.running) return; if(v==="lift"||v==="breathe"){ setupMode=v; show("setup"); } else show(v); return; }
  if((v=t.getAttribute("data-s"))){ var p=v.split(":"); bump(p[0],parseFloat(p[1])); return; }
  if((v=t.getAttribute("data-preset"))){ DB.cfg.lift.preset=v; save(); refresh(); return; }
  if((v=t.getAttribute("data-pat"))){ DB.cfg.breathe.pat=v; save(); refresh(); return; }
  if((v=t.getAttribute("data-w"))){ var B=DB.cfg.breathe; B[v] = (v==="belly" ? B[v]!=="off" : B[v]==="on") ? "off" : "on"; save(); refresh(); return; }
  if((v=t.getAttribute("data-sound"))){ DB.cfg.sound=v; save(); refresh(); return; }
  if((v=t.getAttribute("data-pal"))){ setPalette(v); return; }
});
document.getElementById("b-start").addEventListener("click", function(){
  initAudio(); if(A){ try{ A.ctx.resume(); }catch(e){} try{ var p=audioEl.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  var wantMirror = setupMode==="breathe" && DB.cfg.breathe.belly!=="off";
  if(!wantMirror){ startSession(setupMode); return; }
  motionRequest().then(function(ok){ MIR.perm = ok ? "granted" : "denied"; startSession(setupMode); });
});
bSkip.addEventListener("click", function(e){ e.stopPropagation(); skipRest(); });
bSave.addEventListener("click", function(e){ e.stopPropagation(); saveSet(); });
bBack.addEventListener("click", function(e){ e.stopPropagation(); show("home"); });
elEnd.addEventListener("click", function(e){ e.stopPropagation(); endSession(false); });
var elFlash=document.getElementById("flash");
elRun.addEventListener("pointerdown", function(ev){
  if(ev.target.closest && ev.target.closest("button")) return; if(!S.running) return;
  if(A&&A.ctx.state!=="running"){ try{A.ctx.resume();}catch(e){} }
  if(!tapDown(ev.clientX, ev.clientY)) return;
  if(S.mode==="lift"){ elFlash.classList.remove("go"); void elFlash.offsetWidth; elFlash.classList.add("go"); }
});
elRun.addEventListener("pointermove", function(ev){ tapMove(ev.clientX, ev.clientY); });
window.addEventListener("pointerup", tapUp);
window.addEventListener("pointercancel", tapUp);
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
document.addEventListener("dblclick", function(e){ e.preventDefault(); });
window.addEventListener("resize", function(){ fitWordOnce(); ENG.inst.resize(); MASK.dirty=true; });
try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ fitWordOnce(); MASK.dirty=true; }); }catch(e){}

/* debug handle for the probe harness; harmless in production */
window.WIND = {
  state:function(){ return {eng:ENG.name, reason:ENG.reason, phase:frameState.phase, fill:frameState.fill, flow:frameState.flow, amp:frameState.amp, turb:frameState.turb, idx:S.idx, running:S.running, cpu:cpuEMA, frame:frameNo, info:ENG.inst.info(), pal:DB.cfg.pal}; },
  start:function(m){ setupMode=m||"lift"; startSession(setupMode); }, end:function(){ endSession(false); }, sync:function(){ reanchor(false); }, down:tapDown, move:tapMove, up:tapUp,
  steps:function(n){ return S.steps.slice(S.idx, S.idx+(n||4)).map(function(q){ return q.k+":"+q.dur.toFixed(2); }); }, into:function(){ return nowSec()-S.stepStart; }, turb:function(){ return S.turb; },
  tone:function(){ if(!scheme||!scheme.hi) return null; return {dir:scheme.dir, hi:+scheme.hi.g.gain.value.toFixed(4), lo:+scheme.lo.g.gain.value.toFixed(4), hifc:Math.round(scheme.hi.lp.frequency.value), lofc:Math.round(scheme.lo.lp.frequency.value)}; },
  words:function(){ return {word:elWordI.textContent, sub:elSub.textContent, num:elNum.textContent, meta:elMeta.textContent, rail:elTl.children.length}; },
  palette:setPalette, palettes:function(){ return Object.keys(PALETTES); }, scheme:function(){ return scheme?scheme.kind:null; }, set:function(k,v){ if(k==="sound") DB.cfg.sound=v; else DB.cfg.breathe[k]=v; },
  grant:function(){ MIR.perm="granted"; }, motion:function(x,y,z){ onMotion({accelerationIncludingGravity:{x:x,y:y,z:z}}); }, mir:function(){ return {on:MIR.on,axis:MIR.axis,sign:MIR.sign,env:MIR.env,rate:MIR.rate,period:MIR.period,conf:MIR.conf,starts:MIR.starts.length,moving:MIR.moving,fill:MIR.fill,flow:MIR.flow,mirror:S.mirror}; }
};
/* ---- boot ---- */
fitWordOnce();
pickEngine();
show("home");
if(Q.auto){ setupMode = Q.auto==="breathe"?"breathe":"lift"; setTimeout(function(){ startSession(setupMode); }, 300); }
raf=requestAnimationFrame(tick);
})();
</script>
