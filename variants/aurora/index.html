<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0918">
<title>The Wind</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0918; --fg:#f3efff; --mute:rgba(243,239,255,.58);
  --line:rgba(255,255,255,.16); --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12);
  --acc:#7ff0ff; --acc2:#9f70ff; --warm:#ffb38a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg)}
body{font-family:'Manrope','Avenir Next','Helvetica Neue',-apple-system,system-ui,sans-serif;color:var(--fg);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}

#bg{position:fixed;inset:0;background:var(--bg);z-index:0;overflow:hidden;
  transition:background-color .5s cubic-bezier(.42,0,.25,1)}
body.slow #bg{transition-duration:1.2s}
#bg::before,#bg::after{content:"";position:absolute;border-radius:50%;filter:blur(44px);opacity:.5;
  transition:opacity .9s ease}
#bg::before{left:-96px;top:9%;width:340px;height:340px;
  background:radial-gradient(circle,#7ff0ff,rgba(127,240,255,0) 70%);animation:drift 17s ease-in-out infinite}
#bg::after{right:-124px;top:2%;width:380px;height:380px;
  background:radial-gradient(circle,#9f70ff,rgba(159,112,255,0) 70%);animation:drift 23s ease-in-out infinite reverse}
body.run #bg::before,body.run #bg::after{opacity:.14}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-22px,28px) scale(1.15)}}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.12}100%{opacity:0}}

.screen{position:relative;z-index:1;display:none;flex-direction:column;
  min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 26px) calc(env(safe-area-inset-right) + 26px) calc(env(safe-area-inset-bottom) + 26px) calc(env(safe-area-inset-left) + 26px)}
.screen.on{display:flex}
.eyebrow{font-size:14px;font-weight:600;color:var(--mute);text-transform:lowercase;letter-spacing:0}
.spacer{flex:1 1 auto}
button{font:inherit;color:inherit;background:transparent;border:0;margin:0;padding:0;cursor:pointer}

.brand{display:flex;flex-direction:column;gap:12px}
.brand .bm{font-family:'Unbounded','Futura','Century Gothic',sans-serif;font-weight:300;
  font-size:min(12vw,46px);line-height:1.02;letter-spacing:-.02em;color:#fff}
.brand .bm b{font-weight:700}
.brand .bs{font-size:14px;font-weight:500;color:var(--mute)}

.btn{display:block;width:100%;padding:20px 18px;border-radius:26px;background:var(--glass);
  border:1px solid var(--line);color:var(--fg);font-size:15px;font-weight:600;text-align:center;
  text-transform:lowercase;letter-spacing:0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn:active{background:var(--glass2)}
.btn.go{background:linear-gradient(135deg,#7ff0ff,#9f70ff);border:0;color:#0a0918;
  font-family:'Unbounded','Futura','Century Gothic',sans-serif;font-weight:500;font-size:22px;
  letter-spacing:-.01em;padding:24px 18px;box-shadow:0 14px 40px rgba(127,240,255,.3)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute);
  padding:16px;font-size:14px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}

.modes{display:flex;flex-direction:column;gap:14px}
.mode{position:relative;width:100%;text-align:left;padding:30px 96px 30px 28px;border-radius:30px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.mode:active{background:var(--glass2)}
.mode::after{content:"";position:absolute;right:26px;top:50%;width:56px;height:56px;margin-top:-28px;
  border-radius:50%;background:linear-gradient(135deg,#7ff0ff,#9f70ff);z-index:0;
  box-shadow:0 10px 30px rgba(127,240,255,.32)}
.mode::before{content:"";position:absolute;right:45px;top:50%;width:11px;height:11px;margin-top:-6px;
  border-right:2.4px solid #0a0918;border-top:2.4px solid #0a0918;transform:rotate(45deg);z-index:1}
.modes .mode:nth-child(2)::after{background:linear-gradient(135deg,#ffb38a,#ff7fa8);
  box-shadow:0 10px 30px rgba(255,150,140,.32)}
.mode .t{font-family:'Unbounded','Futura','Century Gothic',sans-serif;font-weight:500;
  font-size:min(8vw,31px);line-height:1.05;letter-spacing:-.01em;color:#fff;text-transform:lowercase}
.mode .s{font-size:13px;color:var(--mute);margin-top:8px;text-transform:lowercase}

.card{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:6px 22px;
  margin-bottom:14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,.09)}
.row:last-child{border-bottom:0}
.row.stack{flex-direction:column;align-items:stretch;gap:12px}
.row.stack .seg{justify-content:stretch}
.row.stack .seg button{flex:1 1 0;min-width:0;padding:16px 2px;font-size:13px}
.lbl{font-size:13px;font-weight:600;color:var(--mute);text-transform:lowercase;letter-spacing:0}
.step{display:flex;align-items:center;gap:4px}
.step button{width:52px;height:52px;border-radius:50%;background:var(--glass2);border:1px solid var(--line);
  font-size:24px;line-height:1;color:var(--fg);display:flex;align-items:center;justify-content:center}
.step button:active{background:rgba(127,240,255,.22);border-color:var(--acc)}
.step .v{min-width:78px;text-align:center;font-family:'Unbounded','Futura','Century Gothic',sans-serif;
  font-weight:500;font-size:28px;line-height:1;letter-spacing:-.02em}
.seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:14px 17px;border-radius:20px;background:var(--glass2);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--mute);text-transform:lowercase}
.seg button.sel{background:linear-gradient(135deg,rgba(127,240,255,.9),rgba(159,112,255,.9));
  border-color:transparent;color:#0a0918;box-shadow:0 8px 22px rgba(127,240,255,.28)}
.counts{display:flex;gap:10px;margin-bottom:14px}
.cnt{flex:1;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:14px 6px;
  text-align:center;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.cnt .cl{font-size:12px;font-weight:600;color:var(--mute);text-transform:lowercase}
.cnt .cv{font-family:'Unbounded','Futura','Century Gothic',sans-serif;font-weight:500;font-size:26px;
  line-height:1.05;margin:4px 0 8px;letter-spacing:-.02em}
.cnt .cb{display:flex;gap:6px}
.cnt .cb button{flex:1;height:40px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);font-size:18px}
.cnt .cb button:active{background:rgba(127,240,255,.22)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.foot{display:flex;gap:10px;margin-top:14px}
.foot .btn{flex:1}

/* ---------- run screen ---------- */
#s-run{padding:calc(env(safe-area-inset-top) + 16px) 0 calc(env(safe-area-inset-bottom) + 20px)}
#endbtn{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 18px);
  z-index:4;padding:12px 14px;font-size:14px;font-weight:600;color:inherit;opacity:.55;text-transform:lowercase}
#rmeta{text-align:center;font-size:min(3.6vw,14px);font-weight:600;opacity:.6;text-transform:lowercase;
  padding:10px 86px;min-height:24px;white-space:nowrap;overflow:hidden}
#s-run .mid{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:min(4vh,30px)}

#ringwrap{position:relative;width:min(76vw,40vh);height:min(76vw,40vh);display:flex;align-items:center;justify-content:center}
#orb{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.42),rgba(255,255,255,0) 58%),
             linear-gradient(160deg,var(--acc),var(--acc2));
  box-shadow:0 30px 80px rgba(127,240,255,.26),inset 0 -22px 60px rgba(10,9,24,.5);
  transform:scale(.52);will-change:transform}
#ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);display:block}
#ring .track{fill:none;stroke:currentColor;stroke-opacity:.14;stroke-width:1.2}
#ring .fill{display:none}
#ringin{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#word span{display:inline-block}
#word{overflow:visible;font-family:'Unbounded','Futura','Century Gothic',sans-serif;font-weight:700;
  line-height:1.12;text-align:center;white-space:nowrap;letter-spacing:-.03em;width:100%;
  text-transform:lowercase;text-shadow:0 6px 30px rgba(10,9,24,.45)}
#num{font-family:'Unbounded','Futura','Century Gothic',sans-serif;font-weight:300;
  font-size:min(9vw,6.5vh);line-height:1.2;text-align:center;opacity:.9}
#dots{display:flex;flex-wrap:wrap;gap:min(2.6vw,12px);justify-content:center;padding:0 26px;min-height:min(4vw,22px)}
#dots i{width:min(3vw,11px);height:min(3vw,11px);border-radius:50%;background:currentColor;opacity:.22}
#dots i.on{opacity:1;background:#fff}
#dots i.cur{opacity:.8;background:#fff}
#bar{height:min(2.4vw,12px);border-radius:99px;margin:0 30px;width:calc(100% - 60px);
  background:rgba(255,255,255,.14);overflow:hidden}
#bar span{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 16px var(--acc)}
#clock{font-family:'Unbounded','Futura','Century Gothic',sans-serif;font-weight:300;
  font-size:min(15vw,10vh);line-height:1;text-align:center;letter-spacing:-.03em}
#runfoot{padding:0 26px;display:flex;flex-direction:column;gap:10px;width:100%}
#runfoot .btn{border-color:rgba(255,255,255,.22);color:inherit;background:rgba(255,255,255,.08)}
#runfoot .btn.wide{font-family:'Unbounded','Futura','Century Gothic',sans-serif;font-weight:500;
  font-size:22px;letter-spacing:-.01em;padding:22px 12px}
#runfoot .btn:active{background:rgba(255,255,255,.16)}
.hid{display:none !important}

/* stats */
.stat{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0;
  border-bottom:1px solid rgba(255,255,255,.09)}
.stat .n{font-family:'Unbounded','Futura','Century Gothic',sans-serif;font-weight:500;font-size:34px;
  line-height:1;letter-spacing:-.03em}
.log{font-size:14px;color:rgba(243,239,255,.78);padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;gap:10px}
.log .d{color:var(--mute);font-size:12px}
</style>
</head>
<body>
<div id="bg"></div>
<div id="flash"></div>
<audio id="aout" playsinline style="display:none"></audio>

<!-- MODE PICK -->
<section id="s-mode" class="screen on">
  <div class="brand"><div class="bm">the<br><b>wind</b></div><div class="bs">breathe with the bar. breathe to sleep.</div></div>
  <div class="spacer"></div>
  <div class="modes">
    <button class="mode" data-go="lift"><div class="t">LIFT</div><div class="s">sets · reps · rest</div></button>
    <button class="mode" data-go="breathe"><div class="t">BREATHE</div><div class="s">cycles</div></button>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost" data-go="stats">Stats</button>
</section>

<!-- LIFT SETUP -->
<section id="s-lift" class="screen">
  <div class="top"><button class="btn ghost" style="width:auto;padding:10px 16px" data-go="mode">Back</button><span class="eyebrow">Lift</span></div>
  <div class="scroll">
    <div class="card">
      <div class="row stack">
        <div class="seg" id="seg-preset">
          <button data-preset="compound">Compound</button>
          <button data-preset="isolation">Isolation</button>
          <button data-preset="hold">Hold</button>
        </div>
        <div id="preset-sub" style="text-align:center;font-size:12px;letter-spacing:.22em;color:var(--mute);padding-bottom:6px"></div>
      </div>
    </div>

    <div class="card">
      <div class="row" id="row-reps"><span class="lbl">Reps</span>
        <div class="step"><button data-s="reps:-1">−</button><span class="v" id="v-reps">10</span><button data-s="reps:1">+</button></div></div>
      <div class="row hid" id="row-hsec"><span class="lbl">Seconds</span>
        <div class="step"><button data-s="holdSec:-5">−</button><span class="v" id="v-holdSec">45</span><button data-s="holdSec:5">+</button></div></div>
      <div class="row"><span class="lbl">Sets</span>
        <div class="step"><button data-s="sets:-1">−</button><span class="v" id="v-sets">4</span><button data-s="sets:1">+</button></div></div>
    </div>

    <div class="card">
      <div class="row stack"><span class="lbl">Sound</span>
        <div class="seg sound" data-for="lift"></div></div>
    </div>

    <button class="btn ghost" id="b-tune">Tune</button>
    <div id="tunebox" class="hid">
      <div class="counts" style="margin-top:14px">
        <div class="cnt"><div class="cl">In</div><div class="cv" id="v-in">4</div>
          <div class="cb"><button data-s="in:-0.5">−</button><button data-s="in:0.5">+</button></div></div>
        <div class="cnt"><div class="cl">Hold</div><div class="cv" id="v-hold">2</div>
          <div class="cb"><button data-s="hold:-0.5">−</button><button data-s="hold:0.5">+</button></div></div>
        <div class="cnt"><div class="cl">Out</div><div class="cv" id="v-out">6</div>
          <div class="cb"><button data-s="out:-0.5">−</button><button data-s="out:0.5">+</button></div></div>
      </div>
      <div class="card">
        <div class="row"><span class="lbl">Rest</span>
          <div class="step"><button data-s="rest:-15">−</button><span class="v" id="v-rest">3:00</span><button data-s="rest:15">+</button></div></div>
      </div>
    </div>
  </div>
  <div class="foot"><button class="btn go" data-start="lift">Start</button></div>
</section>

<!-- BREATHE SETUP -->
<section id="s-breathe" class="screen">
  <div class="top"><button class="btn ghost" style="width:auto;padding:10px 16px" data-go="mode">Back</button><span class="eyebrow">Breathe</span></div>
  <div class="scroll">
    <div class="card">
      <div class="row stack"><span class="lbl">Pattern</span>
        <div class="seg" id="seg-pat"><button data-pat="478">4 · 7 · 8</button><button data-pat="coh">5.5 · 5.5</button></div></div>
      <div class="row"><span class="lbl">Cycles</span>
        <div class="step"><button data-s="cycles:-1">−</button><span class="v" id="v-cycles">8</span><button data-s="cycles:1">+</button></div></div>
    </div>
    <div class="card">
      <div class="row stack"><span class="lbl">Sound</span><div class="seg sound" data-for="breathe"></div></div>
    </div>
  </div>
  <div class="foot"><button class="btn go" data-start="breathe">Start</button></div>
</section>

<!-- RUN -->
<section id="s-run" class="screen">
  <button id="endbtn">End</button>
  <div id="rmeta"></div>
  <div class="mid">
    <div id="ringwrap">
      <div id="orb"></div>
      <svg id="ring" viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="46"/>
        <circle class="fill" cx="50" cy="50" r="46"/>
      </svg>
      <div id="ringin">
        <div id="word"><span></span></div>
        <div id="num"></div>
      </div>
    </div>
    <div id="clock" class="hid"></div>
    <div id="dots"></div>
    <div id="bar" class="hid"><span></span></div>
  </div>
  <div id="runfoot">
    <button class="btn wide hid" id="b-skip">Skip rest</button>
    <button class="btn hid" id="b-save">Save set</button>
    <button class="btn hid" id="b-back">Back</button>
  </div>
</section>

<!-- STATS -->
<section id="s-stats" class="screen">
  <div class="top"><button class="btn ghost" style="width:auto;padding:10px 16px" data-go="mode">Back</button><span class="eyebrow">Stats</span></div>
  <div class="scroll" id="statbody"></div>
  <div class="foot"><button class="btn ghost" id="b-reset">Clear data</button></div>
</section>

<script>
(function(){
"use strict";

/* ============================ STORAGE ============================ */
var KEY = "bp.v3";
var DEF = {
  cfg: {
    lift: {preset:"compound", reps:10, sets:4, holdSec:45, sound:"tone",
      tune:{compound:{"in":4, hold:2, out:6, rest:180},
            isolation:{"in":2, hold:0, out:3, rest:90},
            hold:{"in":4, hold:0, out:8, rest:90}}},
    breathe: {cycles:8, pat:"478", sound:"tone"}
  },
  stats: {sec:0, modes:{lift:0, breathe:0}, log:[]}
};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var DB = clone(DEF);
var SOUND_OK = {tone:1, breath:1};
var PRESET_OK = {compound:1, isolation:1, hold:1};

/* old flat lift config (v1/v2) -> preset shape */
function liftToV3(o){
  var out = clone(DEF.cfg.lift);
  if(!o) return out;
  if(o.reps) out.reps = o.reps;
  if(o.sets) out.sets = o.sets;
  if(o.holdSec) out.holdSec = o.holdSec;
  if(o.sound) out.sound = o.sound;
  out.preset = o.holdMode ? "hold" : (o.type === "isolation" ? "isolation" : "compound");
  if(!o.holdMode && o["in"] !== undefined){
    var t = out.tune[out.preset];
    t["in"] = +o["in"] || t["in"];
    t.hold = +o.hold || 0;
    t.out = +o.out || t.out;
    t.rest = +o.rest || t.rest;
  }
  return out;
}
try{
  var raw = JSON.parse(localStorage.getItem(KEY) || "null");
  if(!raw){
    var v2 = JSON.parse(localStorage.getItem("bp.v2") || "null");
    if(!v2){
      var v1 = JSON.parse(localStorage.getItem("bp.v1") || "null");
      if(v1){
        var st1 = v1.stats || {};
        v2 = {cfg:{lift: v1.cfg && v1.cfg.lift || {}, breathe: v1.cfg && v1.cfg.sleep || {}},
          stats:{sec: st1.sec || 0,
            modes:{lift:(st1.modes&&st1.modes.lift)||0,
                   breathe:((st1.modes&&st1.modes.sleep)||0)+((st1.modes&&st1.modes.drive)||0)},
            log:(st1.log||[]).map(function(e){ if(e.m==="sleep")e.m="breathe"; return e; })}};
      }
    }
    if(v2){
      raw = {cfg:{lift: liftToV3(v2.cfg && v2.cfg.lift), breathe: v2.cfg && v2.cfg.breathe || {}},
             stats: v2.stats || {}};
    }
  }
  if(raw && raw.cfg){
    var L = raw.cfg.lift;
    if(L){
      if(L.tune === undefined) L = liftToV3(L);
      ["preset","reps","sets","holdSec","sound"].forEach(function(k){ if(L[k] !== undefined) DB.cfg.lift[k] = L[k]; });
      if(L.tune) for(var pk in DB.cfg.lift.tune){ if(L.tune[pk]) for(var tk in DB.cfg.lift.tune[pk]) if(L.tune[pk][tk] !== undefined) DB.cfg.lift.tune[pk][tk] = L.tune[pk][tk]; }
    }
    if(raw.cfg.breathe) for(var bk in DB.cfg.breathe) if(raw.cfg.breathe[bk] !== undefined) DB.cfg.breathe[bk] = raw.cfg.breathe[bk];
  }
  if(raw && raw.stats){
    DB.stats.sec = raw.stats.sec || 0;
    if(raw.stats.modes) for(var mm in DB.stats.modes) DB.stats.modes[mm] = raw.stats.modes[mm] || 0;
    DB.stats.log = raw.stats.log || [];
  }
}catch(e){}
if(!SOUND_OK[DB.cfg.lift.sound]) DB.cfg.lift.sound = "tone";
if(!SOUND_OK[DB.cfg.breathe.sound]) DB.cfg.breathe.sound = "tone";
if(!PRESET_OK[DB.cfg.lift.preset]) DB.cfg.lift.preset = "compound";
try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

/* ============================ CLOCK ============================
   One timebase. Follows the AudioContext clock while it advances and
   extrapolates with performance.now() when iOS suspends it, so the
   pacer can never freeze on screen. */
var A = null, lastCtxT = 0, lastPerfT = 0;
function nowSec(){
  var p = performance.now()/1000;
  if(A){
    var c = A.ctx.currentTime;
    if(c > lastCtxT){ lastCtxT = c; lastPerfT = p; return c; }
    return lastCtxT + (p - lastPerfT);
  }
  return p;
}
function toCtx(t){ return A.ctx.currentTime + Math.max(0, t - nowSec()); }

/* ============================ AUDIO ============================ */
var scheme = null;

function easeIO(p){ return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2; }
function easeOut(p){ return 1 - Math.pow(1-p, 3); }
function easeIn(p){ return p*p*p; }

function env(param, from, to, at, dur, shape){
  if(!A) return;
  var ctx = A.ctx, now = ctx.currentTime;
  var t0 = at < now ? now : at;
  shape = shape || easeIO;
  try{
    if(param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t0);
    else param.cancelScheduledValues(t0);
  }catch(e){ try{ param.cancelScheduledValues(t0); }catch(e2){} }
  var start = (at <= now + 0.03) ? param.value : from;
  if(!isFinite(start)) start = from;
  param.setValueAtTime(start, t0);
  var N = 26, i, p;
  for(i=1; i<=N; i++){
    p = i/N;
    param.linearRampToValueAtTime(start + (to-start)*shape(p), t0 + dur*p);
  }
}

function noiseBuffer(ctx, sec, brown){
  var len = Math.floor(ctx.sampleRate * sec);
  var b = ctx.createBuffer(2, len, ctx.sampleRate), c, d, i, w, last;
  for(c=0;c<2;c++){
    d = b.getChannelData(c); last = 0;
    for(i=0;i<len;i++){
      w = Math.random()*2 - 1;
      if(brown){ last = (last + 0.02*w) / 1.02; d[i] = last * 3.6; }
      else d[i] = w;
    }
  }
  return b;
}

function makeIR(ctx, sec){
  var rate = ctx.sampleRate, len = Math.floor(rate * sec);
  var b = ctx.createBuffer(2, len, rate), c, d, i, t, w, last, env2;
  for(c=0;c<2;c++){
    d = b.getChannelData(c); last = 0;
    for(i=0;i<len;i++){
      t = i/len;
      w = Math.random()*2 - 1;
      last = (last + 0.28*w) / 1.28;
      env2 = Math.pow(1-t, 2.6) * (1 - Math.exp(-i/(rate*0.012)));
      d[i] = (last*2.4 + w*0.22) * env2;
    }
  }
  return b;
}

var audioEl = document.getElementById("aout");
function initAudio(){
  if(A) return A;
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
  var ctx = new AC();
  var master = ctx.createGain(); master.gain.value = 0.0001;
  var lim = ctx.createDynamicsCompressor();
  try{
    lim.threshold.value = -8; lim.knee.value = 22; lim.ratio.value = 4;
    lim.attack.value = 0.02; lim.release.value = 0.5;
  }catch(e){}
  var roll = ctx.createBiquadFilter(); roll.type = "lowpass"; roll.frequency.value = 4200; roll.Q.value = 0.4;
  var shelf = ctx.createBiquadFilter(); shelf.type = "highshelf"; shelf.frequency.value = 2400; shelf.gain.value = -7;
  roll.connect(shelf); shelf.connect(lim); lim.connect(master);

  /* media-element route so iOS treats the session as media playback */
  try{
    var msd = ctx.createMediaStreamDestination();
    master.connect(msd);
    audioEl.srcObject = msd.stream;
    var pr = audioEl.play();
    if(pr && pr.catch) pr.catch(function(){});
  }catch(e){}
  master.connect(ctx.destination);

  var ka = ctx.createConstantSource ? ctx.createConstantSource() : null;
  if(ka){ var kg = ctx.createGain(); kg.gain.value = 0.0001; ka.connect(kg); kg.connect(ctx.destination); ka.start(); }

  var dryIn = ctx.createGain(); dryIn.gain.value = 1; dryIn.connect(roll);
  var wetIn = ctx.createGain(); wetIn.gain.value = 1;
  var conv = ctx.createConvolver(); conv.normalize = true;
  try{ conv.buffer = makeIR(ctx, 2.8); }catch(e){}
  var wet = ctx.createGain(); wet.gain.value = 0.42;
  wetIn.connect(roll);
  wetIn.connect(conv); conv.connect(wet); wet.connect(roll);

  A = {ctx:ctx, master:master, roll:roll, dryIn:dryIn, wetIn:wetIn, nodes:[]};
  lastCtxT = ctx.currentTime; lastPerfT = performance.now()/1000;
  ctx.onstatechange = function(){
    if(ctx.state === "running" && S.running){ S.schedIdx = S.idx - 1; }
  };
  try{
    if(window.MediaMetadata && navigator.mediaSession){
      navigator.mediaSession.metadata = new MediaMetadata({title:"Breathing"});
      navigator.mediaSession.playbackState = "playing";
      ["play","pause"].forEach(function(a){
        try{ navigator.mediaSession.setActionHandler(a, function(){ try{ ctx.resume(); audioEl.play(); }catch(e){} }); }catch(e){}
      });
    }
  }catch(e){}
  return A;
}
function keep(n){ A.nodes.push(n); return n; }

/* ---------- TONE — a soft 528 Hz pad. High voices breathe in,
   low voices breathe out, silence on the hold. No pitch sweeps. ---------- */
function mkTone(k){
  var ctx = A.ctx;
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1200; lp.Q.value = 0.4;
  function voice(freq, amp, dest){
    for(var d=0; d<2; d++){
      var o = ctx.createOscillator(); o.type = "sine";
      o.frequency.value = freq; o.detune.value = d ? 3 : -3;
      var og = ctx.createGain(); og.gain.value = amp*0.5;
      o.connect(og); og.connect(dest); o.start(); keep(o);
    }
  }
  var gHi = ctx.createGain(); gHi.gain.value = 0.0001;
  voice(528, 0.55, gHi); voice(792, 0.10, gHi); voice(396, 0.22, gHi);
  var gLo = ctx.createGain(); gLo.gain.value = 0.0001;
  voice(264, 0.60, gLo); voice(132, 0.30, gLo); voice(396, 0.14, gLo);
  gHi.connect(lp); gLo.connect(lp); lp.connect(A.wetIn);
  return {kind:"tone", hi:gHi, lo:gLo, lp:lp, k:k};
}

/* ---------- BREATH — a slow, relaxed meditation breath ---------- */
function mkBreath(k){
  var ctx = A.ctx;
  var src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx, 5, true); src.loop = true;
  var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 800; bp.Q.value = 0.9;
  var pk = ctx.createBiquadFilter(); pk.type = "peaking"; pk.frequency.value = 528; pk.Q.value = 1.2; pk.gain.value = 4;
  var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2300; lp.Q.value = 0.4;
  var g = ctx.createGain(); g.gain.value = 0.0001;
  src.connect(bp); bp.connect(pk); pk.connect(lp); lp.connect(g); g.connect(A.dryIn);
  src.start(); keep(src);
  return {kind:"breath", g:g, bp:bp, lp:lp, k:k};
}

function makeScheme(name, dim){
  if(!A) return null;
  var k = dim ? 0.7 : 1;
  A.roll.frequency.value = dim ? 2600 : 4200;
  if(name === "tone")   return mkTone(k);
  if(name === "breath") return mkBreath(k);
  return null;
}

/* Phase design: IN rises, HOLD is silent stillness, OUT falls. */
function schemePhase(kind, at, dur){
  if(!scheme || !A) return;
  var s = scheme, k = s.k, g = Math.max(dur, 0.35);

  if(s.kind === "tone"){
    var hi = 0.30*k, lo = 0.26*k;
    if(kind === "in"){
      env(s.hi.gain, 0.0001, hi, at, g*0.8, easeIO);            /* the bright pad swells in */
      env(s.hi.gain, hi, hi*0.85, at + g*0.8, g*0.2, easeIO);
      env(s.lo.gain, s.lo.gain.value, 0.03*k, at, g*0.5, easeIO);
      env(s.lp.frequency, 900, 2200, at, g, easeIO);
    }else if(kind === "hold"){
      env(s.hi.gain, s.hi.gain.value, 0.0001, at, Math.min(g*0.3, 0.45), easeOut);  /* silence */
      env(s.lo.gain, s.lo.gain.value, 0.0001, at, Math.min(g*0.3, 0.45), easeOut);
    }else if(kind === "out"){
      env(s.lo.gain, 0.0001, lo, at, g*0.25, easeOut);          /* the low pad answers... */
      env(s.lo.gain, lo, 0.0003, at + g*0.25, g*0.72, easeIO);  /* ...and settles to rest */
      env(s.hi.gain, s.hi.gain.value, 0.0001, at, g*0.4, easeIO);
      env(s.lp.frequency, 1800, 640, at, g, easeIO);
    }else{                                                       /* empty / getset / done */
      env(s.hi.gain, s.hi.gain.value, 0.0001, at, 0.4, easeIn);
      env(s.lo.gain, s.lo.gain.value, 0.0001, at, 0.4, easeIn);
    }
  }

  if(s.kind === "breath"){
    var top = 1.05*k;
    if(kind === "in"){
      env(s.g.gain, 0.0001, top, at, g*0.6, easeIO);             /* smooth draw in, peaking early */
      env(s.g.gain, top, top*0.35, at + g*0.6, g*0.35, easeIO);  /* settle before the top */
      env(s.bp.frequency, 520, 1400, at, g, easeIO);
      env(s.lp.frequency, 1800, 2600, at, g, easeIO);
    }else if(kind === "hold"){
      env(s.g.gain, s.g.gain.value, 0.0001, at, 0.3, easeOut);   /* held breath: silence */
    }else if(kind === "out"){
      env(s.g.gain, 0.0001, 0.9*k, at, g*0.14, easeOut);         /* soft release... */
      env(s.g.gain, 0.9*k, 0.0002, at + g*0.14, g*0.76, easeIO); /* ...long relaxed fall, done before the turn */
      env(s.bp.frequency, 1200, 380, at, g, easeIO);
      env(s.lp.frequency, 2300, 1100, at, g, easeIO);
    }else{
      env(s.g.gain, s.g.gain.value, 0.0001, at, 0.25, easeOut);
    }
  }
}

function audioStart(mode, sound){
  initAudio();
  if(!A) return;
  if(A.ctx.state !== "running"){ try{ A.ctx.resume(); }catch(e){} }
  try{ audioEl.play(); }catch(e){}
  teardownScheme();
  scheme = makeScheme(sound, mode === "breathe");
  var lvl = mode === "breathe" ? 0.62 : 0.92;
  env(A.master.gain, 0.0001, lvl, A.ctx.currentTime + 0.02, 1.0, easeOut);
  try{ if(navigator.mediaSession) navigator.mediaSession.playbackState = "playing"; }catch(e){}
}
function teardownScheme(){
  if(!A) return;
  for(var i=0;i<A.nodes.length;i++){ try{ A.nodes[i].stop(); }catch(e){} try{ A.nodes[i].disconnect(); }catch(e){} }
  A.nodes = [];
  scheme = null;
}
function audioStop(){
  if(!A) return;
  var t = A.ctx.currentTime;
  env(A.master.gain, A.master.gain.value, 0.0001, t, 1.2, easeIn);
  setTimeout(teardownScheme, 1500);
  try{ if(navigator.mediaSession) navigator.mediaSession.playbackState = "paused"; }catch(e){}
}

/* ============================ WAKE LOCK ============================ */
var wl = null;
function wake(on){
  try{
    if(on){
      if("wakeLock" in navigator && !wl){
        navigator.wakeLock.request("screen").then(function(l){
          wl = l; l.addEventListener("release", function(){ wl = null; });
        }, function(){ wl = null; });
      }
    }else if(wl){ wl.release(); wl = null; }
  }catch(e){ wl = null; }
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && S.running){

/* ============================ SESSION ============================ */
var LEAD = 0.12;
var S = {running:false, mode:"lift", sound:"tone", steps:[], idx:0, stepStart:0, schedIdx:-1,
         reps:10, sets:4, restDur:180, holdMode:0, holdSec:45, startedAt:0, recorded:{}, ended:false};

function ph(kind, dur, stage, setNo, rep){
  return {k:kind, dur:dur, stage:stage, set:setNo, rep:rep};
}
function pushCycle(arr, c, stage, setNo, rep){
  if(c["in"]  > 0) arr.push(ph("in",    c["in"],  stage, setNo, rep));
  if(c.hold   > 0) arr.push(ph("hold",  c.hold,   stage, setNo, rep));
  if(c.out    > 0) arr.push(ph("out",   c.out,    stage, setNo, rep));
  if(c.empty  > 0) arr.push(ph("empty", c.empty,  stage, setNo, rep));
}
function trimTo(arr, from, total){
  var acc = 0, i;
  for(i=from; i<arr.length; i++){
    if(acc + arr[i].dur >= total - 0.001){
      arr[i].dur = Math.max(total - acc, 0);
      arr.length = i + 1;
      if(arr[arr.length-1].dur < 0.4 && arr.length > from + 1) arr.length = arr.length - 1;
      return;
    }
    acc += arr[i].dur;
  }
}
function coherentSteps(seconds, stage, setNo){
  var out = [], n = Math.ceil(seconds / 11) * 2 + 2, i;
  for(i=0;i<n;i++) out.push(ph(i % 2 ? "out" : "in", 5.5, stage, setNo, 0));
  trimTo(out, 0, seconds);
  return out;
}

function buildSteps(){
  var st = [], c = DB.cfg, i, s, r;
  if(S.mode === "lift"){
    var T = c.lift.tune[c.lift.preset];
    var counts = {"in":+T["in"], hold:+T.hold, out:+T.out, empty:0};
    for(s=1; s<=S.sets; s++){
      st.push(ph("getset", 3, "getset", s, 0));
      var mark = st.length;
      if(S.holdMode){
        var cyc = counts["in"] + counts.hold + counts.out;
        var reps = Math.ceil(S.holdSec / cyc) + 1;
        for(r=1; r<=reps; r++) pushCycle(st, counts, "set", s, r);
        trimTo(st, mark, S.holdSec);
      }else{
        for(r=1; r<=S.reps; r++) pushCycle(st, counts, "set", s, r);
      }
      if(s < S.sets){
        var rest = coherentSteps(S.restDur, "rest", s);
        for(i=0;i<rest.length;i++) st.push(rest[i]);
      }
    }
  }else{
    var P = c.breathe;
    var cc = P.pat === "coh" ? {"in":5.5, hold:0, out:5.5, empty:0} : {"in":4, hold:7, out:8, empty:0};
    for(r=1; r<=P.cycles; r++) pushCycle(st, cc, "set", 1, r);   /* no countdown — begins on the first inhale */
  }
  st.push(ph("done", 1e9, "done", 0, 0));
  return st;
}

function startSession(mode){
  var c = DB.cfg;
  S.mode = mode;
  S.sound = c[mode].sound;
  if(mode === "lift"){
    S.reps = c.lift.reps; S.sets = c.lift.sets;
    S.restDur = c.lift.tune[c.lift.preset].rest;
    S.holdMode = c.lift.preset === "hold" ? 1 : 0; S.holdSec = c.lift.holdSec;
  }else{
    S.reps = c.breathe.cycles; S.sets = 1; S.holdMode = 0;
  }
  audioStart(mode, S.sound);
  if(!A) return;
  S.steps = buildSteps();
  S.idx = 0; S.schedIdx = -1; S.ended = false; S.recorded = {};
  S.stepStart = nowSec() + 0.1;
  S.startedAt = nowSec();
  S.running = true;
  document.body.classList.toggle("slow", mode === "breathe");
  show("run");
  wake(true);
  lastWord = lastNum = lastClock = lastMeta = lastBg = null;
  buildDots();
  elBarIn.style.width = "0%";
  if(!raf) raf = requestAnimationFrame(tick);
}

function endSession(natural){
  if(!S.running) return;
  S.running = false;
  var elapsed = Math.max(0, nowSec() - S.startedAt);
  DB.stats.sec += elapsed;
  DB.stats.modes[S.mode] = (DB.stats.modes[S.mode] || 0) + elapsed;
  save();
  audioStop();
  wake(false);
  S.ended = true;
  if(!natural){ show(S.mode); document.body.classList.remove("slow"); }
  else{ paint("done"); }
}

function recordSet(setNo, done){
  var id = S.mode + ":" + setNo;
  if(S.recorded[id]) return;
  S.recorded[id] = 1;
  var target = S.holdMode ? S.holdSec : S.reps;
  DB.stats.log.unshift({
    t: Date.now(), m: S.mode, s: setNo, of: S.sets,
    d: Math.round(done*10)/10, g: target, h: S.holdMode ? 1 : 0
  });
  if(DB.stats.log.length > 400) DB.stats.log.length = 400;
  save();
}

function setProgress(){
  var st = S.steps[S.idx];
  if(!st || st.stage !== "set") return 0;
  if(S.holdMode){
    var elapsed = 0, i;
    for(i=0;i<S.idx;i++) if(S.steps[i].stage === "set" && S.steps[i].set === st.set) elapsed += S.steps[i].dur;
    elapsed += Math.min(nowSec() - S.stepStart, st.dur);
    return Math.max(0, Math.min(elapsed, S.holdSec));
  }
  return Math.max(0, st.rep - 1);
}

function saveSet(){
  var st = S.steps[S.idx];
  if(!st || st.stage !== "set") return;
  recordSet(st.set, setProgress());
  var j = S.idx;
  while(j < S.steps.length && S.steps[j].stage === "set" && S.steps[j].set === st.set) j++;
  S.steps.splice(S.idx, j - S.idx);
  reanchor(true);
}
function skipRest(){
  var st = S.steps[S.idx];
  if(!st || st.stage !== "rest") return;
  var j = S.idx;
  while(j < S.steps.length && S.steps[j].stage === "rest" && S.steps[j].set === st.set) j++;
  S.steps.splice(S.idx, j - S.idx);
  reanchor(true);
}
function reanchor(hard){
  S.stepStart = nowSec();
  S.schedIdx = S.idx - 1;
  if(hard) lastBg = null;
}

function startTimeOf(j){
  var t = S.stepStart, k;
  for(k = S.idx; k < j; k++) t += S.steps[k].dur;
  return t;
}
function scheduleAhead(now){
  if(!A || A.ctx.state !== "running") return;
  var guard = 0;
  while(S.schedIdx < S.steps.length - 1 && guard++ < 6){
    var j = S.schedIdx + 1;
    var t = startTimeOf(j);
    if(t > now + LEAD) break;
    var stp = S.steps[j];
    if(stp.k !== "done") schemePhase(stp.k === "getset" ? "getset" : stp.k, toCtx(Math.max(t, now + 0.004)), stp.dur);
    S.schedIdx = j;
  }
}

/* ============================ RENDER ============================ */

var PAL = {

      out:["#170b12", "#d8b8a4", "#9a6a4e"], empty:["#04040a", "#5c5570", "#241f33"],
      getset:["#0a0918", "#b9c6dd", "#4a8fa8"], done:["#05040c", "#b9c6dd", "#4a8fa8"]}

elRingFill.style.strokeDashoffset = CIRC;

function setRing(p){                       /* p: 0 empty .. 1 full */

}
function palIdx(){ return S.mode === "breathe" ? 1 : 0; }
function fmtClock(s){
  s = Math.max(0, Math.ceil(s));
  var m = Math.floor(s/60), r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function paint(kind){
  var p = PAL[palIdx()][kind] || PAL[palIdx()].done;
  if(lastBg !== p[0]){
    elBg.style.backgroundColor = p[0];
    elRun.style.color = p[1];
    elRun.style.setProperty("--acc", p[2]);
    lastBg = p[0];
  }
}
var WORDFIT = {avail:0.72, w:0.22, h:0.16};
function fitWord(w){
  var avail = elRingWrap.clientWidth * WORDFIT.avail;
  if(!w || avail < 60) return;
  var size = Math.min(window.innerWidth*WORDFIT.w, window.innerHeight*WORDFIT.h);
  elWordI.textContent = w;
  elWord.style.fontSize = size + "px";
  var wd = elWordI.offsetWidth, pass = 0;
  while(wd > avail && wd > 0 && pass++ < 3){
    size = size * (avail / wd);

    wd = elWordI.offsetWidth;
  }
}
function txt(el, v, cache){ if(cache !== v) el.textContent = v; return v; }

function render(now){
  var st = S.steps[S.idx];
  if(!st) return;
  var rem = Math.max(0, S.stepStart + st.dur - now);
  var frac = st.dur > 0 ? Math.max(0, Math.min(1, (now - S.stepStart) / st.dur)) : 0;

  paint(st.k);

  /* the circle: fills on IN, stays full on HOLD, unfills on OUT */
  if(st.k === "in") setRing(frac);
  else if(st.k === "hold") setRing(1);
  else if(st.k === "out") setRing(1 - frac);
  else if(st.k === "empty") setRing(0);
  else if(st.k === "getset") setRing(1 - frac);   /* drains down as the countdown runs */
  else setRing(1);

  if(st.k === "done"){
    if(lastWord !== "DONE") fitWord("DONE");
    lastWord = txt(elWordI, "DONE", lastWord);
    lastNum = txt(elNum, "", lastNum);
    elClock.classList.add("hid"); elBar.classList.add("hid"); elDots.classList.add("hid");
    lastMeta = txt(elMeta, "", lastMeta);
    bSkip.classList.add("hid"); bSave.classList.add("hid"); bBack.classList.remove("hid");
    elEnd.classList.add("hid");
    return;
  }
  elEnd.classList.remove("hid");

  var word = st.k === "in" ? "IN" : st.k === "hold" ? "HOLD" : st.k === "out" ? "OUT" : "";
  if(st.k === "getset") word = "GET SET";
  if(word !== lastWord) fitWord(word);
  lastWord = txt(elWordI, word, lastWord);
  var shown = Math.min(Math.ceil(rem - 0.001), Math.ceil(st.dur));
  lastNum = txt(elNum, st.k === "empty" ? "" : String(shown || 1), lastNum);

  var isRest = st.stage === "rest";
  var isSet  = st.stage === "set";

  if(isRest){
    var left = rem, i;
    for(i = S.idx + 1; i < S.steps.length && S.steps[i].stage === "rest" && S.steps[i].set === st.set; i++) left += S.steps[i].dur;
    elClock.classList.remove("hid");
    lastClock = txt(elClock, fmtClock(left), lastClock);
    elDots.classList.add("hid"); elBar.classList.add("hid");
    lastMeta = txt(elMeta, "REST", lastMeta);
    bSkip.classList.remove("hid"); bSave.classList.add("hid"); bBack.classList.add("hid");
  }else{
    elClock.classList.add("hid");
    bSkip.classList.add("hid");
    bBack.classList.add("hid");
    bSave.classList.toggle("hid", !isSet || S.mode !== "lift");
    if(S.holdMode && isSet){
      elBar.classList.remove("hid"); elDots.classList.add("hid");
      var pr = setProgress();
      elBarIn.style.width = (100 * Math.min(1, pr / S.holdSec)).toFixed(1) + "%";
      lastMeta = txt(elMeta, "SET " + st.set + "/" + S.sets + " · " + Math.ceil(S.holdSec - pr) + "S", lastMeta);
    }else{
      elBar.classList.add("hid"); elDots.classList.remove("hid");
      var rp = isSet ? st.rep : 0;
      if(rp !== lastDots){
        var kids = elDots.children;
        for(var d=0; d<kids.length; d++) kids[d].className = d < rp - 1 ? "on" : (d === rp - 1 ? "cur" : "");
        lastDots = rp;
      }
      if(S.mode === "breathe") lastMeta = txt(elMeta, isSet ? ("CYCLE " + st.rep + "/" + S.reps) : "", lastMeta);
      else lastMeta = txt(elMeta, "SET " + st.set + "/" + S.sets + (isSet ? " · " + st.rep + "/" + S.reps : ""), lastMeta);
    }
  }
}

/* ============================ LOOP ============================ */
var raf = 0;
function tick(){
  raf = requestAnimationFrame(tick);
  var now = nowSec();
  if(S.running){
    var guard = 0;
    while(S.idx < S.steps.length - 1 && now >= S.stepStart + S.steps[S.idx].dur && guard++ < 400){
      var prev = S.steps[S.idx];
      S.stepStart += prev.dur;
      S.idx++;
      var cur = S.steps[S.idx];
      if(prev.stage === "set" && !(cur.stage === "set" && cur.set === prev.set)){
        recordSet(prev.set, S.holdMode ? S.holdSec : S.reps);
      }
    }
    scheduleAhead(now);
    if(S.steps[S.idx] && S.steps[S.idx].k === "done"){ endSession(true); }
  }
  if(elRun.classList.contains("on")) render(now);
}

/* ============================ UI ============================ */
var SOUNDS = [["tone","Tone"],["breath","Breath"]];
function initSoundPickers(){
  var els = document.querySelectorAll(".seg.sound");
  for(var i=0;i<els.length;i++){
    var m = els[i].getAttribute("data-for"), html = "";
    for(var j=0;j<SOUNDS.length;j++) html += '<button data-sound="'+m+':'+SOUNDS[j][0]+'">'+SOUNDS[j][1]+'</button>';
    els[i].innerHTML = html;
  }
}
function fmtN(v){ return (Math.round(v*10)/10).toString(); }
function refresh(){
  var L = DB.cfg.lift, P = DB.cfg.breathe, T = L.tune[L.preset], i;
  var isHold = L.preset === "hold";
  document.getElementById("v-reps").textContent = L.reps;
  document.getElementById("v-sets").textContent = L.sets;
  document.getElementById("v-holdSec").textContent = L.holdSec;
  document.getElementById("v-in").textContent = fmtN(T["in"]);
  document.getElementById("v-hold").textContent = fmtN(T.hold);
  document.getElementById("v-out").textContent = fmtN(T.out);
  document.getElementById("v-rest").textContent = fmtClock(T.rest);
  document.getElementById("v-cycles").textContent = P.cycles;
  document.getElementById("row-reps").classList.toggle("hid", isHold);
  document.getElementById("row-hsec").classList.toggle("hid", !isHold);
  var sub = fmtN(T["in"]) + (T.hold > 0 ? " · " + fmtN(T.hold) : "") + " · " + fmtN(T.out) + "   —   rest " + fmtClock(T.rest);
  document.getElementById("preset-sub").textContent = sub;
  var segP = document.querySelectorAll("#seg-preset button");
  for(i=0;i<segP.length;i++) segP[i].classList.toggle("sel", segP[i].getAttribute("data-preset") === L.preset);
  var segPat = document.querySelectorAll("#seg-pat button");
  for(i=0;i<segPat.length;i++) segPat[i].classList.toggle("sel", segPat[i].getAttribute("data-pat") === P.pat);
  var snd = document.querySelectorAll("[data-sound]");
  for(i=0;i<snd.length;i++){
    var parts = snd[i].getAttribute("data-sound").split(":");
    snd[i].classList.toggle("sel", DB.cfg[parts[0]].sound === parts[1]);
  }
}

var LIM = {reps:[1,60,1], sets:[1,20,1], holdSec:[5,300,5], "in":[0.5,20,0.5], hold:[0,20,0.5],
           out:[0.5,20,0.5], rest:[0,900,15], cycles:[1,40,1]};
function bump(key, delta){
  var target = (key === "cycles") ? DB.cfg.breathe
             : (key === "in" || key === "hold" || key === "out" || key === "rest")
               ? DB.cfg.lift.tune[DB.cfg.lift.preset]
               : DB.cfg.lift;
  var lim = LIM[key];
  var v = (+target[key]) + delta;
  v = Math.round(v*10)/10;
  if(v < lim[0]) v = lim[0];
  if(v > lim[1]) v = lim[1];
  target[key] = v;
  save(); refresh();
}

function show(id){
  var ids = ["mode","lift","breathe","run","stats"];
  for(var i=0;i<ids.length;i++) document.getElementById("s-"+ids[i]).classList.toggle("on", ids[i] === id);
  document.body.classList.toggle("run", id === "run");
  if(id !== "run"){
    elBg.style.backgroundColor = "#0a0918";
    document.body.classList.remove("slow");
    lastBg = "#0a0918";
  }
  if(id === "stats") renderStats();
  if(id === "lift" || id === "breathe") refresh();
}

function renderStats(){
  var s = DB.stats, i;
  var h = '<div class="stat"><span class="lbl">Lifetime</span><span class="n">' + Math.round(s.sec/60) + ' <span style="font-size:16px;letter-spacing:.2em">MIN</span></span></div>';
  var names = {lift:"Lift", breathe:"Breathe"};
  for(var m in names) h += '<div class="stat"><span class="lbl">'+names[m]+'</span><span class="n">'+Math.round((s.modes[m]||0)/60)+'</span></div>';
  h += '<div style="height:22px"></div><div class="lbl" style="padding-bottom:6px">Sets</div>';
  if(!s.log.length) h += '<div class="log"><span>—</span></div>';
  for(i=0; i<Math.min(s.log.length, 120); i++){
    var e = s.log[i], d = new Date(e.t);
    var when = (d.getMonth()+1) + "/" + d.getDate() + " " + d.getHours() + ":" + (d.getMinutes()<10?"0":"") + d.getMinutes();
    var body;
    if(e.m === "breathe" || e.m === "sleep") body = "Breathe · " + e.d + " / " + e.g + " cycles";
    else if(e.h) body = "Set " + e.s + "/" + e.of + " · " + e.d + " / " + e.g + "s hold";
    else body = "Set " + e.s + "/" + e.of + " · " + e.d + " / " + e.g + " reps";
    if(e.d < e.g) body += "  (partial)";
    h += '<div class="log"><span>'+body+'</span><span class="d">'+when+'</span></div>';
  }
  document.getElementById("statbody").innerHTML = h;
}

/* ---- events ---- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-go],[data-s],[data-preset],[data-pat],[data-sound],[data-start]") : null;
  if(!t) return;
  var v;
  if((v = t.getAttribute("data-go"))){ if(S.running) return; show(v); return; }
  if((v = t.getAttribute("data-s"))){ var p = v.split(":"); bump(p[0], parseFloat(p[1])); return; }
  if((v = t.getAttribute("data-preset"))){ DB.cfg.lift.preset = v; save(); refresh(); return; }
  if((v = t.getAttribute("data-pat"))){ DB.cfg.breathe.pat = v; save(); refresh(); return; }
  if((v = t.getAttribute("data-sound"))){ var q = v.split(":"); DB.cfg[q[0]].sound = q[1]; save(); refresh(); return; }
  if((v = t.getAttribute("data-start"))){ startSession(v); return; }
});

bSkip.addEventListener("click", function(e){ e.stopPropagation(); skipRest(); });
bSave.addEventListener("click", function(e){ e.stopPropagation(); saveSet(); });
bBack.addEventListener("click", function(e){ e.stopPropagation(); show("mode"); });
elEnd.addEventListener("click", function(e){ e.stopPropagation(); endSession(false); });
document.getElementById("b-tune").addEventListener("click", function(){
  document.getElementById("tunebox").classList.toggle("hid");
});
document.getElementById("b-reset").addEventListener("click", function(){
  DB.stats = clone(DEF.stats); save(); renderStats();
});

/* sync tap: re-anchor the current phase to this instant */
var elFlash = document.getElementById("flash");
elRun.addEventListener("pointerdown", function(ev){
  if(ev.target.closest && ev.target.closest("button")) return;
  if(!S.running) return;
  if(A && A.ctx.state !== "running"){ try{ A.ctx.resume(); }catch(e){} }
  var st = S.steps[S.idx];
  if(!st || (st.stage !== "set")) return;
  reanchor(false);
  elFlash.classList.remove("go");
  void elFlash.offsetWidth;
  elFlash.classList.add("go");
});

document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
document.addEventListener("dblclick", function(e){ e.preventDefault(); });

/* refit the giant word once the real face has loaded */
try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ lastWord = null; }); }catch(e){}

/* ---- boot ---- */
initSoundPickers();
refresh();
show("mode");
raf = requestAnimationFrame(tick);

})();
</script>
</body>
</html>
