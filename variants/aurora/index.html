<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0918">
<meta name="apple-mobile-web-app-title" content="The Wind">
<title>The Wind</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Fonts ship with the app (SIL OFL, see fonts/), so nothing depends on the network. */
@font-face{font-family:'Unbounded';font-style:normal;font-weight:200 900;font-display:swap;src:url(fonts/unbounded.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope.woff2) format('woff2')}

:root{
  /* THEME START — Aurora: soft luminous. Every colour in the app comes from this block and the PAL table below */
  --bg:#0a0918; --fg:#f3efff; --mute:rgba(243,239,255,.58);
  --line:rgba(255,255,255,.16); --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --glass3:rgba(255,255,255,.18);
  --acc:#7ff0ff; --accA:#7ff0ff66; --acc2:#9f70ff; --warm:#ffb38a; --rose:#ff7fa8;
  --bi:#7ff0ff; --bh:#9f70ff; --bo:#ffb38a; --be:rgba(255,255,255,.55);
  --disp:'Unbounded','Futura','Century Gothic',sans-serif;
  --body:'Manrope','Avenir Next','Helvetica Neue',-apple-system,system-ui,sans-serif;
  /* THEME END */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow-x:hidden}
body{font-family:var(--body);font-weight:500;color:var(--fg);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}

/* the ground: two drifting lights behind everything, dimmed while a session runs */
#bg{position:fixed;inset:0;background:var(--bg);z-index:0;overflow:hidden;transition:background-color .5s cubic-bezier(.42,0,.25,1)}
#bg::before,#bg::after{content:"";position:absolute;border-radius:50%;filter:blur(44px);opacity:.5;transition:opacity .9s ease}
#bg::before{left:-96px;top:9%;width:340px;height:340px;background:radial-gradient(circle,#7ff0ff,rgba(127,240,255,0) 70%);animation:drift 17s ease-in-out infinite}
#bg::after{right:-124px;top:2%;width:380px;height:380px;background:radial-gradient(circle,#9f70ff,rgba(159,112,255,0) 70%);animation:drift 23s ease-in-out infinite reverse}
body.run #bg::before,body.run #bg::after{opacity:.12}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-22px,28px) scale(1.15)}}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.12}100%{opacity:0}}

.screen{position:relative;z-index:1;display:none;flex-direction:column;
  min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 26px) calc(env(safe-area-inset-right) + 24px) calc(env(safe-area-inset-bottom) + 26px) calc(env(safe-area-inset-left) + 24px)}
.screen.on{display:flex;animation:screenin .22s ease-out}
@keyframes screenin{from{opacity:0}}

button{font:inherit;color:inherit;background:transparent;border:0;margin:0;padding:0;cursor:pointer}
.glass,.btn,.card,.mode{background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 var(--glass3)}
.btn{display:block;width:100%;padding:20px 18px;border-radius:26px;color:var(--fg);font-size:15px;font-weight:600;
  text-align:center;text-transform:lowercase;letter-spacing:0}
.btn:active{background:var(--glass2)}
.btn.go{background:linear-gradient(135deg,#7ff0ff,#9f70ff);border:0;color:#0a0918;
  font-family:var(--disp);font-weight:500;font-size:22px;letter-spacing:-.01em;padding:24px 18px;
  box-shadow:0 14px 40px rgba(127,240,255,.3)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute);padding:16px;font-size:14px;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
.btn.ghost.small{padding:12px;font-size:13px;margin:4px 0 10px}

/* ---------- mode ---------- */
.eyebrow{font-size:14px;font-weight:600;color:var(--mute);text-transform:lowercase;letter-spacing:0}
.brand{display:flex;flex-direction:column;gap:12px;padding:4px 4px 0}
.brand .bm{font-family:var(--disp);font-weight:300;font-size:min(12vw,46px);line-height:1.02;letter-spacing:-.02em;color:#fff}
.brand .bm b{font-weight:700}
.brand .bs{font-size:14px;font-weight:500;color:var(--mute)}
.modes{display:flex;flex-direction:column;gap:14px;margin-top:auto;padding-top:24px}
.mode{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;
  min-height:132px;padding:0 26px 0 28px;border-radius:30px;text-align:left}
.mode:active{background:var(--glass2)}
.mode .tx{display:flex;flex-direction:column;gap:8px}
.mode .t{font-family:var(--disp);font-weight:500;font-size:min(8vw,31px);line-height:1.05;letter-spacing:-.01em;color:#fff;text-transform:lowercase}
.mode .s{font-size:13px;color:var(--mute);text-transform:lowercase}
.mode .chev{position:relative;flex:none;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#7ff0ff,#9f70ff);box-shadow:0 10px 30px rgba(127,240,255,.32)}
.mode.breathe .chev{background:linear-gradient(135deg,#ffb38a,#ff7fa8);box-shadow:0 10px 30px rgba(255,150,140,.32)}
.mode .chev::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-6px 0 0 -8px;
  border-right:2.4px solid #0a0918;border-top:2.4px solid #0a0918;transform:rotate(45deg)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}

/* ---------- setup ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.row:last-child{border-bottom:0}
.row.stack{flex-direction:column;align-items:stretch;gap:12px}
.row.head{padding:15px 0 2px;border-bottom:0}
.row.stack .seg{justify-content:stretch}
.row.stack .seg button{flex:1 1 0;min-width:0;padding:14px 6px;font-size:13px}
.lbl{font-size:13px;font-weight:600;color:var(--mute);text-transform:lowercase;letter-spacing:0}
.step{display:flex;align-items:center;gap:4px}
.step button{width:52px;height:52px;border-radius:50%;background:var(--glass2);border:1px solid var(--line);
  font-size:24px;line-height:1;color:var(--fg);display:flex;align-items:center;justify-content:center;touch-action:none}
.step button:active{background:rgba(127,240,255,.22);border-color:var(--acc)}
.step .v{min-width:82px;text-align:center;font-family:var(--disp);font-weight:500;font-size:30px;line-height:1;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:14px 16px;border-radius:20px;background:var(--glass2);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--mute);text-transform:lowercase}
.seg button.sel{background:linear-gradient(135deg,rgba(127,240,255,.92),rgba(159,112,255,.92));border-color:transparent;color:#0a0918;
  box-shadow:0 8px 22px rgba(127,240,255,.28)}
.card{border-radius:26px;padding:6px 22px;margin-bottom:14px}
.row .v.quiet{font-family:var(--disp);font-weight:300;font-size:26px;line-height:1;color:var(--mute);font-variant-numeric:tabular-nums;padding-right:4px}
.adj{display:block;width:100%;text-align:center;padding:12px 0 10px;font-size:13px;font-weight:600;text-transform:lowercase;color:var(--mute);opacity:.6}
.adj.open{opacity:1}
/* a breath drawn to scale: in, hold, out as the phase colours, widths in seconds */
.bbar{display:flex;gap:3px;height:10px;width:100%}
.bbar i{display:block;border-radius:99px;min-width:4px}
.bbar .bi{background:var(--bi)}.bbar .bh{background:var(--bh)}.bbar .bo{background:var(--bo)}
.bbar .be{background:transparent;box-shadow:inset 0 0 0 1.5px var(--be)}
.seg button .bbar{height:6px;margin-top:9px;opacity:.6}
.seg button.sel .bbar{opacity:1}
.seg button.sel .bbar .bi,.seg button.sel .bbar .bh,.seg button.sel .bbar .bo{background:#0a0918;opacity:.75}
.seg button.sel .bbar .be{box-shadow:inset 0 0 0 1.5px #0a0918}
.counts{display:flex;gap:10px;margin:6px 0 12px}
.cnt{flex:1;background:rgba(10,9,24,.45);border:1px solid var(--line);border-radius:22px;padding:14px 6px;text-align:center}
.cnt .cl{font-size:12px;font-weight:600;color:var(--mute);text-transform:lowercase}
.cnt .cv{font-family:var(--disp);font-weight:500;font-size:26px;line-height:1.05;margin:4px 0 8px;letter-spacing:-.02em}
.cnt .cb{display:flex;gap:6px}
.cnt .cb button{flex:1;height:44px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);font-size:18px;touch-action:none}
.cnt .cb button:active{background:rgba(127,240,255,.22)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.foot{display:flex;gap:10px;margin-top:14px}
.foot .btn{flex:1}

/* ---------- run ---------- */
#s-run{padding:calc(env(safe-area-inset-top) + 16px) 0 calc(env(safe-area-inset-bottom) + 20px)}
#endbtn{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 18px);
  z-index:4;padding:13px 18px;font-size:14px;font-weight:600;color:inherit;opacity:.72;text-transform:lowercase;
  border:1px solid transparent;border-radius:22px;transition:opacity .2s}
#endbtn.arm{opacity:1;border-color:currentColor;background:#ffffff14}
#rmeta{text-align:center;font-size:min(3.6vw,14px);font-weight:600;opacity:.75;text-transform:lowercase;
  padding:0 86px;height:40px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;flex:none}
#s-run .mid{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:min(3vh,22px)}
/* the slot under the orb and the footer keep their height in every state, so the orb never moves */
#below{height:min(17vw,12vh);width:100%;display:flex;align-items:center;justify-content:center}

#ringwrap{position:relative;width:min(88vw,47vh);height:min(88vw,47vh);display:flex;align-items:center;justify-content:center}
#halo{position:absolute;inset:-12%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 50%, var(--acc) 0%, transparent 62%);
  background:radial-gradient(circle at 50% 50%, var(--acc) 0%, color-mix(in srgb, var(--acc) 45%, transparent) 26%, transparent 64%);
  opacity:.1;transform:scale(.6);will-change:transform,opacity;filter:blur(10px)}
/* the orb is the breath: it swells on the inhale, holds full, and settles on the exhale */
#orb{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.42),rgba(255,255,255,0) 58%),linear-gradient(160deg,var(--acc),var(--acc2));
  box-shadow:0 30px 80px var(--accA),inset 0 -22px 60px rgba(10,9,24,.5);transform:scale(.42);will-change:transform;
  transition:background .5s ease}
#ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);display:block}
#ring .track{fill:none;stroke:currentColor;stroke-opacity:.14;stroke-width:1.2}
#ring .glow,#ring .glow2,#ring .glow3,#ring .fill{display:none}
#ringin{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#word span{display:inline-block}
#word{overflow:visible;font-family:var(--disp);font-weight:600;line-height:1.12;text-align:center;white-space:nowrap;
  letter-spacing:.02em;width:100%;text-transform:uppercase;text-shadow:0 6px 30px rgba(10,9,24,.45)}
#num{font-family:var(--disp);font-weight:300;font-size:min(9vw,6.5vh);line-height:1.1;text-align:center;opacity:.9;min-height:1em}
#dots{display:flex;flex-wrap:wrap;gap:min(2.6vw,12px);justify-content:center;padding:0 26px;min-height:min(4vw,22px)}
#dots i{width:min(3vw,11px);height:min(3vw,11px);border-radius:50%;background:currentColor;opacity:.22;border:0}
#dots i.on{opacity:1;background:#fff}
#dots i.cur{opacity:.85;background:#fff;box-shadow:0 0 10px var(--accA)}
#bar{height:min(2.4vw,12px);border-radius:99px;margin:0 30px;width:calc(100% - 60px);position:relative;overflow:hidden;
  background:rgba(255,255,255,.14);border:0}
#bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 16px var(--acc)}
#clock{font-family:var(--disp);font-weight:300;font-size:min(15vw,10vh);line-height:1;text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 104px);text-align:center;font-size:13px;font-weight:600;
  text-transform:lowercase;opacity:.55;padding:0 20px}
#runfoot{padding:0 24px;display:flex;align-items:center;width:100%;height:84px;flex:none}
#runfoot .btn{flex:1;height:60px;display:flex;align-items:center;justify-content:center;padding:0 16px;position:relative;
  border-color:rgba(255,255,255,.22);color:inherit;background:rgba(255,255,255,.08);opacity:.95}
#runfoot .btn.wide{font-family:var(--disp);font-weight:500;font-size:20px;letter-spacing:-.01em;line-height:1}
#runfoot .btn:active{background:rgba(255,255,255,.16)}
#runfoot .btn.ready{border-color:var(--acc);color:#0a0918;opacity:1;background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 12px 34px var(--accA)}
#runfoot .btn.ready::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 40px var(--accA);opacity:0;animation:readyp 2.4s ease-in-out infinite}
@keyframes readyp{50%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .screen.on{animation:none}
  #runfoot .btn.ready::after{animation:none;opacity:.5}
  #bg{transition-duration:.15s}
  #bg::before,#bg::after{animation:none}
  #flash.go{animation:none}
}
.hid{display:none !important}
</style>
</head>
<body>
<div id="bg"></div>
<div id="flash"></div>
<audio id="aout" playsinline style="display:none"></audio>

<!-- MODE PICK -->
<section id="s-mode" class="screen">
  <div class="brand"><div class="bm">the<br><b>wind</b></div><div class="bs">breathe with the bar. breathe to sleep.</div></div>
  <div class="modes">
    <button class="mode lift" data-mode="lift"><span class="tx"><span class="t">Lift</span><span class="s">sets · reps · rest</span></span><i class="chev"></i></button>
    <button class="mode breathe" data-mode="breathe"><span class="tx"><span class="t">Breathe</span><span class="s">cycles</span></span><i class="chev"></i></button>
  </div>
</section>

<!-- SETUP -->
<section id="s-setup" class="screen">
  <div class="top"><button class="btn ghost" style="width:auto;padding:10px 16px" data-go="mode">Back</button><span class="eyebrow" id="setup-name">Lift</span></div>
  <div class="scroll">

    <div id="p-lift">
      <div class="card">
        <div class="row stack"><span class="lbl">Cadence</span>
          <div class="seg" id="seg-preset" role="group" aria-label="Cadence">
            <button data-preset="compound"><span>Compound</span><span class="bbar"></span></button>
            <button data-preset="isolation"><span>Isolation</span><span class="bbar"></span></button>
            <button data-preset="hold"><span>Isometric</span><span class="bbar"></span></button>
          </div>
          <div id="tunebox" class="hid">
            <div class="counts">
              <div class="cnt"><div class="cl">In</div><div class="cv" id="v-in">4</div>
                <div class="cb"><button data-s="in:-0.5" aria-label="Less in">−</button><button data-s="in:0.5" aria-label="More in">+</button></div></div>
              <div class="cnt"><div class="cl">Hold</div><div class="cv" id="v-hold">2</div>
                <div class="cb"><button data-s="hold:-0.5" aria-label="Less hold">−</button><button data-s="hold:0.5" aria-label="More hold">+</button></div></div>
              <div class="cnt"><div class="cl">Out</div><div class="cv" id="v-out">6</div>
                <div class="cb"><button data-s="out:-0.5" aria-label="Less out">−</button><button data-s="out:0.5" aria-label="More out">+</button></div></div>
            </div>
            <button class="btn ghost small hid" id="b-tunereset">Reset preset</button>
          </div>
        </div>
        <button class="adj" id="b-tune" aria-expanded="false">Adjust</button>
      </div>
      <div class="card">
        <div class="row head"><span class="lbl">Session</span></div>
        <div class="row" id="row-reps"><span class="lbl">Reps</span>
          <div class="step"><button data-s="reps:-1" aria-label="Fewer reps">−</button><span class="v" id="v-reps">10</span><button data-s="reps:1" aria-label="More reps">+</button></div></div>
        <div class="row hid" id="row-hsec"><span class="lbl">Seconds</span>
          <div class="step"><button data-s="holdSec:-5" aria-label="Fewer seconds">−</button><span class="v" id="v-holdSec">45</span><button data-s="holdSec:5" aria-label="More seconds">+</button></div></div>
        <div class="row"><span class="lbl">Sets</span>
          <div class="step"><button data-s="sets:-1" aria-label="Fewer sets">−</button><span class="v" id="v-sets">4</span><button data-s="sets:1" aria-label="More sets">+</button></div></div>
        <div class="row"><span class="lbl">Rest</span>
          <div class="step"><button data-s="rest:-15" aria-label="Less rest">−</button><span class="v" id="v-rest">3:00</span><button data-s="rest:15" aria-label="More rest">+</button></div></div>
        <div class="row"><span class="lbl">Length</span><span class="v quiet" id="lift-sub"></span></div>
      </div>
      <div class="card">
        <div class="row stack"><span class="lbl">Sound</span>
          <div class="seg sound" data-for="lift" role="group" aria-label="Sound"></div></div>
      </div>
    </div>

    <div id="p-breathe">
      <div class="card">
        <div class="row stack"><span class="lbl">Cadence</span>
          <div class="seg" id="seg-pat" role="group" aria-label="Cadence">
            <button data-pat="478"><span>4 · 7 · 8</span><span class="bbar"></span></button>
            <button data-pat="coh"><span>5.5 · 5.5</span><span class="bbar"></span></button>
            <button data-pat="box"><span>4 · 4 · 4 · 4</span><span class="bbar"></span></button>
          </div></div>
      </div>
      <div class="card">
        <div class="row head"><span class="lbl">Session</span></div>
        <div class="row"><span class="lbl">Cycles</span>
          <div class="step"><button data-s="cycles:-1" aria-label="Fewer cycles">−</button><span class="v" id="v-cycles">8</span><button data-s="cycles:1" aria-label="More cycles">+</button></div></div>
        <div class="row"><span class="lbl">Length</span><span class="v quiet" id="breathe-sub"></span></div>
      </div>
      <div class="card">
        <div class="row stack"><span class="lbl">Sound</span>
          <div class="seg sound" data-for="breathe" role="group" aria-label="Sound"></div></div>
      </div>
    </div>

  </div>
  <div class="foot"><button class="btn go" data-start="1">Start</button></div>
</section>

<!-- RUN -->
<section id="s-run" class="screen">
  <button id="endbtn">End</button>
  <div id="rmeta"></div>
  <div class="mid">
    <div id="ringwrap">
      <div id="halo"></div>
      <div id="orb"></div>
      <svg id="ring" viewBox="-9 -9 118 118" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="46"/>
        <circle class="glow3" cx="50" cy="50" r="46"/>
        <circle class="glow2" cx="50" cy="50" r="46"/>
        <circle class="glow" cx="50" cy="50" r="46"/>
        <circle class="fill" cx="50" cy="50" r="46"/>
      </svg>
      <div id="ringin">
        <div id="word"><span></span></div>
        <div id="num"></div>
      </div>
    </div>
    <div id="below">
      <div id="clock" class="hid"></div>
      <div id="dots"></div>
      <div id="bar" class="hid"><span></span></div>
    </div>
  </div>
  <div id="hint" class="hid">Tap for sound</div>
  <div id="runfoot">
    <button class="btn wide hid" id="b-next">Start set</button>
    <button class="btn hid" id="b-rest">Rest</button>
    <button class="btn hid" id="b-back">Back</button>
  </div>
</section>

<script>
(function(){
"use strict";

/* ============================ STORAGE ============================ */
var KEY = "bp.v3", LIVE = "bp.live";
var DEF = {
  cfg: {
    last: "lift",
    lift: {preset:"compound", reps:10, sets:4, holdSec:45, sound:"tone",
      tune:{compound:{"in":4, hold:2, out:6, rest:180},
            isolation:{"in":2, hold:0, out:3, rest:90},
            hold:{"in":4, hold:0, out:8, rest:90}}},
    breathe: {cycles:8, pat:"478", sound:"tone"}
  }
};
var PATS = {"478":{"in":4, hold:7, out:8, empty:0},
            coh:{"in":5.5, hold:0, out:5.5, empty:0},

/* ============================ SESSION ============================ */
var LOOK = 5.0;        /* seconds of audio queued ahead of the clock: more than any timer throttle */
var INF = 1e9;         /* an open-ended step: READY waits for a tap, DONE waits for nothing */
var S = {running:false, mode:"lift", sound:"tone", steps:[], idx:0, stepStart:0, schedIdx:-1,
         reps:10, sets:4, restDur:180, holdMode:0, holdSec:45};
var ivl = 0, resumeTries = 0;

function ph(kind, dur, stage, setNo, rep){
  return {k:kind, dur:dur, stage:stage, set:setNo, rep:rep};
}
function pushCycle(arr, c, stage, setNo, rep){
  var order = ["in","hold","out","empty"], i, k;
  for(i=0;i<order.length;i++){ k = order[i]; if(c[k] > 0) arr.push(ph(k, c[k], stage, setNo, rep)); }
}
function trimTo(arr, from, total){
  var acc = 0, i;
  for(i=from; i<arr.length; i++){
    if(acc + arr[i].dur >= total - 0.001){
      arr[i].dur = Math.max(total - acc, 0);
      arr.length = i + 1;
      if(arr[arr.length-1].dur < 0.4 && arr.length > from + 1) arr.length = arr.length - 1;
      return;
    }
    acc += arr[i].dur;
  }
}
/* Recovery breathing. The lifter is still panting when the set ends, so the
   first breaths are short and each is a little longer than the last, settling
   at coherent 5.5 / 5.5 by the fifth breath. Whole breaths only, fitted to the
   rest exactly, so the rest always ends on a finished exhale. */
function restSteps(seconds, stage, setNo){
  var out = [], ph_ = [], n = Math.min(5, Math.floor(seconds / 11)), i, sum = 0;
  for(i=0;i<n;i++){ var d = n === 1 ? 4 : 3 + 2*i/(n-1); ph_.push(d); sum += 2*d; }
  var rem = seconds - sum;
  if(rem >= 11){ var m = Math.max(1, Math.round(rem / 11)), each = rem / (2*m); for(i=0;i<m;i++) ph_.push(each); }
  else if(ph_.length){ var f = seconds / sum; for(i=0;i<ph_.length;i++) ph_[i] *= f; }
  else ph_.push(seconds / 2);
  for(i=0;i<ph_.length;i++){ out.push(ph("in", ph_[i], stage, setNo, 0)); out.push(ph("out", ph_[i], stage, setNo, 0)); }
  return out;
}

function buildSteps(){
  var st = [], c = DB.cfg, i, s, r;
  if(S.mode === "lift"){
    var T = c.lift.tune[c.lift.preset];
    var counts = {"in":+T["in"], hold:+T.hold, out:+T.out, empty:0};
    for(s=1; s<=S.sets; s++){
      st.push(ph("getset", 3, "getset", s, 0));
      var mark = st.length;
      if(S.holdMode){
        var cyc = counts["in"] + counts.hold + counts.out;
        var reps = Math.ceil(S.holdSec / cyc) + 1;
        for(r=1; r<=reps; r++) pushCycle(st, counts, "set", s, r);
        trimTo(st, mark, S.holdSec);
      }else{
        for(r=1; r<=S.reps; r++) pushCycle(st, counts, "set", s, r);
      }
      if(s < S.sets){
        st.push(ph("pause", 2, "rest", s, 0));                    /* a breath of silence: the set is over */
        if(S.restDur > 2){
          var rest = restSteps(S.restDur - 2, "rest", s);
          for(i=0;i<rest.length;i++) st.push(rest[i]);
        }
        st.push(ph("ready", INF, "rest", s, 0));                  /* rest is up; the next set waits for a tap */
      }
    }
  }else{
    var cc = PATS[c.breathe.pat] || PATS["478"];
    st.push(ph("pause", 1.5, "lead", 0, 0));                       /* a still beat for the hand to settle; no countdown */
    for(r=1; r<=S.reps; r++) pushCycle(st, cc, "set", 1, r);     /* then it begins on the first inhale */

  st.push(ph("done", INF, "done", 0, 0));

}

function startSession(mode){
  if(S.running) return;
  var c = DB.cfg;
  S.mode = mode;
  S.sound = c[mode].sound;
  if(mode === "lift"){
    S.reps = c.lift.reps; S.sets = c.lift.sets;
    S.restDur = c.lift.tune[c.lift.preset].rest;
    S.holdMode = c.lift.preset === "hold" ? 1 : 0; S.holdSec = c.lift.holdSec;
  }else{
    S.reps = c.breathe.cycles; S.sets = 1; S.holdMode = 0; S.restDur = 0;
  }
  S.steps = buildSteps();
  S.idx = 0; S.schedIdx = -1;
  S.stepStart = nowSec() + 0.15;

}
function beginRun(){
  lastWord = lastNum = lastClock = lastMeta = lastBg = null; lastDots = -1;
  buildDots();

  disarmEnd();
  show("run");
  wake(true);
  if(!ivl) ivl = setInterval(pump, 200);
  pump();
}

/* advances the session clock; runs from the frame loop and from the interval,
   so the session keeps time even when frames stop */
function advance(now){
  if(!S.running) return;
  var guard = 0, moved = false;
  while(S.idx < S.steps.length - 1 && now >= S.stepStart + S.steps[S.idx].dur && guard++ < 20000){
    S.stepStart += S.steps[S.idx].dur;
    S.idx++;
    moved = true;
  }
  if(moved) persist();
  if(S.steps[S.idx] && S.steps[S.idx].k === "done") endSession(true);
}
function pump(){
  var now = nowSec();
  advance(now);
  if(!S.running || !A || !scheme) return;
  if(A.ctx.state !== "running"){
    if(++resumeTries % 5 === 1){ try{ A.ctx.resume(); }catch(e){} }
    return;
  }
  scheduleAhead(now);
}

function endSession(natural){
  if(!S.running) return;
  S.running = false;
  if(ivl){ clearInterval(ivl); ivl = 0; }
  persist();
  audioStop(natural && S.mode === "breathe" ? 3.5 : 1.2);
  wake(false);
  disarmEnd();
  if(!natural){ show("setup"); }
  else{ paint("done"); }
}

function startTimeOf(j){

  return t;
}

    var j = S.schedIdx + 1, t = startTimeOf(j), stp = S.steps[j];
    if(t > now + LOOK) break;
    var at = t, dur = stp.dur;
    if(at + dur <= now && stp.k !== "done"){ S.schedIdx = j; continue; }   /* already over: nothing to play */
    if(at < now){ dur = dur - (now - at); at = now; }                      /* under way: play the remainder */
    if(stp.k === "done") env(A.master.gain, A.lvl, 0.0001, toCtx(at + 0.005), S.mode === "breathe" ? 3.5 : 1.5, easeIn);
    else schemePhase(stp.k, toCtx(at + 0.005), dur);

  }
}
function rescheduleFrom(now){

/* re-anchor the current step to this instant and re-queue its sound */
function reanchor(){

}
/* drop the steps before j and begin j now */
function skipTo(j){

  reanchor();
}
function endSet(){                                    /* REST / FINISH: the set is over now */
  var st = S.steps[S.idx];
  if(!S.running || !st || st.stage !== "set") return;
  var j = S.idx;
  while(j < S.steps.length && S.steps[j].stage === "set" && S.steps[j].set === st.set) j++;
  skipTo(j);
}
function startSet(){                                  /* START SET: done resting */
  var st = S.steps[S.idx];
  if(!S.running || !st || st.stage !== "rest") return;
  var j = S.idx;
  while(j < S.steps.length && S.steps[j].stage === "rest" && S.steps[j].set === st.set) j++;
  skipTo(j);
}
/* a tap on the pacer means one thing: "I am breathing in now" */
function syncTap(){

  if(st.k === "in"){ reanchor(); return true; }
  for(var j = S.idx + 1; j < S.steps.length; j++){
    var q = S.steps[j];

function packSteps(){

}
function persist(){

    localStorage.setItem(LIVE, JSON.stringify({
      mode:S.mode, sound:S.sound, reps:S.reps, sets:S.sets, restDur:S.restDur, holdMode:S.holdMode, holdSec:S.holdSec,

function restore(){
  var r = null;

  var ok = true, i, steps = [];

    if(!q || typeof q[0] !== "string" || typeof q[1] !== "number" || !(q[1] >= 0)){ ok = false; break; }

  S.holdMode = r.holdMode ? 1 : 0; S.holdSec = +r.holdSec || 45;

  beginRun();
  persist();
  return true;
}
/* sound needs a touch after a reload; the first tap anywhere on the pacer provides it */
function ensureAudio(){

  audioStart(S.mode, S.sound);
  if(scheme) rescheduleFrom(nowSec());
}

/* ============================ RENDER ============================ */
/* [bg, text, accent] per phase. One palette for both modes: deep blue filling,

var PAL = {"in":["#0d1130", "#ffffff", "#7ff0ff"], hold:["#171043", "#ffffff", "#9f70ff"],

           getset:["#0a0918", "#f3efff", "#7ff0ff"], ready:["#0a0918", "#f3efff", "#7ff0ff"],
           pause:["#07060f", "#8d86a8", "#3a3352"], done:["#0a0918", "#f3efff", "#7ff0ff"]};

var elBg = document.getElementById("bg"), elWord = document.getElementById("word"),

    elNum = document.getElementById("num"), elDots = document.getElementById("dots"),
    elBar = document.getElementById("bar"), elBarIn = elBar.firstElementChild,
    elClock = document.getElementById("clock"), elMeta = document.getElementById("rmeta"),
    elHint = document.getElementById("hint"),
    bNext = document.getElementById("b-next"), bRest = document.getElementById("b-rest"),
    bBack = document.getElementById("b-back"), elRun = document.getElementById("s-run"),
    elEnd = document.getElementById("endbtn"),
    elRingWrap = document.getElementById("ringwrap"),
    elRingFill = document.querySelector("#ring .fill"), elRingGlow = document.querySelector("#ring .glow"),
    elRingGlow2 = document.querySelector("#ring .glow2"), elRingGlow3 = document.querySelector("#ring .glow3"), elHalo = document.getElementById("halo"),
    elOrb = document.getElementById("orb"), elWbar = document.querySelector("#wbar span");
var CIRC = 2 * Math.PI * 46;
elRingFill.style.strokeDasharray = elRingGlow.style.strokeDasharray = elRingGlow2.style.strokeDasharray = elRingGlow3.style.strokeDasharray = CIRC;
elRingFill.style.strokeDashoffset = elRingGlow.style.strokeDashoffset = elRingGlow2.style.strokeDashoffset = elRingGlow3.style.strokeDashoffset = CIRC;
var lastWord = null, lastNum = null, lastClock = null, lastMeta = null, lastBg = null, lastDots = -1,
    lastRestLbl = null, lastHint = null, lastReady = null;

var lastHalo = -1;
function setRing(p){                       /* p: 0 empty .. 1 full */
  p = Math.max(0, Math.min(1, p));
  elRingFill.style.strokeDashoffset = elRingGlow.style.strokeDashoffset = elRingGlow2.style.strokeDashoffset = elRingGlow3.style.strokeDashoffset = CIRC * (1 - p);
  if(elOrb) elOrb.style.transform = "scale(" + (0.42 + 0.36*p).toFixed(4) + ")";

  var h = Math.round(p * 200) / 200;
  if(h !== lastHalo){
    elHalo.style.transform = "scale(" + (0.6 + 0.55*h).toFixed(3) + ")";
    elHalo.style.opacity = (0.44*h).toFixed(3);

}
function buildDots(){
  elDots.innerHTML = "";
  if(S.holdMode) return;
  var n = S.reps;
  if(n > 30) return;
  for(var i=0;i<n;i++) elDots.appendChild(document.createElement("i"));
  lastDots = -1;
}
function fmtClock(s){
  s = Math.max(0, Math.ceil(s));
  var m = Math.floor(s/60), r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function fmtUp(s){
  s = Math.max(0, Math.floor(s));
  var m = Math.floor(s/60), r = s % 60;
  return "+" + m + ":" + (r < 10 ? "0" : "") + r;
}
function paint(kind){
  var p = PAL[kind] || PAL.done;
  if(lastBg !== p[0]){
    elBg.style.backgroundColor = p[0];
    elRun.style.color = p[1];
    elRun.style.setProperty("--acc", p[2]);
    elRun.style.setProperty("--accA", p[2] + "66");

}
var WORDFIT = {avail:0.62, w:0.20, h:0.14};
function fitWord(w){
  var avail = elRingWrap.clientWidth * WORDFIT.avail;
  if(!w || avail < 60) return;
  var size = Math.min(window.innerWidth*WORDFIT.w, window.innerHeight*WORDFIT.h);
  elWordI.textContent = w;
  elWord.style.fontSize = size + "px";
  var wd = elWordI.offsetWidth, pass = 0;
  while(wd > avail && wd > 0 && pass++ < 3){

function txt(el, v, cache){ if(cache !== v) el.textContent = v; return v; }

var WORDS = {"in":"IN", hold:"HOLD", out:"OUT", empty:"HOLD", getset:"GET SET", ready:"READY", pause:"", done:"DONE"};

function render(now){
  var st = S.steps[S.idx];
  if(!st) return;
  var open = st.dur >= INF;
  var rem = open ? 0 : Math.max(0, S.stepStart + st.dur - now);
  var frac = (!open && st.dur > 0) ? Math.max(0, Math.min(1, (now - S.stepStart) / st.dur)) : 0;

  paint(st.k);

  /* the circle: fills on IN, stays full on HOLD, unfills on OUT, empty on the empty hold */
  if(st.k === "in") setRing(frac);
  else if(st.k === "hold") setRing(1);
  else if(st.k === "out") setRing(1 - frac);
  else if(st.k === "empty" || st.k === "pause") setRing(0);
  else if(st.k === "getset") setRing(0);          /* empty: the first inhale fills it */
  else setRing(1);

  var word = WORDS[st.k] || "";
  if(word !== lastWord) fitWord(word);
  lastWord = txt(elWordI, word, lastWord);

  if(st.k === "done"){
    lastNum = txt(elNum, "", lastNum);
    vis(elClock, false); vis(elBar, false); vis(elDots, false); vis(elHint, false);
    lastMeta = txt(elMeta, "", lastMeta);
    vis(bNext, false); vis(bRest, false); vis(bBack, true); vis(elEnd, false);
    return;
  }
  vis(elEnd, true);

  var counted = st.k === "in" || st.k === "hold" || st.k === "out" || st.k === "empty" || st.k === "getset";
  var shown = Math.min(Math.ceil(rem - 0.001), Math.ceil(st.dur));
  lastNum = txt(elNum, counted ? String(shown || 1) : "", lastNum);

  var wantHint = S.sound !== "off" && !scheme && !audioDead && S.running;

  var isRest = st.stage === "rest";

    lastMeta = txt(elMeta, "REST · SET " + (st.set + 1) + "/" + S.sets + " NEXT", lastMeta);
    vis(bNext, true); vis(bRest, false); vis(bBack, false);

    vis(elClock, false);
    vis(bNext, false); vis(bBack, false);
    if(lastReady !== null){ bNext.classList.remove("ready"); lastReady = null; }
    var showRest = isSet && S.mode === "lift";
    vis(bRest, showRest);
    if(showRest){
      var lbl = st.set === S.sets ? "Finish" : "Rest";

    }
    if(S.holdMode && isSet){
      vis(elBar, true); vis(elDots, false);
      var pr = holdProgress(now, st);
      elBarIn.style.width = (100 * Math.min(1, pr / S.holdSec)).toFixed(1) + "%";
      lastMeta = txt(elMeta, "SET " + st.set + "/" + S.sets + " · " + Math.ceil(S.holdSec - pr) + "S", lastMeta);
    }else{
      vis(elBar, false); vis(elDots, true);
      var rp = isSet ? st.rep : 0;
      if(rp !== lastDots){
        var kids = elDots.children;
        for(var d=0; d<kids.length; d++) kids[d].className = d < rp - 1 ? "on" : (d === rp - 1 ? "cur" : "");
        lastDots = rp;
      }
      if(S.mode === "breathe") lastMeta = txt(elMeta, isSet ? ("CYCLE " + st.rep + "/" + S.reps) : "", lastMeta);
      else lastMeta = txt(elMeta, "SET " + st.set + "/" + S.sets + (isSet ? " · " + st.rep + "/" + S.reps : ""), lastMeta);
    }
  }
}

function tuneIsDefault(){
  var T = DB.cfg.lift.tune[DB.cfg.lift.preset], D = DEF.cfg.lift.tune[DB.cfg.lift.preset];
  for(var k in D) if(+T[k] !== D[k]) return false;
  return true;
}
function refresh(){
  var L = DB.cfg.lift, P = DB.cfg.breathe, T = L.tune[L.preset], i;
  var mode = DB.cfg.last, isHold = L.preset === "hold";
  document.getElementById("setup-name").textContent = mode === "lift" ? "Lift" : "Breathe";
  vis(document.getElementById("p-lift"), mode === "lift");
  vis(document.getElementById("p-breathe"), mode === "breathe");

  document.getElementById("v-reps").textContent = L.reps;
  document.getElementById("v-sets").textContent = L.sets;
  document.getElementById("v-holdSec").textContent = L.holdSec;
  document.getElementById("v-in").textContent = fmtN(T["in"]);
  document.getElementById("v-hold").textContent = fmtN(T.hold);
  document.getElementById("v-out").textContent = fmtN(T.out);
  document.getElementById("v-rest").textContent = fmtClock(T.rest);
  vis(document.getElementById("row-reps"), !isHold);
  vis(document.getElementById("row-hsec"), isHold);
  var cyc = +T["in"] + +T.hold + +T.out, work = isHold ? L.holdSec : L.reps * cyc;
  document.getElementById("lift-sub").textContent = fmtClock(L.sets * (3 + work) + (L.sets - 1) * (+T.rest));
  vis(document.getElementById("b-tunereset"), !tuneIsDefault());
  var pres = document.querySelectorAll("#seg-preset button");
  for(i=0;i<pres.length;i++){ var tp = L.tune[pres[i].getAttribute("data-preset")]; pres[i].querySelector(".bbar").innerHTML = bbar({"in":tp["in"], hold:tp.hold, out:tp.out, empty:0}); }
  sel(pres, "data-preset", L.preset);

  document.getElementById("v-cycles").textContent = P.cycles;
  var pats = document.querySelectorAll("#seg-pat button");
  for(i=0;i<pats.length;i++){ var pb = pats[i].querySelector(".bbar"); if(pb && !pb.firstChild) pb.innerHTML = bbar(PATS[pats[i].getAttribute("data-pat")]); }
  sel(pats, "data-pat", P.pat);
  var cc = PATS[P.pat], total = P.cycles * (cc["in"] + cc.hold + cc.out + cc.empty);
  document.getElementById("breathe-sub").textContent = fmtClock(total);

  var snd = document.querySelectorAll("[data-sound]");
  for(i=0;i<snd.length;i++){
    var parts = snd[i].getAttribute("data-sound").split(":"), on = DB.cfg[parts[0]].sound === parts[1];
    snd[i].classList.toggle("sel", on);
    snd[i].setAttribute("aria-pressed", on ? "true" : "false");
  }
}

var LIM = {reps:[1,60,1], sets:[1,20,1], holdSec:[5,300,5], "in":[0.5,20,0.5], hold:[0,20,0.5],
           out:[0.5,20,0.5], rest:[0,900,15], cycles:[1,40,1]};
function bump(key, delta){
  var target = (key === "cycles") ? DB.cfg.breathe
             : (key === "in" || key === "hold" || key === "out" || key === "rest")
               ? DB.cfg.lift.tune[DB.cfg.lift.preset]
               : DB.cfg.lift;
  var lim = LIM[key];
  if(!lim) return;
  var v = (+target[key]) + delta;
  v = Math.round(v*10)/10;
  if(v < lim[0]) v = lim[0];
  if(v > lim[1]) v = lim[1];
  target[key] = v;
  save(); refresh();
}

function show(id){
  var ids = ["mode","setup","run"];
  for(var i=0;i<ids.length;i++) document.getElementById("s-"+ids[i]).classList.toggle("on", ids[i] === id);
  document.body.classList.toggle("run", id === "run");
  if(id !== "run"){
    elBg.style.backgroundColor = BG0;
    lastBg = BG0;
    if(id === "setup") refresh();
  }else if(!raf){ raf = requestAnimationFrame(tick); }
}

/* ---- END asks once: a mis-tap in set three must not cost the session ---- */
var endArm = 0;
function disarmEnd(){
  if(endArm){ clearTimeout(endArm); endArm = 0; }
  elEnd.classList.remove("arm");
  elEnd.textContent = "End";
}
elEnd.addEventListener("click", function(e){
  e.stopPropagation();
  if(!S.running) return;
  if(endArm){ endSession(false); return; }
  elEnd.classList.add("arm");
  elEnd.textContent = "End?";
  endArm = setTimeout(disarmEnd, 2600);
});

/* ---- events ---- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-go],[data-mode],[data-s],[data-preset],[data-pat],[data-sound],[data-start]") : null;
  if(!t) return;
  var v;
  if((v = t.getAttribute("data-go"))){ if(S.running) return; show(v); return; }
  if((v = t.getAttribute("data-mode"))){ if(S.running) return; DB.cfg.last = v; save(); show("setup"); return; }
  if((v = t.getAttribute("data-s"))){
    if(held){ held = false; return; }               /* the press-and-hold already stepped */
    var p = v.split(":"); bump(p[0], parseFloat(p[1])); return;
  }
  if((v = t.getAttribute("data-preset"))){ DB.cfg.lift.preset = v; save(); refresh(); return; }
  if((v = t.getAttribute("data-pat"))){ DB.cfg.breathe.pat = v; save(); refresh(); return; }
  if((v = t.getAttribute("data-sound"))){ var q = v.split(":"); DB.cfg[q[0]].sound = q[1]; save(); refresh(); return; }
  if(t.hasAttribute("data-start")){ startSession(DB.cfg.last); return; }
});

/* steppers repeat while held: ten reps to twenty is one press, not ten taps */
var held = false, repT = 0, repI = 0;
function stopRepeat(){ if(repT){ clearTimeout(repT); repT = 0; } if(repI){ clearInterval(repI); repI = 0; } }
document.addEventListener("pointerdown", function(ev){
  var b = ev.target.closest && ev.target.closest("[data-s]");
  if(!b) return;
  var p = b.getAttribute("data-s").split(":"), key = p[0], d = parseFloat(p[1]);
  stopRepeat(); held = false;
  try{ b.setPointerCapture(ev.pointerId); }catch(e){}
  repT = setTimeout(function(){
    held = true; bump(key, d);
    repI = setInterval(function(){ bump(key, d); }, 110);
  }, 420);
});
document.addEventListener("pointerup", stopRepeat);
document.addEventListener("pointercancel", stopRepeat);
document.addEventListener("contextmenu", function(e){ if(e.target.closest && e.target.closest("[data-s]")) e.preventDefault(); });

bNext.addEventListener("click", function(e){ e.stopPropagation(); startSet(); });
bRest.addEventListener("click", function(e){ e.stopPropagation(); endSet(); });
bBack.addEventListener("click", function(e){ e.stopPropagation(); show("mode"); });

var tuneBtn = document.getElementById("b-tune"), tuneBox = document.getElementById("tunebox");
tuneBtn.addEventListener("click", function(){
  var open = tuneBox.classList.toggle("hid") === false;
  tuneBtn.classList.toggle("open", open);
  tuneBtn.setAttribute("aria-expanded", open ? "true" : "false");
});
document.getElementById("b-tunereset").addEventListener("click", function(){
  DB.cfg.lift.tune[DB.cfg.lift.preset] = clone(DEF.cfg.lift.tune[DB.cfg.lift.preset]);
  save(); refresh();
});

/* sync tap: the inhale starts now */
var elFlash = document.getElementById("flash");
elRun.addEventListener("pointerdown", function(ev){
  if(!S.running) return;
  ensureAudio();
  if(muted) setMuted(false);
  if(A && A.ctx.state !== "running"){ try{ A.ctx.resume(); }catch(e){} }
  if(ev.target.closest && ev.target.closest("button")) return;
  if(syncTap()){
    elFlash.classList.remove("go");
    void elFlash.offsetWidth;
    elFlash.classList.add("go");
  }
});

document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
document.addEventListener("dblclick", function(e){ e.preventDefault(); });

/* refit the giant word once the real face has loaded */
try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ lastWord = null; }); }catch(e){}

/* ---- boot ---- */
initSoundPickers();
refresh();
if(!restore()) show("mode");
if("serviceWorker" in navigator){
  try{
    navigator.serviceWorker.register("./sw.js").catch(function(){});
    /* when a new version takes over while nothing is happening, pick it up now rather than next launch */
    var hadCtl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(hadCtl && !S.running && document.getElementById("s-mode").classList.contains("on")) location.reload();
      hadCtl = true;
    });
  }catch(e){}
}

window.BP = {S:S, DB:DB, now:nowSec, build:buildSteps, advance:advance, sync:syncTap, audio:function(){ return A; }, scheme:function(){ return scheme; }};

})();
</script>
</body>
</html>
