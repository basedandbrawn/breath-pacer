<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060c">
<title>Breath</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Fonts ship with the app (SIL OFL, see fonts/), so nothing depends on the network. */
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/rajdhani-600.woff2) format('woff2')}
@font-face{font-family:'Rajdhani';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/rajdhani-700.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/space-grotesk.woff2) format('woff2')}

:root{
  --bg:#04060c; --fg:#d7e7f5; --mute:#5f7186;
  --panel:#0a0f1a; --panel2:#101827; --line:#1d2a3d;
  --acc:#4fd9ff; --accA:#4fd9ff66;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{
  font-family:'Space Grotesk',-apple-system,system-ui,sans-serif;
  font-weight:500;
  color:var(--fg);
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  touch-action:manipulation;
}
#bg{position:fixed;inset:0;background:var(--bg);z-index:0;transition:background-color .5s cubic-bezier(.42,0,.25,1)}
body.slow #bg{transition-duration:1.2s}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.12}100%{opacity:0}}

.screen{position:relative;z-index:1;display:none;flex-direction:column;
  min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px);}
.screen.on{display:flex}

button{font:inherit;color:inherit;background:transparent;border:0;margin:0;padding:0;cursor:pointer}
.btn{display:block;width:100%;padding:19px 16px;border-radius:16px;background:var(--panel2);
  border:1px solid var(--line);color:var(--fg);font-size:13px;font-weight:600;
  letter-spacing:.22em;text-transform:uppercase;text-align:center}
.btn:active{background:#182338}
.btn.go{background:linear-gradient(135deg,#0f3a55,#0a2038);border:1px solid #2d7ba6;color:#bfeaff;
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:min(13vw,50px);letter-spacing:.14em;
  padding:16px 16px 12px;line-height:1;box-shadow:0 0 34px #1998d455, inset 0 0 22px #1998d422}
.btn.ghost{background:transparent;border-color:#1d2a3d80;color:var(--mute);padding:14px;font-size:12px;letter-spacing:.26em}
.btn.ghost.small{padding:12px;font-size:11px;margin:4px 0 10px}

/* ---------- mode ---------- */
.eyebrow{font-size:12px;letter-spacing:.38em;color:var(--mute);text-transform:uppercase;font-weight:500}
.spacer{flex:1 1 auto}
.modes{display:flex;flex-direction:column;gap:16px}
.mode{width:100%;text-align:left;padding:30px 26px;border-radius:22px;background:linear-gradient(160deg,#0c1322,#070b14);
  border:1px solid #1d2a3d;overflow:hidden;position:relative}
.mode:active{background:#111a2c}
.mode::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,#4fd9ff22,transparent 70%)}
.mode .t{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:min(15vw,74px);line-height:.95;letter-spacing:.08em}
.mode .s{font-size:11px;letter-spacing:.3em;color:var(--mute);text-transform:uppercase;margin-top:6px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

/* ---------- setup ---------- */

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #16202f80}
.row:last-child{border-bottom:0}
.row.stack{flex-direction:column;align-items:stretch;gap:10px}
.row.stack .seg{justify-content:stretch}
.row.stack .seg button{flex:1 1 0;min-width:0;padding:16px 2px;font-size:11px;letter-spacing:.14em}
.lbl{font-size:11px;letter-spacing:.28em;color:var(--mute);text-transform:uppercase;font-weight:500}
.step{display:flex;align-items:center;gap:2px}
.step button{width:54px;height:54px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);
  font-size:26px;line-height:1;color:var(--fg);display:flex;align-items:center;justify-content:center;touch-action:none}
.step button:active{background:#1c2940;border-color:#2d7ba6}
.step .v{min-width:74px;text-align:center;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:36px;line-height:1}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg button{padding:13px 15px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
  font-size:11px;letter-spacing:.18em;font-weight:600;color:var(--mute);text-transform:uppercase}
.seg button.sel{background:#123047;border-color:#2d7ba6;color:#a8e5ff;box-shadow:0 0 14px #1998d433}
.card{background:#070c1580;border:1px solid #16202f;border-radius:18px;padding:6px 18px;margin-bottom:14px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sub{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:6px 0 10px;
  font-size:12px;letter-spacing:.22em;color:var(--mute);text-align:center}
.sub .chev{display:inline-block;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:translateY(-2px) rotate(45deg);transition:transform .2s;opacity:.8}
.sub.open .chev{transform:translateY(2px) rotate(225deg)}
.counts{display:flex;gap:8px;margin:4px 0 12px}
.cnt{flex:1;background:#070c1580;border:1px solid #16202f;border-radius:16px;padding:12px 6px;text-align:center}
.cnt .cl{font-size:10px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.cnt .cv{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:32px;line-height:1.05;margin:2px 0 6px}
.cnt .cb{display:flex;gap:4px}
.cnt .cb button{flex:1;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:19px;touch-action:none}
.cnt .cb button:active{background:#1c2940}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.foot{display:flex;gap:10px;margin-top:14px}
.foot .btn{flex:1}

/* ---------- run ---------- */
#s-run{padding:calc(env(safe-area-inset-top) + 10px) 0 calc(env(safe-area-inset-bottom) + 12px)}
#endbtn{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 12px);
  z-index:4;padding:15px 16px;font-size:12px;letter-spacing:.24em;color:inherit;opacity:.45;font-weight:600;text-transform:uppercase;
  border:1px solid transparent;border-radius:12px;transition:opacity .2s}
#endbtn.arm{opacity:1;border-color:currentColor;background:#ffffff14}
#rmeta{text-align:center;font-size:min(3.9vw,16px);letter-spacing:.2em;font-weight:600;opacity:.6;
  text-transform:uppercase;padding:8px 78px;min-height:24px;white-space:nowrap;overflow:hidden}
#s-run .mid{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:min(3vh,22px)}

#ringwrap{position:relative;width:min(82vw,44vh);height:min(82vw,44vh)}
#ring{width:100%;height:100%;transform:rotate(-90deg);display:block}
#ring .track{fill:none;stroke:currentColor;stroke-opacity:.13;stroke-width:2.6}
#ring .glow{fill:none;stroke:var(--acc);stroke-width:8;stroke-linecap:round;opacity:.18}
#ring .glow2{fill:none;stroke:var(--acc);stroke-width:15;stroke-linecap:round;opacity:.06}
#ring .fill{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round}
#ringin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#word span{display:inline-block}
#word{overflow:hidden;font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:700;line-height:.9;
  text-align:center;white-space:nowrap;letter-spacing:.06em;width:100%}
#num{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:min(11vw,8vh);line-height:1;text-align:center;opacity:.5;min-height:1em}
#dots{display:flex;flex-wrap:wrap;gap:min(2.4vw,13px);justify-content:center;padding:0 22px;min-height:min(4vw,24px)}
#dots i{width:min(3.8vw,22px);height:min(3.8vw,22px);border-radius:50%;border:1px solid currentColor;opacity:.28;background:transparent}
#dots i.on{opacity:1;background:var(--acc);border-color:var(--acc);box-shadow:0 0 8px var(--acc)}
#dots i.cur{opacity:.85;border-color:var(--acc)}
#bar{height:min(2.2vw,12px);border-radius:99px;margin:0 26px;width:calc(100% - 52px);position:relative;overflow:hidden;
  background:transparent;border:1px solid currentColor}
#bar span{display:block;height:100%;border-radius:99px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
#clock{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:min(17vw,12vh);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
#hint{text-align:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.5;padding:0 20px 10px}
#runfoot{padding:0 20px;display:flex;flex-direction:column;gap:10px;width:100%}
#runfoot .btn{border-color:currentColor;color:inherit;background:transparent;opacity:.9}
#runfoot .btn.wide{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:min(10vw,44px);
  letter-spacing:.14em;padding:14px 10px 10px;line-height:1}
#runfoot .btn:active{background:#ffffff14}
#runfoot .btn{position:relative}
#runfoot .btn.ready{border-color:var(--acc);color:var(--acc);opacity:1;box-shadow:0 0 12px var(--accA)}
#runfoot .btn.ready::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 34px var(--accA);opacity:0;animation:readyp 2.4s ease-in-out infinite}
@keyframes readyp{50%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  #runfoot .btn.ready::after{animation:none;opacity:.5}
  #bg,body.slow #bg{transition-duration:.15s}
  #flash.go{animation:none}
}
.hid{display:none !important}
</style>
</head>
<body>
<div id="bg"></div>
<div id="flash"></div>
<audio id="aout" playsinline style="display:none"></audio>

<!-- MODE PICK -->
<section id="s-mode" class="screen">
  <div class="spacer"></div>
  <div class="modes">
    <button class="mode" data-mode="lift"><div class="t">LIFT</div><div class="s">sets · reps · rest</div></button>
    <button class="mode" data-mode="breathe"><div class="t">BREATHE</div><div class="s">cycles</div></button>
  </div>
  <div class="spacer"></div>
</section>

<!-- SETUP -->
<section id="s-setup" class="screen">
  <div class="top"><button class="btn ghost" style="width:auto;padding:10px 16px" data-go="mode">Back</button><span class="eyebrow" id="setup-name">Lift</span></div>
  <div class="scroll">

    <div id="p-lift">
      <div class="card">
        <div class="row stack">
          <div class="seg" id="seg-preset" role="group" aria-label="Preset">
            <button data-preset="compound">Compound</button>
            <button data-preset="isolation">Isolation</button>
            <button data-preset="hold">Isometric</button>
          </div>
          <button class="sub" id="b-tune" aria-expanded="false"><span id="preset-sub"></span><i class="chev"></i></button>
        </div>
        <div id="tunebox" class="hid">
          <div class="counts">
            <div class="cnt"><div class="cl">In</div><div class="cv" id="v-in">4</div>
              <div class="cb"><button data-s="in:-0.5" aria-label="Less in">−</button><button data-s="in:0.5" aria-label="More in">+</button></div></div>
            <div class="cnt"><div class="cl">Hold</div><div class="cv" id="v-hold">2</div>
              <div class="cb"><button data-s="hold:-0.5" aria-label="Less hold">−</button><button data-s="hold:0.5" aria-label="More hold">+</button></div></div>
            <div class="cnt"><div class="cl">Out</div><div class="cv" id="v-out">6</div>
              <div class="cb"><button data-s="out:-0.5" aria-label="Less out">−</button><button data-s="out:0.5" aria-label="More out">+</button></div></div>
          </div>
          <div class="row"><span class="lbl">Rest</span>
            <div class="step"><button data-s="rest:-15" aria-label="Less rest">−</button><span class="v" id="v-rest">3:00</span><button data-s="rest:15" aria-label="More rest">+</button></div></div>
          <button class="btn ghost small hid" id="b-tunereset">Reset preset</button>
        </div>
      </div>

      <div class="card">
        <div class="row" id="row-reps"><span class="lbl">Reps</span>
          <div class="step"><button data-s="reps:-1" aria-label="Fewer reps">−</button><span class="v" id="v-reps">10</span><button data-s="reps:1" aria-label="More reps">+</button></div></div>
        <div class="row hid" id="row-hsec"><span class="lbl">Seconds</span>
          <div class="step"><button data-s="holdSec:-5" aria-label="Fewer seconds">−</button><span class="v" id="v-holdSec">45</span><button data-s="holdSec:5" aria-label="More seconds">+</button></div></div>
        <div class="row"><span class="lbl">Sets</span>
          <div class="step"><button data-s="sets:-1" aria-label="Fewer sets">−</button><span class="v" id="v-sets">4</span><button data-s="sets:1" aria-label="More sets">+</button></div></div>
      </div>

      <div class="card">
        <div class="row stack"><span class="lbl">Sound</span>
          <div class="seg sound" data-for="lift" role="group" aria-label="Sound"></div></div>
      </div>
    </div>

    <div id="p-breathe">
      <div class="card">
        <div class="row stack"><span class="lbl">Pattern</span>
          <div class="seg" id="seg-pat" role="group" aria-label="Pattern">
            <button data-pat="478">4 · 7 · 8</button>
            <button data-pat="coh">5.5 · 5.5</button>
            <button data-pat="box">4 · 4 · 4 · 4</button>
          </div></div>
        <div class="row"><span class="lbl">Cycles</span>
          <div class="step"><button data-s="cycles:-1" aria-label="Fewer cycles">−</button><span class="v" id="v-cycles">8</span><button data-s="cycles:1" aria-label="More cycles">+</button></div></div>
        <div class="sub" id="breathe-sub"></div>
      </div>
      <div class="card">
        <div class="row stack"><span class="lbl">Sound</span>
          <div class="seg sound" data-for="breathe" role="group" aria-label="Sound"></div></div>
      </div>
    </div>

  </div>
  <div class="foot"><button class="btn go" data-start="1">Start</button></div>
</section>

<!-- RUN -->
<section id="s-run" class="screen">
  <button id="endbtn">End</button>
  <div id="rmeta"></div>
  <div class="mid">
    <div id="ringwrap">
      <svg id="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="46"/>
        <circle class="glow2" cx="50" cy="50" r="46"/>
        <circle class="glow" cx="50" cy="50" r="46"/>
        <circle class="fill" cx="50" cy="50" r="46"/>
      </svg>
      <div id="ringin">
        <div id="word"><span></span></div>
        <div id="num"></div>
      </div>
    </div>
    <div id="clock" class="hid"></div>
    <div id="dots"></div>
    <div id="bar" class="hid"><span></span></div>
  </div>
  <div id="hint" class="hid">Tap for sound</div>
  <div id="runfoot">
    <button class="btn wide hid" id="b-next">Start set</button>
    <button class="btn hid" id="b-rest">Rest</button>
    <button class="btn hid" id="b-back">Back</button>
  </div>
</section>

<script>
(function(){
"use strict";

/* ============================ STORAGE ============================ */
var KEY = "bp.v3", LIVE = "bp.live";
var DEF = {
  cfg: {
    last: "lift",
    lift: {preset:"compound", reps:10, sets:4, holdSec:45, sound:"tone",
      tune:{compound:{"in":4, hold:2, out:6, rest:180},
            isolation:{"in":2, hold:0, out:3, rest:90},
            hold:{"in":4, hold:0, out:8, rest:90}}},
    breathe: {cycles:8, pat:"478", sound:"tone"}
  }
};
var PATS = {"478":{"in":4, hold:7, out:8, empty:0},
            coh:{"in":5.5, hold:0, out:5.5, empty:0},
            box:{"in":4, hold:4, out:4, empty:4}};
/* defaults shipped briefly by an earlier build: a stored tune still equal to one of these was never edited, so it follows the real default */
var OLD_TUNE = {compound:[{"in":2, hold:3, out:2}], isolation:[{"in":3, hold:0, out:2}], hold:[{"in":4, hold:0, out:6}]};
var SOUND_OK = {tone:1, breath:1, off:1};
var PRESET_OK = {compound:1, isolation:1, hold:1};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var DB = clone(DEF);
var carried = null;   /* earlier versions stored usage totals here; kept as-is, never read */

/* old flat lift config (v1/v2) -> preset shape */
function liftToV3(o){
  var out = clone(DEF.cfg.lift);
  if(!o) return out;
  if(o.reps) out.reps = o.reps;
  if(o.sets) out.sets = o.sets;
  if(o.holdSec) out.holdSec = o.holdSec;
  if(o.sound) out.sound = o.sound;
  out.preset = o.holdMode ? "hold" : (o.type === "isolation" ? "isolation" : "compound");
  if(!o.holdMode && o["in"] !== undefined){
    var t = out.tune[out.preset];
    t["in"] = +o["in"] || t["in"];
    t.hold = +o.hold || 0;
    t.out = +o.out || t.out;
    t.rest = +o.rest || t.rest;
  }
  return out;
}
try{
  var raw = JSON.parse(localStorage.getItem(KEY) || "null");
  if(!raw){
    var v2 = JSON.parse(localStorage.getItem("bp.v2") || "null");
    if(!v2){
      var v1 = JSON.parse(localStorage.getItem("bp.v1") || "null");
      if(v1) v2 = {cfg:{lift: v1.cfg && v1.cfg.lift || {}, breathe: v1.cfg && v1.cfg.sleep || {}}, stats: v1.stats};
    }
    if(v2) raw = {cfg:{lift: liftToV3(v2.cfg && v2.cfg.lift), breathe: v2.cfg && v2.cfg.breathe || {}}, stats: v2.stats};
  }
  if(raw && raw.cfg){
    var L = raw.cfg.lift;
    if(L){
      if(L.tune === undefined) L = liftToV3(L);
      ["preset","reps","sets","holdSec","sound"].forEach(function(k){ if(L[k] !== undefined) DB.cfg.lift[k] = L[k]; });
      if(L.tune) for(var pk in DB.cfg.lift.tune){
        var T0 = L.tune[pk];
        if(!T0) continue;
        var stale = (OLD_TUNE[pk] || []).some(function(o){ return +T0["in"] === o["in"] && +T0.hold === o.hold && +T0.out === o.out; });
        for(var tk in DB.cfg.lift.tune[pk]){
          if(T0[tk] === undefined) continue;
          if(stale && tk !== "rest") continue;
          DB.cfg.lift.tune[pk][tk] = +T0[tk];
        }
      }
    }
    if(raw.cfg.breathe) for(var bk in DB.cfg.breathe) if(raw.cfg.breathe[bk] !== undefined) DB.cfg.breathe[bk] = raw.cfg.breathe[bk];
    if(raw.cfg.last === "lift" || raw.cfg.last === "breathe") DB.cfg.last = raw.cfg.last;
  }
  if(raw && raw.stats) carried = raw.stats;
}catch(e){}
if(!SOUND_OK[DB.cfg.lift.sound]) DB.cfg.lift.sound = "tone";
if(!SOUND_OK[DB.cfg.breathe.sound]) DB.cfg.breathe.sound = "tone";
if(!PRESET_OK[DB.cfg.lift.preset]) DB.cfg.lift.preset = "compound";
if(!PATS[DB.cfg.breathe.pat]) DB.cfg.breathe.pat = "478";
function save(){
  try{ var o = {cfg:DB.cfg}; if(carried) o.stats = carried; localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){}
}
save();

/* ============================ CLOCK ============================
   The session runs on performance.now(): monotonic, keeps counting through
   an audio interruption or a locked screen. Audio is mapped onto the
   AudioContext clock at the moment each phase is scheduled. */
var A = null;
function nowSec(){ return performance.now()/1000; }
function toCtx(t){ return A.ctx.currentTime + (t - nowSec()); }

/* ============================ AUDIO ============================ */
var scheme = null, audioDead = false, stopT = 0, muted = false;

function easeIO(p){ return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2; }
function easeOut(p){ return 1 - Math.pow(1-p, 3); }
function easeIn(p){ return p*p*p; }

function env(param, from, to, at, dur, shape){
  if(!A) return;
  var ctx = A.ctx, now = ctx.currentTime;
  var t0 = at < now ? now : at;
  shape = shape || easeIO;
  try{
    if(param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t0);
    else param.cancelScheduledValues(t0);
  }catch(e){ try{ param.cancelScheduledValues(t0); }catch(e2){} }
  var start = (at <= now + 0.03) ? param.value : from;
  if(!isFinite(start)) start = from;
  param.setValueAtTime(start, t0);
  var N = 26, i, p;
  for(i=1; i<=N; i++){
    p = i/N;

/* Phase design, in the manner of a sound bath: the tone is always present.
   IN swells and keeps blooming to the top of the breath. HOLD is a held
   note, still but sounding. OUT descends and stays audible to the last
   moment of the exhale. Nothing is cut short; between phases the pad

      env(s.hi.gain, hi, hi*1.06, at + g*0.7, g*0.3, easeIO);      /* ...and keeps opening to the top */

      env(s.lo.gain, st.lo, 0.09*k, at, Math.min(g*0.4, 0.7), easeIO);

      env(s.lo.gain, st.lo, lo, at, g*0.2, easeOut);               /* the low pad answers... */
      env(s.lo.gain, lo, bedLo*1.3, at + g*0.2, g*0.8, easeIO);    /* ...and descends, audible to the last moment */

      env(s.lp.frequency, 2300, 1100, at, g, easeIO);

      env(s.bp.frequency, 700, 700, at, 0.05, easeIO);
      env(s.lp.frequency, 1600, 1600, at, 0.05, easeIO);
      n = Math.min(3, Math.floor(dur + 0.001)); from = st.g;

    }else{
      env(s.g.gain, st.g, bed*0.6, at, 0.8, easeIO);
      st.g = bed*0.6;
    }
  }
}

/* ============================ SESSION ============================ */
var LOOK = 5.0;        /* seconds of audio queued ahead of the clock: more than any timer throttle */
var INF = 1e9;         /* an open-ended step: READY waits for a tap, DONE waits for nothing */

var ivl = 0, resumeTries = 0;

   first breaths are short and each is a little longer than the last, settling
   at coherent 5.5 / 5.5 by the fifth breath. Whole breaths only, fitted to the
   rest exactly, so the rest always ends on a finished exhale. */
function restSteps(seconds, stage, setNo){

  for(i=0;i<n;i++){ var d = n === 1 ? 4 : 3 + 2*i/(n-1); ph_.push(d); sum += 2*d; }

  else ph_.push(seconds / 2);

function buildSteps(){
  var st = [], c = DB.cfg, i, s, r;

    for(s=1; s<=S.sets; s++){

        var reps = Math.ceil(S.holdSec / cyc) + 1;
        for(r=1; r<=reps; r++) pushCycle(st, counts, "set", s, r);
        trimTo(st, mark, S.holdSec);
      }else{
        for(r=1; r<=S.reps; r++) pushCycle(st, counts, "set", s, r);
      }
      if(s < S.sets){
        st.push(ph("pause", 2, "rest", s, 0));                    /* a breath of silence: the set is over */
        if(S.restDur > 2){

  if(mode === "lift"){

    S.restDur = c.lift.tune[c.lift.preset].rest;

  }

function beginRun(){

  buildDots();

  if(!S.running || !A || !scheme) return;
  if(A.ctx.state !== "running"){
    if(++resumeTries % 5 === 1){ try{ A.ctx.resume(); }catch(e){} }
    return;
  }
  scheduleAhead(now);
}

function endSession(natural){
  if(!S.running) return;
  S.running = false;
  if(ivl){ clearInterval(ivl); ivl = 0; }
  persist();
  audioStop(natural && S.mode === "breathe" ? 3.5 : 1.2);
  wake(false);
  disarmEnd();
  if(!natural){ show("setup"); }
  else{ paint("done"); }
}

function startTimeOf(j){
  var t = S.stepStart, k;
  for(k = S.idx; k < j; k++) t += S.steps[k].dur;
  return t;
}
function scheduleAhead(now){
  if(!A || !scheme || A.ctx.state !== "running") return;
  var guard = 0;
  while(S.schedIdx < S.steps.length - 1 && guard++ < 60){
    var j = S.schedIdx + 1, t = startTimeOf(j), stp = S.steps[j];
    if(t > now + LOOK) break;
    var at = t, dur = stp.dur;
    if(at + dur <= now && stp.k !== "done"){ S.schedIdx = j; continue; }   /* already over: nothing to play */
    if(at < now){ dur = dur - (now - at); at = now; }                      /* under way: play the remainder */
    if(stp.k === "done") env(A.master.gain, A.lvl, 0.0001, toCtx(at + 0.005), S.mode === "breathe" ? 3.5 : 1.5, easeIn);
    else schemePhase(stp.k, toCtx(at + 0.005), dur);
    S.schedIdx = j;
  }
}
function rescheduleFrom(now){
  if(A && scheme){ try{ schemeCancel(A.ctx.currentTime); }catch(e){} }
  S.schedIdx = S.idx - 1;
  scheduleAhead(now);
}

/* re-anchor the current step to this instant and re-queue its sound */
function reanchor(){
  S.stepStart = nowSec();
  lastBg = null; lastDots = -1;
  rescheduleFrom(S.stepStart);
  persist();
}
/* drop the steps before j and begin j now */
function skipTo(j){
  if(j > S.idx){ S.steps.splice(S.idx, j - S.idx); packedOf = null; }
  reanchor();
}
function endSet(){                                    /* REST / FINISH: the set is over now */
  var st = S.steps[S.idx];
  if(!S.running || !st || st.stage !== "set") return;
  var j = S.idx;
  while(j < S.steps.length && S.steps[j].stage === "set" && S.steps[j].set === st.set) j++;
  skipTo(j);
}
function startSet(){                                  /* START SET: done resting */
  var st = S.steps[S.idx];
  if(!S.running || !st || st.stage !== "rest") return;
  var j = S.idx;
  while(j < S.steps.length && S.steps[j].stage === "rest" && S.steps[j].set === st.set) j++;
  skipTo(j);
}
/* a tap on the pacer means one thing: "I am breathing in now" */
function syncTap(){
  var st = S.steps[S.idx];
  if(!S.running || !st || st.stage === "rest" || st.k === "done") return;
  if(st.k === "in"){ reanchor(); return true; }
  for(var j = S.idx + 1; j < S.steps.length; j++){
    var q = S.steps[j];
    if(q.stage === "rest" || q.k === "done") break;
    if(q.k === "in"){ skipTo(j); return true; }
  }
  return false;
}

/* ---- a live session survives a reload: iOS drops backgrounded web pages freely ---- */
var packed = null, packedOf = null;
function packSteps(){
  if(packedOf !== S.steps || !packed){
    packed = []; packedOf = S.steps;
    for(var i=0;i<S.steps.length;i++){ var q = S.steps[i]; packed.push([q.k, q.dur, q.stage, q.set, q.rep]); }
  }
  return packed;
}
function persist(){
  try{
    if(!S.running){ localStorage.removeItem(LIVE); return; }
    localStorage.setItem(LIVE, JSON.stringify({
      mode:S.mode, sound:S.sound, reps:S.reps, sets:S.sets, restDur:S.restDur, holdMode:S.holdMode, holdSec:S.holdSec,
      steps:packSteps(), idx:S.idx, at: Date.now() - (nowSec() - S.stepStart)*1000
    }));
  }catch(e){}
}
function restore(){
  var r = null;
  try{ r = JSON.parse(localStorage.getItem(LIVE) || "null"); }catch(e){}
  if(!r || !(r.mode === "lift" || r.mode === "breathe") || !r.steps || !r.steps.length) return false;
  var ok = true, i, steps = [];
  for(i=0;i<r.steps.length;i++){
    var q = r.steps[i];
    if(!q || typeof q[0] !== "string" || typeof q[1] !== "number" || !(q[1] >= 0)){ ok = false; break; }
    steps.push(ph(q[0], q[1], q[2], q[3], q[4]));
  }
  var elapsed = (Date.now() - (+r.at || 0))/1000;
  if(!ok || !(elapsed > -5 && elapsed < 6*3600)){ try{ localStorage.removeItem(LIVE); }catch(e){} return false; }
  S.mode = r.mode; S.sound = SOUND_OK[r.sound] ? r.sound : "tone";
  S.reps = +r.reps || 1; S.sets = +r.sets || 1; S.restDur = +r.restDur || 0;
  S.holdMode = r.holdMode ? 1 : 0; S.holdSec = +r.holdSec || 45;
  S.steps = steps; S.idx = Math.min(Math.max(r.idx|0, 0), S.steps.length - 1);
  S.stepStart = nowSec() - Math.max(0, elapsed); S.schedIdx = S.idx - 1;
  var now = nowSec(), guard = 0;
  while(S.idx < S.steps.length - 1 && now >= S.stepStart + S.steps[S.idx].dur && guard++ < 20000){ S.stepStart += S.steps[S.idx].dur; S.idx++; }
  var cur = S.steps[S.idx];
  if(cur.k === "done" || (cur.k === "ready" && now - S.stepStart > 20*60)){ try{ localStorage.removeItem(LIVE); }catch(e){} return false; }
  S.running = true;
  DB.cfg.last = S.mode; save();
  beginRun();
  persist();
  return true;
}
/* sound needs a touch after a reload; the first tap anywhere on the pacer provides it */
function ensureAudio(){
  if(!S.running || S.sound === "off" || scheme || audioDead) return;
  audioStart(S.mode, S.sound);
  if(scheme) rescheduleFrom(nowSec());
}

/* ============================ RENDER ============================ */
/* [bg, text, accent] per phase; index 0 = lift, 1 = breathe (dimmed) */
var PAL = {
  0: {"in":["#071c33","#d9f2ff","#4fd9ff"], hold:["#dcf1fb","#082031","#0e7490"],
      out:["#2a1206","#ffe8d1","#ffab5e"], empty:["#030407","#5d6b7c","#26313f"],
      getset:["#06080f","#cfe9ff","#3d7ea3"], ready:["#06080f","#cfe9ff","#4fd9ff"],
      pause:["#030407","#5d6b7c","#26313f"], done:["#04060c","#d7e7f5","#4fd9ff"]},
  1: {"in":["#050b14","#7d95ab","#3d7ea3"], hold:["#10161f","#9db2c6","#557f9b"],
      out:["#150b04","#a58a68","#8a5a33"], empty:["#000000","#44515f","#1c2733"],
      getset:["#04060c","#7d95ab","#3d7ea3"], ready:["#04060c","#7d95ab","#3d7ea3"],
      pause:["#000000","#44515f","#1c2733"], done:["#000000","#7d95ab","#3d7ea3"]}
};
var elBg = document.getElementById("bg"), elWord = document.getElementById("word"),
    elWordI = document.getElementById("word").firstElementChild,
    elNum = document.getElementById("num"), elDots = document.getElementById("dots"),
    elBar = document.getElementById("bar"), elBarIn = elBar.firstElementChild,
    elClock = document.getElementById("clock"), elMeta = document.getElementById("rmeta"),
    elHint = document.getElementById("hint"),
    bNext = document.getElementById("b-next"), bRest = document.getElementById("b-rest"),
    bBack = document.getElementById("b-back"), elRun = document.getElementById("s-run"),
    elEnd = document.getElementById("endbtn"),
    elRingWrap = document.getElementById("ringwrap"),
    elRingFill = document.querySelector("#ring .fill"), elRingGlow = document.querySelector("#ring .glow"),
    elRingGlow2 = document.querySelector("#ring .glow2");
var CIRC = 2 * Math.PI * 46;
elRingFill.style.strokeDasharray = elRingGlow.style.strokeDasharray = elRingGlow2.style.strokeDasharray = CIRC;
elRingFill.style.strokeDashoffset = elRingGlow.style.strokeDashoffset = elRingGlow2.style.strokeDashoffset = CIRC;
var lastWord = null, lastNum = null, lastClock = null, lastMeta = null, lastBg = null, lastDots = -1,
    lastRestLbl = null, lastHint = null, lastReady = null;

function setRing(p){                       /* p: 0 empty .. 1 full */
  p = Math.max(0, Math.min(1, p));
  elRingFill.style.strokeDashoffset = elRingGlow.style.strokeDashoffset = elRingGlow2.style.strokeDashoffset = CIRC * (1 - p);
}
function buildDots(){
  elDots.innerHTML = "";
  if(S.holdMode) return;
  var n = S.reps;
  if(n > 30) return;
  for(var i=0;i<n;i++) elDots.appendChild(document.createElement("i"));
  lastDots = -1;
}
function palIdx(){ return S.mode === "breathe" ? 1 : 0; }
function fmtClock(s){
  s = Math.max(0, Math.ceil(s));
  var m = Math.floor(s/60), r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function fmtUp(s){
  s = Math.max(0, Math.floor(s));
  var m = Math.floor(s/60), r = s % 60;
  return "+" + m + ":" + (r < 10 ? "0" : "") + r;
}
function paint(kind){
  var p = PAL[palIdx()][kind] || PAL[palIdx()].done;
  if(lastBg !== p[0]){
    elBg.style.backgroundColor = p[0];
    elRun.style.color = p[1];
    elRun.style.setProperty("--acc", p[2]);
    elRun.style.setProperty("--accA", p[2] + "66");
    lastBg = p[0];
  }
}
function fitWord(w){
  var avail = elRingWrap.clientWidth * 0.64;
  if(!w || avail < 60) return;
  var size = Math.min(window.innerWidth*0.30, window.innerHeight*0.20);
  elWordI.textContent = w;
  elWord.style.fontSize = size + "px";
  var wd = elWordI.offsetWidth, pass = 0;
  while(wd > avail && wd > 0 && pass++ < 3){
    size = size * (avail / wd);
    elWord.style.fontSize = size + "px";
    wd = elWordI.offsetWidth;
  }
}
function txt(el, v, cache){ if(cache !== v) el.textContent = v; return v; }
function vis(el, on){ el.classList.toggle("hid", !on); }

var WORDS = {"in":"IN", hold:"HOLD", out:"OUT", empty:"HOLD", getset:"GET SET", ready:"READY", pause:"", done:"DONE"};

function render(now){
  var st = S.steps[S.idx];
  if(!st) return;
  var open = st.dur >= INF;
  var rem = open ? 0 : Math.max(0, S.stepStart + st.dur - now);
  var frac = (!open && st.dur > 0) ? Math.max(0, Math.min(1, (now - S.stepStart) / st.dur)) : 0;

  paint(st.k);

  /* the circle: fills on IN, stays full on HOLD, unfills on OUT, empty on the empty hold */
  if(st.k === "in") setRing(frac);
  else if(st.k === "hold") setRing(1);
  else if(st.k === "out") setRing(1 - frac);
  else if(st.k === "empty" || st.k === "pause") setRing(0);
  else if(st.k === "getset") setRing(1 - frac);   /* drains down as the countdown runs */
  else setRing(1);

  var word = WORDS[st.k] || "";
  if(word !== lastWord) fitWord(word);
  lastWord = txt(elWordI, word, lastWord);

  if(st.k === "done"){
    lastNum = txt(elNum, "", lastNum);
    vis(elClock, false); vis(elBar, false); vis(elDots, false); vis(elHint, false);
    lastMeta = txt(elMeta, "", lastMeta);
    vis(bNext, false); vis(bRest, false); vis(bBack, true); vis(elEnd, false);
    return;
  }
  vis(elEnd, true);

  var counted = st.k === "in" || st.k === "hold" || st.k === "out" || st.k === "empty" || st.k === "getset";
  var shown = Math.min(Math.ceil(rem - 0.001), Math.ceil(st.dur));
  lastNum = txt(elNum, counted ? String(shown || 1) : "", lastNum);

  var wantHint = S.sound !== "off" && !scheme && !audioDead && S.running;
  if(wantHint !== lastHint){ vis(elHint, wantHint); lastHint = wantHint; }

  var isRest = st.stage === "rest";
  var isSet  = st.stage === "set";

  if(isRest){
    var left, i;
    if(st.k === "ready") left = -(now - S.stepStart);
    else{
      left = rem;
      for(i = S.idx + 1; i < S.steps.length && S.steps[i].stage === "rest" && S.steps[i].set === st.set && S.steps[i].k !== "ready"; i++) left += S.steps[i].dur;
    }
    vis(elClock, true);
    lastClock = txt(elClock, left >= 0 ? fmtClock(left) : fmtUp(-left), lastClock);
    vis(elDots, false); vis(elBar, false);
    lastMeta = txt(elMeta, "REST · SET " + (st.set + 1) + "/" + S.sets + " NEXT", lastMeta);
    vis(bNext, true); vis(bRest, false); vis(bBack, false);
    var rdy = st.k === "ready";
    if(rdy !== lastReady){ bNext.classList.toggle("ready", rdy); lastReady = rdy; }
  }else{
    vis(elClock, false);
    vis(bNext, false); vis(bBack, false);
    if(lastReady !== null){ bNext.classList.remove("ready"); lastReady = null; }
    var showRest = isSet && S.mode === "lift";
    vis(bRest, showRest);
    if(showRest){
      var lbl = st.set === S.sets ? "Finish" : "Rest";
      lastRestLbl = txt(bRest, lbl, lastRestLbl);
    }
    if(S.holdMode && isSet){
      vis(elBar, true); vis(elDots, false);
      var pr = holdProgress(now, st);
      elBarIn.style.width = (100 * Math.min(1, pr / S.holdSec)).toFixed(1) + "%";
      lastMeta = txt(elMeta, "SET " + st.set + "/" + S.sets + " · " + Math.ceil(S.holdSec - pr) + "S", lastMeta);
    }else{
      vis(elBar, false); vis(elDots, true);
      var rp = isSet ? st.rep : 0;
      if(rp !== lastDots){
        var kids = elDots.children;
        for(var d=0; d<kids.length; d++) kids[d].className = d < rp - 1 ? "on" : (d === rp - 1 ? "cur" : "");
        lastDots = rp;
      }
      if(S.mode === "breathe") lastMeta = txt(elMeta, isSet ? ("CYCLE " + st.rep + "/" + S.reps) : "", lastMeta);
      else lastMeta = txt(elMeta, "SET " + st.set + "/" + S.sets + (isSet ? " · " + st.rep + "/" + S.reps : ""), lastMeta);
    }
  }
}
function holdProgress(now, st){
  var elapsed = 0, i;
  for(i=0;i<S.idx;i++) if(S.steps[i].stage === "set" && S.steps[i].set === st.set) elapsed += S.steps[i].dur;
  elapsed += Math.min(now - S.stepStart, st.dur);
  return Math.max(0, Math.min(elapsed, S.holdSec));
}

/* ============================ LOOP ============================ */

  render(now);
  if(S.running) raf = requestAnimationFrame(tick);   /* DONE is painted once, then the loop rests */
}

var LIM = {reps:[1,60,1], sets:[1,20,1], holdSec:[5,300,5], "in":[0.5,20,0.5], hold:[0,20,0.5],
           out:[0.5,20,0.5], rest:[0,900,15], cycles:[1,40,1]};
function bump(key, delta){
  var target = (key === "cycles") ? DB.cfg.breathe
             : (key === "in" || key === "hold" || key === "out" || key === "rest")
               ? DB.cfg.lift.tune[DB.cfg.lift.preset]
               : DB.cfg.lift;
  var lim = LIM[key];
  if(!lim) return;
  var v = (+target[key]) + delta;
  v = Math.round(v*10)/10;
  if(v < lim[0]) v = lim[0];
  if(v > lim[1]) v = lim[1];
  target[key] = v;
  save(); refresh();
}

document.addEventListener("dblclick", function(e){ e.preventDefault(); });

/* refit the giant word once the real face has loaded */
try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ lastWord = null; }); }catch(e){}

/* ---- boot ---- */
initSoundPickers();
refresh();
if(!restore()) show("mode");
if("serviceWorker" in navigator){
  try{
    navigator.serviceWorker.register("./sw.js").catch(function(){});
    /* when a new version takes over while nothing is happening, pick it up now rather than next launch */
    var hadCtl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(hadCtl && !S.running && document.getElementById("s-mode").classList.contains("on")) location.reload();
      hadCtl = true;
    });
  }catch(e){}
}

window.BP = {S:S, DB:DB, now:nowSec, build:buildSteps, advance:advance, sync:syncTap, audio:function(){ return A; }, scheme:function(){ return scheme; }};

})();
