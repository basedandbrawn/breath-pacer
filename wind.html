<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050910">
<title>Wind</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* ---------------------------------------------------------------
   WIND · prototype
   The whole screen is the instrument. Text is the caption.
   No web fonts, no CDN, no build: this file is the app.
   --------------------------------------------------------------- */
:root{
  --fg:#eef3f7; --mute:rgba(238,243,247,.55); --line:rgba(238,243,247,.16);
  --ui:rgba(8,12,18,.55);
  --wordSize:64px;             /* set ONCE by fitWordOnce(), never per word */
  --countSize:min(14vw,9vh);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#050910}
body{
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--fg);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:manipulation;
}
canvas.field{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
canvas.field[hidden]{display:none}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.14}100%{opacity:0}}
#perf{position:fixed;left:8px;top:calc(env(safe-area-inset-top) + 6px);z-index:8;font:10px/1.4 ui-monospace,Menlo,monospace;
  color:#9fe;opacity:.8;pointer-events:none;white-space:pre;display:none}

.screen{position:relative;z-index:1;display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px)}
.screen.on{display:flex}
.spacer{flex:1 1 auto}
button{font:inherit;color:inherit;background:transparent;border:0;margin:0;padding:0;cursor:pointer}
.lbl{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* ---------- home ---------- */
.mark{display:grid;justify-items:center;gap:6px;padding-top:min(9vh,70px)}
.mark .s{font-size:12px;letter-spacing:.5em;color:var(--mute);font-weight:600;padding-left:.5em}
.mark .w{font-weight:800;font-size:min(23vw,120px);line-height:.95;letter-spacing:.01em}
.modes{display:grid;gap:12px}
.mode{display:flex;justify-content:space-between;align-items:baseline;padding:22px 22px;border-radius:20px;
  background:var(--ui);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mode:active{background:rgba(238,243,247,.12)}
.mode .t{font-weight:800;font-size:min(9vw,40px);letter-spacing:.04em;line-height:1}
.mode .d{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:600}
.engrow{display:grid;gap:10px;margin-top:22px}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-width:0;padding:13px 4px;border-radius:12px;background:var(--ui);border:1px solid var(--line);
  font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--mute);text-transform:uppercase;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button.sel{color:var(--fg);border-color:rgba(238,243,247,.6);background:rgba(238,243,247,.14)}
.seg button[disabled]{opacity:.35}
.note{font-size:12px;line-height:1.45;color:var(--mute);min-height:2.9em;letter-spacing:.02em}

/* ---------- setup ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;height:40px}
.btn{display:block;width:100%;padding:18px 16px;border-radius:16px;background:var(--ui);border:1px solid var(--line);
  color:var(--fg);font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;text-align:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.ghost{width:auto;padding:10px 16px;color:var(--mute);font-size:12px}
.btn.go{font-size:min(12vw,46px);letter-spacing:.14em;padding:16px 16px 12px;line-height:1;font-weight:800;
  background:rgba(238,243,247,.14);border-color:rgba(238,243,247,.5)}
.card{background:var(--ui);border:1px solid var(--line);border-radius:18px;padding:4px 18px;margin-bottom:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.stack{flex-direction:column;align-items:stretch;gap:10px}
.step{display:flex;align-items:center;gap:2px}
.step button{width:52px;height:52px;border-radius:14px;background:rgba(238,243,247,.08);border:1px solid var(--line);
  font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center}
.step .v{min-width:74px;text-align:center;font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.hid{display:none !important}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.foot{margin-top:14px}

/* ---------- run: the invariant slot stack ----------
   Every slot has a fixed height. Phase changes may alter colour and the
   field behind, and nothing else. */
#s-run{padding-left:0;padding-right:0}
.slot{flex:0 0 auto}
.meta{height:44px;position:relative;display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:min(3.6vw,14px);letter-spacing:.2em;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;
  color:var(--mute);padding:0 72px;font-variant-numeric:tabular-nums}
#endbtn{position:absolute;right:calc(env(safe-area-inset-right) + 12px);top:0;height:44px;padding:0 10px;
  font-size:12px;letter-spacing:.24em;color:var(--mute);font-weight:700;text-transform:uppercase}
.word{height:calc(var(--wordSize) * 1.25);display:flex;align-items:center;justify-content:center;
  font-size:var(--wordSize);font-weight:800;line-height:1;letter-spacing:.04em;white-space:nowrap;
  text-shadow:0 0 28px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5)}
.count{height:calc(var(--countSize) * 1.3);display:flex;align-items:center;justify-content:center;
  font-size:var(--countSize);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:4ch;opacity:.9;
  text-shadow:0 0 28px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5)}
.rail{height:36px;display:flex;align-items:center;justify-content:center;gap:min(6vw,28px);
  font-size:11px;letter-spacing:.22em;font-weight:700}
.rail .r{opacity:.28;transition:opacity .35s}
.rail .r.on{opacity:1}
.foot.slot{height:66px;margin:0 20px;position:relative}
.foot.slot .btn{position:absolute;inset:0;width:auto;visibility:hidden;border-color:rgba(238,243,247,.4);
  font-size:min(9vw,40px);letter-spacing:.14em;padding:0;font-weight:800;line-height:66px}
.foot.slot .btn.show{visibility:visible}
.foot.slot .btn.sm{font-size:13px;letter-spacing:.24em;font-weight:700}
</style>
</head>
<body>
<canvas id="gl" class="field" hidden></canvas>
<canvas id="c2d" class="field"></canvas>
<div id="flash"></div>
<div id="perf"></div>
<audio id="aout" playsinline style="display:none"></audio>

<!-- HOME -->
<section id="s-home" class="screen on">
  <div class="mark"><div class="s">SECOND</div><div class="w" id="mark">WIND</div></div>
  <div class="spacer"></div>
  <div class="modes">
    <button class="mode" data-go="lift"><span class="t">LIFT</span><span class="d">sets · reps · rest</span></button>
    <button class="mode" data-go="breathe"><span class="t">BREATHE</span><span class="d">cycles</span></button>
  </div>
  <div class="engrow">
    <span class="lbl">Wind engine</span>
    <div class="seg" id="seg-eng">
      <button data-eng="field">Field</button>
      <button data-eng="memory">Memory</button><button data-eng="still">Still</button>
    </div>
    <div class="note" id="engnote"></div>
  </div>
</section>

<!-- SETUP -->
<section id="s-setup" class="screen">
  <div class="top"><button class="btn ghost" data-go="home">Back</button><span class="eyebrow" id="setup-title">Lift</span></div>
  <div class="scroll">
    <div id="setup-lift">
      <div class="card"><div class="row stack">
        <div class="seg" id="seg-preset"><button data-preset="compound">Compound</button><button data-preset="isolation">Isolation</button><button data-preset="hold">Hold</button></div>
        <div id="preset-sub" style="text-align:center;font-size:12px;letter-spacing:.2em;color:var(--mute);padding-bottom:6px"></div>
      </div></div>
      <div class="card">
        <div class="row" id="row-reps"><span class="lbl">Reps</span><div class="step"><button data-s="reps:-1">−</button><span class="v" id="v-reps">10</span><button data-s="reps:1">+</button></div></div>
        <div class="row hid" id="row-hsec"><span class="lbl">Seconds</span><div class="step"><button data-s="holdSec:-5">−</button><span class="v" id="v-holdSec">45</span><button data-s="holdSec:5">+</button></div></div>
        <div class="row"><span class="lbl">Sets</span><div class="step"><button data-s="sets:-1">−</button><span class="v" id="v-sets">4</span><button data-s="sets:1">+</button></div></div>
      </div>
    </div>
    <div id="setup-breathe">
      <div class="card">
        <div class="row stack"><span class="lbl">Pattern</span>
          <div class="seg" id="seg-pat"><button data-pat="478">4 · 7 · 8</button><button data-pat="coh">5.5 · 5.5</button><button data-pat="follow" id="b-follow">Follow</button></div>
          <div id="pat-sub" style="text-align:center;font-size:12px;letter-spacing:.1em;color:var(--mute);padding-bottom:6px;line-height:1.5"></div></div>
        <div class="row"><span class="lbl">Cycles</span><div class="step"><button data-s="cycles:-1">−</button><span class="v" id="v-cycles">8</span><button data-s="cycles:1">+</button></div></div>
      </div>
    </div>
    <div class="card"><div class="row stack"><span class="lbl">Sound</span><div class="seg" id="seg-sound"><button data-sound="tone">Tone</button><button data-sound="breath">Breath</button></div></div></div>
    <div class="note" id="setupnote" style="padding:0 4px"></div>
  </div>
  <div class="foot"><button class="btn go" id="b-start">Start</button></div>
</section>

<!-- RUN -->
<section id="s-run" class="screen">
  <div class="meta slot"><span id="rmeta"></span><button id="endbtn">End</button></div>
  <div class="spacer"></div>
  <div class="word slot" id="word"><span></span></div>
  <div class="count slot" id="num"></div>
  <div class="rail slot"><span class="r" data-k="in">IN</span><span class="r" data-k="hold">HOLD</span><span class="r" data-k="out">OUT</span></div>
  <div class="spacer"></div>
  <div class="foot slot">
    <button class="btn" id="b-skip">Skip rest</button>
    <button class="btn sm" id="b-save">Save set</button>
    <button class="btn sm" id="b-back">Back</button>
  </div>
</section>

<script>
(function(){
"use strict";
var Q = {}; try{ location.search.slice(1).split("&").forEach(function(kv){ var p=kv.split("="); if(p[0]) Q[p[0]] = p[1]===undefined?1:decodeURIComponent(p[1]); }); }catch(e){}

/* ============================ STORAGE ============================ */
var KEY = "wind.v1";
var DEF = {
  cfg: {
    engine: "field",
    lift: {preset:"compound", reps:10, sets:4, holdSec:45, sound:"tone",
      tune:{compound:{"in":4, hold:2, out:6, rest:180},
            isolation:{"in":2, hold:0, out:3, rest:90},
            hold:{"in":4, hold:0, out:8, rest:90}}},
    breathe: {cycles:8, pat:"478", sound:"tone"}
  },
  stats: {sec:0, log:[]}
};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var DB = clone(DEF);
try{
  var raw = JSON.parse(localStorage.getItem(KEY) || "null");
  if(raw && raw.cfg){
    if(raw.cfg.engine) DB.cfg.engine = raw.cfg.engine;
    if(raw.cfg.chose) DB.cfg.chose = true;
    if(!{field:1,memory:1,still:1}[DB.cfg.engine]) DB.cfg.engine = "field";
    var L = raw.cfg.lift; if(L){ ["preset","reps","sets","holdSec","sound"].forEach(function(k){ if(L[k]!==undefined) DB.cfg.lift[k]=L[k]; });
      if(L.tune) for(var pk in DB.cfg.lift.tune){ if(L.tune[pk]) for(var tk in DB.cfg.lift.tune[pk]) if(L.tune[pk][tk]!==undefined) DB.cfg.lift.tune[pk][tk]=L.tune[pk][tk]; } }
    if(raw.cfg.breathe) for(var bk in DB.cfg.breathe) if(raw.cfg.breathe[bk]!==undefined) DB.cfg.breathe[bk]=raw.cfg.breathe[bk];
  }
  if(raw && raw.stats){ DB.stats.sec = raw.stats.sec||0; DB.stats.log = raw.stats.log||[]; }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

/* ============================ CLOCK ============================
   One timebase. Follows the AudioContext clock while it advances and
   extrapolates with performance.now() when iOS suspends it. */
var A = null, lastCtxT = 0, lastPerfT = 0;
function nowSec(){
  var p = performance.now()/1000;
  if(A){ var c = A.ctx.currentTime; if(c > lastCtxT){ lastCtxT = c; lastPerfT = p; return c; } return lastCtxT + (p - lastPerfT); }
  return p;
}
function toCtx(t){ return A.ctx.currentTime + Math.max(0, t - nowSec()); }

/* ============================ AUDIO ============================ */
var scheme = null;
function easeIO(p){ return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2; }
function easeOut(p){ return 1 - Math.pow(1-p, 3); }
function easeIn(p){ return p*p*p; }
function env(param, from, to, at, dur, shape){
  if(!A) return;
  var ctx = A.ctx, now = ctx.currentTime, t0 = at < now ? now : at;
  shape = shape || easeIO;
  try{ if(param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t0); else param.cancelScheduledValues(t0); }catch(e){ try{ param.cancelScheduledValues(t0); }catch(e2){} }
  var start = (at <= now + 0.03) ? param.value : from; if(!isFinite(start)) start = from;
  param.setValueAtTime(start, t0);
  for(var i=1; i<=26; i++){ var p=i/26; param.linearRampToValueAtTime(start + (to-start)*shape(p), t0 + dur*p); }
}
function noiseBuffer(ctx, sec, brown){
  var len = Math.floor(ctx.sampleRate*sec), b = ctx.createBuffer(2, len, ctx.sampleRate), c, d, i, w, last;
  for(c=0;c<2;c++){ d=b.getChannelData(c); last=0; for(i=0;i<len;i++){ w=Math.random()*2-1; if(brown){ last=(last+0.02*w)/1.02; d[i]=last*3.6; } else d[i]=w; } }
  return b;
}
function makeIR(ctx, sec){
  var rate=ctx.sampleRate, len=Math.floor(rate*sec), b=ctx.createBuffer(2,len,rate), c,d,i,t,w,last,e2;
  for(c=0;c<2;c++){ d=b.getChannelData(c); last=0; for(i=0;i<len;i++){ t=i/len; w=Math.random()*2-1; last=(last+0.28*w)/1.28; e2=Math.pow(1-t,2.6)*(1-Math.exp(-i/(rate*0.012))); d[i]=(last*2.4+w*0.22)*e2; } }
  return b;
}
var audioEl = document.getElementById("aout");
function initAudio(){
  if(A) return A;
  var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
  var ctx = new AC();
  var master = ctx.createGain(); master.gain.value = 0.0001;
  var lim = ctx.createDynamicsCompressor();
  try{ lim.threshold.value=-8; lim.knee.value=22; lim.ratio.value=4; lim.attack.value=0.02; lim.release.value=0.5; }catch(e){}
  var roll = ctx.createBiquadFilter(); roll.type="lowpass"; roll.frequency.value=4200; roll.Q.value=0.4;
  var shelf = ctx.createBiquadFilter(); shelf.type="highshelf"; shelf.frequency.value=2400; shelf.gain.value=-7;
  roll.connect(shelf); shelf.connect(lim); lim.connect(master);
  try{ var msd=ctx.createMediaStreamDestination(); master.connect(msd); audioEl.srcObject=msd.stream; var pr=audioEl.play(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){}
  master.connect(ctx.destination);
  /* the output tap: the wind reads the sound it is about to make */
  var tap = ctx.createAnalyser(); tap.fftSize = 1024; tap.smoothingTimeConstant = 0; master.connect(tap);
  var ka = ctx.createConstantSource ? ctx.createConstantSource() : null;
  if(ka){ var kg=ctx.createGain(); kg.gain.value=0.0001; ka.connect(kg); kg.connect(ctx.destination); ka.start(); }
  var dryIn = ctx.createGain(); dryIn.connect(roll);
  var wetIn = ctx.createGain(); var conv = ctx.createConvolver(); conv.normalize = true; try{ conv.buffer = makeIR(ctx, 2.8); }catch(e){}
  var wet = ctx.createGain(); wet.gain.value = 0.42; wetIn.connect(roll); wetIn.connect(conv); conv.connect(wet); wet.connect(roll);
  A = {ctx:ctx, master:master, roll:roll, dryIn:dryIn, wetIn:wetIn, tap:tap, tapBuf:new Float32Array(1024), nodes:[]};
  lastCtxT = ctx.currentTime; lastPerfT = performance.now()/1000;
  ctx.onstatechange = function(){ if(ctx.state==="running" && S.running){ S.schedIdx = S.idx - 1; } };
  try{ if(window.MediaMetadata && navigator.mediaSession){ navigator.mediaSession.metadata = new MediaMetadata({title:"Wind"}); navigator.mediaSession.playbackState="playing";
    ["play","pause"].forEach(function(a){ try{ navigator.mediaSession.setActionHandler(a, function(){ try{ ctx.resume(); audioEl.play(); }catch(e){} }); }catch(e){} }); } }catch(e){}
  return A;
}
function keep(n){ A.nodes.push(n); return n; }
function mkTone(k){
  var ctx=A.ctx, lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1200; lp.Q.value=0.4;
  function voice(freq, amp, dest){ for(var d=0; d<2; d++){ var o=ctx.createOscillator(); o.type="sine"; o.frequency.value=freq; o.detune.value=d?3:-3; var og=ctx.createGain(); og.gain.value=amp*0.5; o.connect(og); og.connect(dest); o.start(); keep(o); } }
  var gHi=ctx.createGain(); gHi.gain.value=0.0001; voice(528,0.55,gHi); voice(792,0.10,gHi); voice(396,0.22,gHi);
  var gLo=ctx.createGain(); gLo.gain.value=0.0001; voice(264,0.60,gLo); voice(132,0.30,gLo); voice(396,0.14,gLo);
  gHi.connect(lp); gLo.connect(lp); lp.connect(A.wetIn);
  return {kind:"tone", hi:gHi, lo:gLo, lp:lp, k:k};
}
function mkBreath(k){
  var ctx=A.ctx, src=ctx.createBufferSource(); src.buffer=noiseBuffer(ctx,5,true); src.loop=true;
  var bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=800; bp.Q.value=0.9;
  var pk=ctx.createBiquadFilter(); pk.type="peaking"; pk.frequency.value=528; pk.Q.value=1.2; pk.gain.value=4;
  var lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2300; lp.Q.value=0.4;
  var g=ctx.createGain(); g.gain.value=0.0001;
  src.connect(bp); bp.connect(pk); pk.connect(lp); lp.connect(g); g.connect(A.dryIn); src.start(); keep(src);
  return {kind:"breath", g:g, bp:bp, lp:lp, k:k};
}
function makeScheme(name, dim){ if(!A) return null; var k=dim?0.7:1; A.roll.frequency.value=dim?2600:4200; return name==="breath"?mkBreath(k):mkTone(k); }
function schemePhase(kind, at, dur){
  if(!scheme || !A) return;
  var s=scheme, k=s.k, g=Math.max(dur,0.35);
  if(s.kind==="tone"){
    var hi=0.30*k, lo=0.26*k;
    if(kind==="in"){ env(s.hi.gain,0.0001,hi,at,g*0.8,easeIO); env(s.hi.gain,hi,hi*0.85,at+g*0.8,g*0.2,easeIO); env(s.lo.gain,s.lo.gain.value,0.03*k,at,g*0.5,easeIO); env(s.lp.frequency,900,2200,at,g,easeIO); }
    else if(kind==="hold"){ env(s.hi.gain,s.hi.gain.value,0.0001,at,Math.min(g*0.3,0.45),easeOut); env(s.lo.gain,s.lo.gain.value,0.0001,at,Math.min(g*0.3,0.45),easeOut); }
    else if(kind==="out"){ env(s.lo.gain,0.0001,lo,at,g*0.25,easeOut); env(s.lo.gain,lo,0.0003,at+g*0.25,g*0.72,easeIO); env(s.hi.gain,s.hi.gain.value,0.0001,at,g*0.4,easeIO); env(s.lp.frequency,1800,640,at,g,easeIO); }
    else { env(s.hi.gain,s.hi.gain.value,0.0001,at,0.4,easeIn); env(s.lo.gain,s.lo.gain.value,0.0001,at,0.4,easeIn); }
  }
  if(s.kind==="breath"){
    var top=1.05*k;
    if(kind==="in"){ env(s.g.gain,0.0001,top,at,g*0.6,easeIO); env(s.g.gain,top,top*0.35,at+g*0.6,g*0.35,easeIO); env(s.bp.frequency,520,1400,at,g,easeIO); env(s.lp.frequency,1800,2600,at,g,easeIO); }
    else if(kind==="hold"){ env(s.g.gain,s.g.gain.value,0.0001,at,0.3,easeOut); }

  if(st.stage==="rest") fs.flow*=0.45;
  var a=audioAmp(); if(a<0) a=bell*0.6; ampSm += (a-ampSm)*0.25; fs.amp=ampSm;
  fs.temp = st.stage==="set" && !S.holdMode && S.reps>1 ? (st.rep-1)/(S.reps-1) : st.stage==="set" && S.holdMode ? Math.min(1,setProgress()/S.holdSec) : st.stage==="rest"?0.5:0.15;
  S.turb *= (1 - 0.12*Math.min(1, (now - (S._lt||now)))); S._lt=now;
  fs.turb=Math.min(1,S.turb);
  fs.ground=ground(fs.fill, fs.temp, fs.dim);
  if(st.k==="done"){ if(lastWord!=="DONE") paintDone(); return; }
  elEnd.classList.remove("hid");
  var isRest=st.stage==="rest", isSet=st.stage==="set";
  var word = isRest ? "REST" : WORDS[st.k];
  lastWord=txt(elWordI, word, lastWord);
  if(isRest){ var left=rem,i; for(i=S.idx+1;i<S.steps.length&&S.steps[i].stage==="rest"&&S.steps[i].set===st.set;i++) left+=S.steps[i].dur; lastNum=txt(elNum,fmtClock(left),lastNum); }
  else { var shown=Math.min(Math.ceil(rem-0.001),Math.ceil(st.dur)); lastNum=txt(elNum, st.k==="empty"?"":st.k==="tap"?String(3-S.taps.length):String(shown||1), lastNum); }
  setRail(st.k==="in"||st.k==="hold"||st.k==="out"?st.k:null);
  var meta;
  if(st.k==="tap") meta="TAP EACH BREATH IN";
  else if(isRest) meta="REST · SET "+st.set+"/"+S.sets;
  else if(S.holdMode && isSet){ var pr=setProgress(); meta="SET "+st.set+"/"+S.sets+" · "+Math.ceil(S.holdSec-pr)+"S"; }
  else if(S.mode==="breathe"){ meta = isSet ? ("CYCLE "+st.rep+"/"+S.reps + (S.follow ? " · "+(60/(st.dur/(st.k==="in"?0.45:0.55))).toFixed(1)+"/MIN" : "")) : ""; }
  else meta="SET "+st.set+"/"+S.sets+(isSet?" · "+st.rep+"/"+S.reps:"");
  lastMeta=txt(elMeta, meta, lastMeta);
  setFoot(isRest?"skip": (isSet && S.mode==="lift") ? "save" : null);
}
function idleRender(t){
  var fs=frameState; fs.idle=true; fs.phase="idle"; fs.stage=""; fs.flow=0; fs.amp=0.2; fs.turb=Math.max(0, fs.turb-0.01);
  fs.fill = 0.28 + 0.12*Math.sin(t*0.35); fs.temp=0.1; fs.dim=1; fs.ground=ground(fs.fill, fs.temp, 1);
}

/* ============================ LOOP ============================ */
var raf=0, lastT=0, perfOn=!!Q.perf, fpsEMA=60, frameNo=0, probeStage=0, PROBE_AT=[1.5,4,7];
function tick(){
  raf=requestAnimationFrame(tick);
  var now=nowSec(), t=performance.now()/1000, dt=lastT?Math.min(1/30, t-lastT):1/60; lastT=t;
  if(S.running){
    if(S.dyn && S.steps[S.idx] && S.steps[S.idx].k!=="tap"){ while(S.dyn.left>0 && S.steps.length-S.idx<=3) appendCycle(S.steps); }
    var guard=0;
    while(S.idx<S.steps.length-1 && now>=S.stepStart+S.steps[S.idx].dur && guard++<400){
      var prev=S.steps[S.idx]; S.stepStart+=prev.dur; S.idx++; var cur=S.steps[S.idx];
      if(prev.stage==="set" && !(cur.stage==="set"&&cur.set===prev.set)) recordSet(prev.set, S.holdMode?S.holdSec:S.reps);
    }
    scheduleAhead(now);
    if(S.steps[S.idx]&&S.steps[S.idx].k==="done") endSession(true);
  }
  if(elRun.classList.contains("on")) render(now); else idleRender(t);
  if(MASK.dirty){ buildMask(elRun.classList.contains("on") ? elWordI : (document.getElementById("s-home").classList.contains("on") ? elMark : null)); }
  var c0=performance.now();
  if(ENG.inst){ if(ENG.inst.isLost && ENG.inst.isLost()){ pickEngine("memory"); ENG.reason="GPU context lost"; refreshEngineNote(); } else ENG.inst.frame(dt, frameState, t); }
  var cpu=performance.now()-c0; budget(cpu, t);
  frameNo++;
  if(Q.probe && ENG.inst && ENG.inst.probe && probeStage<PROBE_AT.length && t>=PROBE_AT[probeStage]){ probeStage++; console.log("PROBE t="+t.toFixed(1)+" frame "+frameNo+" phase="+frameState.phase+" fill="+frameState.fill.toFixed(2)+" flow="+frameState.flow.toFixed(2)+" amp="+frameState.amp.toFixed(2)+" vp="+window.innerWidth+"x"+window.innerHeight+" eng="+ENG.name+" reason="+ENG.reason+" dt="+dt.toFixed(4)); ENG.inst.probe(); }
  if(perfOn){ fpsEMA += (1/Math.max(dt,1e-3)-fpsEMA)*0.05; elPerf.style.display="block"; elPerf.textContent = ENG.name+"  "+(ENG.inst?ENG.inst.info():"")+"\n"+cpuEMA.toFixed(1)+" ms engine · "+fpsEMA.toFixed(0)+" fps"; }
}

/* ============================ UI ============================ */
function fmtN(v){ return (Math.round(v*10)/10).toString(); }
var setupMode="lift";
function refresh(){
  var L=DB.cfg.lift, P=DB.cfg.breathe, T=L.tune[L.preset], i, isHold=L.preset==="hold";
  document.getElementById("v-reps").textContent=L.reps; document.getElementById("v-sets").textContent=L.sets; document.getElementById("v-holdSec").textContent=L.holdSec; document.getElementById("v-cycles").textContent=P.cycles;
  document.getElementById("row-reps").classList.toggle("hid",isHold); document.getElementById("row-hsec").classList.toggle("hid",!isHold);
  document.getElementById("preset-sub").textContent = fmtN(T["in"])+(T.hold>0?" · "+fmtN(T.hold):"")+" · "+fmtN(T.out)+"   —   rest "+fmtClock(T.rest);
  document.getElementById("pat-sub").textContent = P.pat==="follow" ? "Tap at the start of three breaths in. It starts at your pace and leads you down to 5.5 a minute." : P.pat==="coh" ? "Coherent breathing, 5.5 a minute." : "Relaxing breath. Long exhale.";
  document.getElementById("setup-lift").classList.toggle("hid", setupMode!=="lift"); document.getElementById("setup-breathe").classList.toggle("hid", setupMode!=="breathe");
  document.getElementById("setup-title").textContent = setupMode==="lift"?"Lift":"Breathe";
  document.getElementById("setupnote").textContent = ENG.name==="field" ? "The wind reads the sound it makes: the gust you hear is the gust you see." : "";
  var segP=document.querySelectorAll("#seg-preset button"); for(i=0;i<segP.length;i++) segP[i].classList.toggle("sel", segP[i].getAttribute("data-preset")===L.preset);
  var segPat=document.querySelectorAll("#seg-pat button"); for(i=0;i<segPat.length;i++) segPat[i].classList.toggle("sel", segPat[i].getAttribute("data-pat")===P.pat);
  var snd=document.querySelectorAll("[data-sound]"); for(i=0;i<snd.length;i++) snd[i].classList.toggle("sel", DB.cfg[setupMode].sound===snd[i].getAttribute("data-sound"));
}
var LIM={reps:[1,60,1],sets:[1,20,1],holdSec:[5,300,5],cycles:[1,40,1]};
function bump(key,delta){ var tgt=key==="cycles"?DB.cfg.breathe:DB.cfg.lift, lim=LIM[key], v=(+tgt[key])+delta; v=Math.max(lim[0],Math.min(lim[1],v)); tgt[key]=v; save(); refresh(); }
function show(id){
  var ids=["home","setup","run"]; for(var i=0;i<ids.length;i++) document.getElementById("s-"+ids[i]).classList.toggle("on", ids[i]===id);
  if(id==="setup") refresh(); if(id==="home") refreshEngineNote();
  MASK.dirty=true;
}
document.addEventListener("click", function(ev){
  var t=ev.target.closest ? ev.target.closest("[data-go],[data-s],[data-preset],[data-pat],[data-sound],[data-eng]") : null; if(!t||t.disabled) return; var v;
  if((v=t.getAttribute("data-go"))){ if(S.running) return; if(v==="lift"||v==="breathe"){ setupMode=v; show("setup"); } else show(v); return; }
  if((v=t.getAttribute("data-s"))){ var p=v.split(":"); bump(p[0],parseFloat(p[1])); return; }
  if((v=t.getAttribute("data-preset"))){ DB.cfg.lift.preset=v; save(); refresh(); return; }
  if((v=t.getAttribute("data-pat"))){ DB.cfg.breathe.pat=v; save(); refresh(); return; }
  if((v=t.getAttribute("data-sound"))){ DB.cfg[setupMode].sound=v; save(); refresh(); return; }
  if((v=t.getAttribute("data-eng"))){ DB.cfg.engine=v; DB.cfg.chose=true; save(); pickEngine(v); return; }
});
document.getElementById("b-start").addEventListener("click", function(){ startSession(setupMode); });
bSkip.addEventListener("click", function(e){ e.stopPropagation(); skipRest(); });
bSave.addEventListener("click", function(e){ e.stopPropagation(); saveSet(); });
bBack.addEventListener("click", function(e){ e.stopPropagation(); show("home"); });
elEnd.addEventListener("click", function(e){ e.stopPropagation(); endSession(false); });
/* sync tap: re-anchor the phase to this instant; the miss becomes turbulence */
var elFlash=document.getElementById("flash");
elRun.addEventListener("pointerdown", function(ev){
  if(ev.target.closest && ev.target.closest("button")) return; if(!S.running) return;
  if(A&&A.ctx.state!=="running"){ try{A.ctx.resume();}catch(e){} }
  var st=S.steps[S.idx]; if(!st) return;
  if(st.k==="tap"){ tapCalibrate(); }
  else if(st.stage==="set"){ reanchor(false); }
  else return; elFlash.classList.remove("go"); void elFlash.offsetWidth; elFlash.classList.add("go");
});
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
document.addEventListener("dblclick", function(e){ e.preventDefault(); });
window.addEventListener("resize", function(){ fitWordOnce(); if(ENG.inst) ENG.inst.resize(); MASK.dirty=true; });
try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ fitWordOnce(); MASK.dirty=true; }); }catch(e){}

/* debug handle for the probe harness; harmless in production */
window.WIND = {
  state:function(){ return {eng:ENG.name, reason:ENG.reason, phase:frameState.phase, fill:frameState.fill, flow:frameState.flow, amp:frameState.amp, turb:frameState.turb, idx:S.idx, running:S.running, cpu:cpuEMA, frame:frameNo, info:ENG.inst?ENG.inst.info():""}; },
  probe:function(){ if(ENG.inst&&ENG.inst.probe) ENG.inst.probe(); },
  rects:function(){ var out={}, els=document.querySelectorAll("#s-run .slot, #word span, #num, .rail .r"); for(var i=0;i<els.length;i++){ var r=els[i].getBoundingClientRect(); out[(els[i].id||els[i].className)+"#"+i]=[Math.round(r.left),Math.round(r.top),Math.round(r.width),Math.round(r.height)]; } out.wordSize=getComputedStyle(elWord).fontSize; return out; },
  start:function(m){ setupMode=m||"lift"; startSession(setupMode); }, end:function(){ endSession(false); }, engine:pickEngine, sync:function(){ reanchor(false); }, tap:tapCalibrate, period:function(){ return S.period; }
};
/* ---- boot ---- */
fitWordOnce();
pickEngine(Q.eng || DB.cfg.engine);
refreshEngineNote();
show("home");
if(Q.auto){ setupMode = Q.auto==="breathe"?"breathe":"lift"; setTimeout(function(){ startSession(setupMode); }, 300); }
raf=requestAnimationFrame(tick);
})();
</script>
